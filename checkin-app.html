    /* =========================================================
       PIN hashing (Web Crypto). Optional per profile.
       ========================================================= */
    function hexFromBytes(arr) {
      return Array.from(arr).map(b => b.toString(16).padStart(2,'0')).join('');
    }
    function genSalt() {
      const arr = new Uint8Array(16);
      crypto.getRandomValues(arr);
      return hexFromBytes(arr);
    }
    async function hashPin(pin, salt) {
      const data = new TextEncoder().encode(salt + ':' + pin);
      const buf  = await crypto.subtle.digest('SHA-256', data);
      return hexFromBytes(new Uint8Array(buf));
    }
    function genProfileId() {
      const arr = new Uint8Array(8);
      crypto.getRandomValues(arr);
      return 'p_' + hexFromBytes(arr);
    }

    /* Sage-anchored deterministic color per profile/name. */
    const AVATAR_COLORS = [
      '#3F6B3A', '#4D7A4A', '#5B8E63', '#6BA15F', '#7AAD73',
      '#8FA265', '#A89F4F', '#C68F2A', '#C77450', '#B5562B',
      '#7B7F8C', '#5F8294',
    ];
    function colorFor(s) {
      let h = 0;
      const str = String(s || '');
      for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) >>> 0;
      return AVATAR_COLORS[h % AVATAR_COLORS.length];
    }
    function initialsOf(name) {
      const parts = String(name || '').trim().split(/\s+/);
      if (parts.length === 0) return '?';
      if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
      return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
    }

    /* =========================================================
       Migration: if we have history but no profiles, seed
       profiles from the unique person_id values so existing
       data isn't orphaned.
       ========================================================= */
    function loadProfiles() {
      // No auto-seeding from history. The login screen is the gate: until
      // the user has either signed up or signed in, they can't see anything.
      // Old history rows stay in localStorage; they become visible again
      // automatically if the user signs up with a name whose personId
      // matches their historical person_id.
      const stored = loadJson(PROFILES_KEY, null);
      if (!Array.isArray(stored)) return [];
      // Migrate legacy PIN-only profiles to the email + password schema.
      // Old PINs become the password; the synthesized email is just so the
      // user has something to type at the sign-in screen. If they don't
      // remember any of this, the "Start fresh" link wipes everything.
      let dirty = false;
      const migrated = stored.map(p => {
        const next = { ...p };
        if (!next.passwordHash && next.pinHash) {
          next.passwordHash = next.pinHash;
          dirty = true;
        }
        if (!next.email && next.name) {
          next.email = `${(next.personId || next.name)
            .toLowerCase().replace(/[^a-z0-9]+/g, '')}@local`;
          dirty = true;
        }
        return next;
      });
      if (dirty) saveJson(PROFILES_KEY, migrated);
      return migrated;
    }

    /* =========================================================
       Dates / insights / CSV / reminders — same as before
       ========================================================= */
    function mondayOf(d) {
      const m = new Date(d);
      const day = (m.getDay() + 6) % 7;
      m.setDate(m.getDate() - day);
      m.setHours(0, 0, 0, 0);
      return m;
    }
    function isoDate(d) { return mondayOf(d).toISOString().slice(0, 10); }
    function todayLabel() {
      return new Date().toLocaleDateString(undefined,
        { weekday: 'long', month: 'long', day: 'numeric' });
    }
    function shortDate(iso) {
      return new Date(iso).toLocaleDateString(undefined,
        { month: 'short', day: 'numeric', year: 'numeric' });
    }
    function relWeek(iso) {
      const wk = mondayOf(new Date(iso));
      const now = mondayOf(new Date());
      const days = Math.round((now - wk) / 86400e3);
      if (days < 7)  return 'This week';
      if (days < 14) return 'Last week';
      const weeks = Math.round(days / 7);
      return `${weeks} weeks ago`;
    }
    function relDay(iso) {
      const d = new Date(iso); d.setHours(0,0,0,0);
      const now = new Date(); now.setHours(0,0,0,0);
      const days = Math.round((now - d) / 86400e3);
      if (days <= 0) return 'Today';
      if (days === 1) return 'Yesterday';
      if (days < 7)  return `${days} days ago`;
      return relWeek(iso);
    }
    const DOWS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

    function uniqueWeekKeys(history) {
      return [...new Set(history.map(e => isoDate(new Date(e.when))))];
    }
    function computeStreak(history) {
      if (history.length === 0) return 0;
      const sorted = [...new Set(history.map(e =>
        mondayOf(new Date(e.when)).getTime()
      ))].sort((a, b) => b - a);
      let streak = 1;
      for (let i = 1; i < sorted.length; i++) {
        if (sorted[i - 1] - sorted[i] === 7 * 86400e3) streak++;
        else break;
      }
      return streak;
    }

    function buildInsights(personHist, latest) {
      if (!latest) return [];
      const out = [];
      const recent = personHist.slice(0, 12);
      const risks  = recent.map(e => e.risk);

      let elevStreak = 0;
      for (const e of personHist) {
        if (e.risk >= 0.56) elevStreak++; else break;
      }
      if (elevStreak >= 3) {
        out.push({ kind: 'bad', text:
          `${elevStreak} check-ins in a row at high strain or higher.` });
      } else if (elevStreak === 2) {
        out.push({ kind: 'warn', text: `Second consecutive day at high strain or higher.` });
      }

      if (personHist.length >= 4) {
        const pastStress = personHist.slice(1).map(e => e.signals.stress);
        if (latest.signals.stress > Math.max(...pastStress)) {
          out.push({ kind: 'bad', text:
            `Highest stress in ${personHist.length - 1} recent check-ins.` });
        }
        const pastSleep = personHist.slice(1).map(e => e.signals.sleep);
        if (latest.signals.sleep < Math.min(...pastSleep)) {
          out.push({ kind: 'bad', text:
            `Lowest sleep in ${personHist.length - 1} recent check-ins.` });
        }
      }

      if (personHist.length >= 8) {
        const a = risks.slice(0, 4).reduce((s,v)=>s+v,0)/4;
        const b = personHist.slice(4, 8).reduce((s,e)=>s+e.risk,0)/4;
        const delta = a - b;
        if (delta >= 0.10) {
          out.push({ kind: 'warn', text:
            `Risk trending up: last 4 check-ins averaged ${(a*100).toFixed(0)}%, ` +
            `previous 4 averaged ${(b*100).toFixed(0)}%.` });
        } else if (delta <= -0.10) {
          out.push({ kind: 'good', text:
            `Risk trending down: last 4 check-ins averaged ${(a*100).toFixed(0)}%, ` +
            `down from ${(b*100).toFixed(0)}%.` });
        }
      }

      const ptoIdx = personHist.findIndex(e => e.events.includes('pto'));
      if (ptoIdx >= 8) {
        out.push({ kind: 'warn', text: `${ptoIdx}+ check-ins since you logged a recovery day.` });
      } else if (ptoIdx === -1 && personHist.length >= 8) {
        out.push({ kind: 'warn', text: `No recovery day logged in the last ${personHist.length} check-ins.` });
      }

      if (out.length === 0 && personHist.length >= 4) {
        out.push({ kind: 'good', text:
          `Steady pattern. Nothing unusual vs your last ${personHist.length - 1} check-ins.` });
      }
      return out.slice(0, 4);
    }

    /* CSV — one row per daily check-in. `date` is the calendar day
       of the entry; `week_start` is kept as the Monday-of-week alias so
       older versions of load_real.py / train_real.py still parse it.

       Two events columns are written:
         - `events`        : model-vocabulary events (deadline_crunch,
                             personal_shock, pto, ...) so train_real.py
                             can compute rolling event features
                             unchanged.
         - `events_chips`  : the original user-facing chip keys
                             (exams, family, health, ...) so future
                             analysis can drill into the human-friendly
                             vocabulary. */
    const EXPORT_COLS = [
      'person_id', 'team_id', 'date', 'week_start', 'submitted_at',
      'hours', 'sleep', 'mood', 'stress',
      'mgr_support', 'peer_support', 'deadline_pressure', 'on_call_load',
      'events', 'events_chips', 'burnout', 'feeling',
      'risk_percent', 'verdict', 'recovery_status', 'recovery_score',
      'tracker_sleep_quality', 'tracker_hydration', 'tracker_movement',
      'tracker_breaks', 'tracker_recovery_time', 'tracker_screen_time',
      'tracker_caffeine', 'tracker_social_connection', 'tracker_motivation',
      'tracker_alcohol', 'tracker_nicotine',
      'notes',
    ];
    const FEELING_TO_BURNOUT = { fine: 0, managing: 0, burned: 1 };
    function csvEscape(v) {
      const s = v == null ? '' : String(v);
      return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
    }
    function exportCsv(history) {
      const rows = history.map(e => {
        const tracker = e.tracker || getTrackerForDate(e.person_id || 'me', e.when);
        const rec = e.recoveryStatus || recoveryStatus(tracker);
        return {
          person_id:    e.person_id || 'me',
          team_id:      e.person_id || 'me',
          date:         new Date(e.when).toISOString().slice(0, 10),
          week_start:   isoDate(new Date(e.when)),
          submitted_at: e.when,
          hours: e.signals.hours, sleep: e.signals.sleep,
          mood:  e.signals.mood,  stress: e.signals.stress,
          mgr_support: e.signals.mgr_support,
          peer_support: e.signals.peer_support,
          deadline_pressure: e.signals.deadline_pressure,
          on_call_load: e.signals.on_call_load,
          events: [...eventsForModel(new Set(e.events || []))].join('|'),
          events_chips: (e.events || []).join('|'),
          burnout: FEELING_TO_BURNOUT[e.feeling] ?? 0,
          feeling: e.feeling,
          risk_percent: (e.risk * 100).toFixed(1),
          verdict: e.verdict,
          recovery_status: rec.label,
          recovery_score: rec.score == null ? '' : rec.score,
          tracker_sleep_quality: tracker.sleepQuality || '',
          tracker_hydration: tracker.hydration || '',
          tracker_movement: tracker.movement || '',
          tracker_breaks: tracker.breaks || '',
          tracker_recovery_time: tracker.recoveryTime || '',
          tracker_screen_time: tracker.screenTime || '',
          tracker_caffeine: tracker.caffeine || '',
          tracker_social_connection: tracker.socialConnection || '',
          tracker_motivation: tracker.motivation || '',
          tracker_alcohol: tracker.alcohol || '',
          tracker_nicotine: tracker.nicotine || '',
          notes: e.notes || '',
        };
      });
      return [
        EXPORT_COLS.join(','),
        ...rows.map(r => EXPORT_COLS.map(c => csvEscape(r[c])).join(',')),
      ].join('\n');
    }
    function parseCsvLine(line) {
      const out = []; let cur = '', q = false;
      for (let i = 0; i < line.length; i++) {
        const c = line[i];
        if (q) {
          if (c === '"' && line[i + 1] === '"') { cur += '"'; i++; }
          else if (c === '"') q = false;
          else cur += c;
        } else {
          if (c === ',') { out.push(cur); cur = ''; }
          else if (c === '"' && cur === '') q = true;
          else cur += c;
        }
      }
      out.push(cur);
      return out;
    }
    function parseCsv(text) {
      const lines = text.split(/\r?\n/).filter(l => l.trim().length);
      if (lines.length < 2) return [];
      const header = parseCsvLine(lines[0]).map(h => h.trim());
      return lines.slice(1).map(line => {
        const cells = parseCsvLine(line);
        const row = {};
        header.forEach((h, i) => row[h] = cells[i]);
        return row;
      });
    }
    function importCsv(text, existing, scorer) {
      const rows = parseCsv(text);
      let added = 0, skipped = 0;
      const known = new Set(existing.map(e => `${e.person_id}|${e.when}`));
      const next = [...existing];
      const now = Date.now();
      rows.forEach((r, i) => {
        const when = r.submitted_at || r.when ||
                     (r.date ? new Date(r.date).toISOString() : null) ||
                     (r.week_start ? new Date(r.week_start).toISOString() : null);
        if (!when) { skipped++; return; }
        const person_id = (r.person_id || 'me').trim() || 'me';
        if (known.has(`${person_id}|${when}`)) { skipped++; return; }
        const num = (k, d) => {
          const v = parseFloat(r[k]);
          return Number.isFinite(v) ? v : d;
        };
        const signals = {
          hours: num('hours', 8), sleep: num('sleep', 7),
          mood: num('mood', 7), stress: num('stress', 5),
          mgr_support: num('mgr_support', 7),
          peer_support: num('peer_support', 7),
          deadline_pressure: num('deadline_pressure', 4),
          on_call_load: num('on_call_load', 0),
        };
        // Prefer the human-friendly `events_chips` column if it's
        // present (newer exports). Fall back to the model-vocabulary
        // `events` column for older / external CSVs.
        const eventsRaw = (r.events_chips || r.events || '')
          .split('|').map(s => s.trim()).filter(Boolean);
        const events = eventsRaw;
        const feeling = r.feeling || (parseInt(r.burnout) === 1 ? 'burned' : 'managing');
        const tracker = {
          sleepQuality: r.tracker_sleep_quality,
          hydration: r.tracker_hydration,
          movement: r.tracker_movement,
          breaks: r.tracker_breaks,
          recoveryTime: r.tracker_recovery_time,
          screenTime: r.tracker_screen_time,
          caffeine: r.tracker_caffeine,
          socialConnection: r.tracker_social_connection,
          motivation: r.tracker_motivation,
          alcohol: r.tracker_alcohol,
          nicotine: r.tracker_nicotine,
        };
        Object.keys(tracker).forEach(k => { if (!tracker[k]) delete tracker[k]; });
        const rec = recoveryStatus(tracker);
        const eventSet = new Set(events);
        const priorNewestFirst = next
          .filter(e =>
            e.person_id === person_id
            && new Date(e.when).getTime() < new Date(when).getTime())
          .sort((a, b) => new Date(b.when) - new Date(a.when))
          .slice(0, 28);
        const risk = scorer(signals, eventSet, feeling, priorNewestFirst);
        next.push({
          id: now + i, when, person_id, signals, events, feeling,
          tracker, recoveryStatus: rec,
          notes: r.notes || '',
          risk, verdict: verdict(risk).label,
        });
        known.add(`${person_id}|${when}`);
        added++;
      });
      next.sort((a, b) => new Date(b.when) - new Date(a.when));
      return { history: next, added, skipped };
    }

    /* Reminders — fire once per day. */
    async function maybeRemind(history, dow, personId) {
      if (dow == null || dow === '') return;
      if (!('Notification' in window)) return;
      if (Notification.permission !== 'granted') return;
      const today = new Date();
      if (today.getDay() !== parseInt(dow)) return;
      const todayIso = today.toISOString().slice(0, 10);
      const hasToday = history.some(e =>
        e.person_id === personId
        && new Date(e.when).toISOString().slice(0, 10) === todayIso);
      if (hasToday) return;
      const todayKey = today.toDateString();
      if (sessionStorage.getItem('reminded_' + todayKey)) return;
      sessionStorage.setItem('reminded_' + todayKey, '1');
      try {
        new Notification("WellCare check-in", {
          body: "Two minutes today saves a tough day later. Tap to log how you're doing.",
          tag: "wellcare-checkin-daily",
        });
      } catch {}
    }

    /* =========================================================
       Static config
       ========================================================= */
    // Daily-scale defaults: `hours` is study/workload hours TODAY (0–16) and
    // `sleep` is hours slept LAST NIGHT. The trained model expects
    // weekly hours, so we convert on the way into the scorer — see
    // signalsForModel().
    const DEFAULTS = {
      hours: 8, sleep: 7,
      // All 1–10 sliders start in the middle so the user has to actively
      // place themselves rather than nudge from a random pre-set.
      mood: 5, stress: 5,
      mgr_support: 5, peer_support: 5,
      deadline_pressure: 5,
      on_call_load: 0,
    };
    /* Life-context chips shown on the wizard's "what's putting pressure
       on you" screen. We keep the keys short and snake_case for storage
       but show warm, supportive labels.

       `none` is an exclusive option: tapping it clears everything else,
       and tapping any other chip clears `none`. See toggleEvent below.

       The model was trained on a smaller event vocabulary
       (deadline_crunch, reorg, layoff, pto, personal_shock,
       recognition). EVENT_TO_MODEL maps each user-friendly chip to
       whichever model event it most closely resembles so the trained
       scorer still gets the right signal. Chips that don't map (bad
       sleep, work stress, feeling good, etc.) influence the model
       only through the slider answers — which is exactly right
       because those things are already measured on the sliders. */
    const EVENTS = [
      { key: 'exams',          label: 'Exams / deadlines' },
      { key: 'bad_sleep',      label: 'Bad sleep' },
      { key: 'overwhelm',      label: 'Too much going on' },
      { key: 'work_stress',    label: 'Work stress' },
      { key: 'family',         label: 'Family stuff' },
      { key: 'relationship',   label: 'Relationship issues' },
      { key: 'unmotivated',    label: 'Feeling unmotivated' },
      { key: 'social_burnout', label: 'Social burnout' },
      { key: 'big_change',     label: 'Big life change' },
      { key: 'health',         label: 'Health issues' },
      { key: 'finances',       label: 'Financial stress' },
      { key: 'travel',         label: 'Traveling / routine change' },
      { key: 'conflict',       label: 'Conflict with someone' },
      { key: 'pto',            label: 'Taking time off' },
      { key: 'good',           label: 'Actually feeling good lately' },
      { key: 'none',           label: 'Nothing specific' },
    ];

    const EVENT_EXCLUSIVE = 'none';

    const EVENT_TO_MODEL = {
      exams:          'deadline_crunch',
      pto:            'pto',
      big_change:     'reorg',
      family:         'personal_shock',
      relationship:   'personal_shock',
      social_burnout: 'personal_shock',
      health:         'personal_shock',
      finances:       'personal_shock',
      conflict:       'personal_shock',
      good:           'recognition',
    };

    /* Translate user-facing chip keys into the trained-model
       event vocabulary. Anything not in the map drops out silently. */
    function eventsForModel(userEvents) {
      const set = userEvents instanceof Set ? userEvents : new Set(userEvents || []);
      const out = new Set();
      for (const k of set) {
        const mapped = EVENT_TO_MODEL[k];
        if (mapped) out.add(mapped);
      }
      return out;
    }

    function Avatar({ name, color, size }) {

    function Sparkline({ data }) {
      if (!data || data.length < 2) {
        return (
          <div style={{ height: 80, display: 'flex',
                        alignItems: 'center', justifyContent: 'center',
                        color: 'var(--text-soft)', fontSize: 12 }}>
            Need at least 2 check-ins for the trend line.
          </div>
        );
      }
      const W = 480, H = 80, P = 6;
      const xs = data.map((_, i) => P + i * (W - 2 * P) / (data.length - 1));
      const ys = data.map(d => H - P - d.risk * (H - 2 * P));
      const path = xs.map((x, i) =>
        `${i === 0 ? 'M' : 'L'}${x.toFixed(1)},${ys[i].toFixed(1)}`).join(' ');
      const areaPath = path + ` L${xs[xs.length-1].toFixed(1)},${H-P} L${xs[0].toFixed(1)},${H-P} Z`;
      return (
        <svg className="spark" viewBox={`0 0 ${W} ${H}`} preserveAspectRatio="none">
          <defs>
            <linearGradient id="sparkfill" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%"   stopColor="var(--primary)" stopOpacity="0.25" />
              <stop offset="100%" stopColor="var(--primary)" stopOpacity="0" />
            </linearGradient>
          </defs>
          <path d={areaPath} fill="url(#sparkfill)" />
          <path d={path} fill="none" stroke="var(--primary)" strokeWidth="2.5"
                strokeLinecap="round" strokeLinejoin="round" />
          {xs.map((x, i) => (
            <circle key={i} cx={x} cy={ys[i]} r="3" fill="var(--primary)" />
          ))}
        </svg>
      );
    }

    function PinPad({ length = 4, onComplete, error, onClearError }) {
      const [pin, setPin] = useState('');
      useEffect(() => {
        if (pin.length === length) {
          onComplete(pin);
          setPin('');
        }
      }, [pin, length, onComplete]);
      useEffect(() => {
        if (error) {
          const t = setTimeout(() => { onClearError && onClearError(); }, 1200);
          return () => clearTimeout(t);
        }
      }, [error]);

      const press = (n) => setPin(p => p.length < length ? p + n : p);
      const back  = ()  => setPin(p => p.slice(0, -1));

      return (
        <>
          <div className="pin-dots">
            {Array.from({ length }).map((_, i) => (
              <div key={i} className={
                `pin-dot ${i < pin.length ? 'filled' : ''} ${error ? 'error' : ''}`
              } />
            ))}
          </div>
          <div className="pin-error">{error || ''}</div>
          <div className="pin-pad">
            {[1,2,3,4,5,6,7,8,9].map(n => (
              <button key={n} className="pin-key" onClick={() => press(String(n))}>
                {n}
              </button>
            ))}
            <button className="pin-key empty" disabled />
            <button className="pin-key" onClick={() => press('0')}>0</button>
            <button className="pin-key back" onClick={back} aria-label="Backspace">

                <path d="M9 6l-6 6 6 6h11a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2H9z"

                <path d="M13 10l4 4M17 10l-4 4"

              </svg>
            </button>
          </div>
        </>

    }

    function LoginScreen({ profiles, onSignIn, onCreateProfile, onWipe, onTransientToast }) {
      const [mode, setMode]   = useState(profiles.length === 0 ? 'signup' : 'signin');
      const [name, setName]   = useState('');
      const [email, setEmail] = useState('');
      const [pwd, setPwd]     = useState('');
      const [showPwd, setShowPwd] = useState(false);
      const [error, setError] = useState(null);
      const [busy, setBusy]   = useState(false);

      useEffect(() => { setError(null); }, [mode]);

      const submit = async () => {
        if (busy) return;
        setError(null);
        const cleanEmail = email.trim().toLowerCase();

        if (mode === 'signup') {
          const cleanName = name.trim();
          if (!cleanName) { setError('Please enter your name.'); return; }
          if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(cleanEmail)) {
            setError('Please enter a valid email.'); return;
          }
          if (pwd.length < 6) {
            setError('Password must be at least 6 characters.'); return;
          }
          if (profiles.some(p => (p.email || '').toLowerCase() === cleanEmail)) {
            setError('An account with this email already exists. Sign in instead.');
            return;
          }
          setBusy(true);
          try {
            const salt = genSalt();
            const passwordHash = await hashPin(pwd, salt);
            onCreateProfile({
              id: genProfileId(),
              name: cleanName,
              email: cleanEmail,
              personId: cleanName.toLowerCase().replace(/[^a-z0-9]+/g, '_').slice(0,32) || 'me',
              salt, passwordHash,
              color: colorFor(cleanName),
              createdAt: Date.now(),
            });
          } finally { setBusy(false); }
        } else {
          if (!cleanEmail || !pwd) {
            setError('Enter your email and password.'); return;
          }
          const profile = profiles.find(
            p => (p.email || '').toLowerCase() === cleanEmail);
          if (!profile || !profile.passwordHash) {
            setError('No account with that email.'); return;
          }
          setBusy(true);
          try {
            const h = await hashPin(pwd, profile.salt);
            if (h !== profile.passwordHash) {
              setError('Wrong password.');
            } else {
              onSignIn(profile.id);
            }
          } finally { setBusy(false); }
        }
      };

      const onKey = (e) => { if (e.key === 'Enter') submit(); };

      const googleStub = () => {
        if (onTransientToast) {
          onTransientToast('Google sign-in coming soon — for now use email + password.');
        } else {
          alert('Google sign-in coming soon — for now use email + password.');
        }
      };

      return (
        <div className="auth">
          <div className="auth-brand">
            <span className="auth-brand-logo"><BrainLogo /></span>
            <span className="auth-brand-name">WellCare</span>
          </div>

          <h1 className="auth-title">
            {mode === 'signup' ? 'Build your Care Circle' : 'Welcome back'}
          </h1>
          <div className="auth-sub">
            {mode === 'signup'
              ? 'Create an account to start tracking your emotional state.'
              : 'Sign in to continue your check-in journey.'}
          </div>

          <div className="auth-card">
            {mode === 'signup' && (
              <div className="auth-field">
                <label className="auth-field-label">Your Name</label>
                <div className="auth-input-wrap">
                  <IconPerson />
                  <input type="text" autoComplete="name"
                         placeholder="How should we call you?"
                         maxLength={32}
                         value={name}
                         onChange={e => setName(e.target.value)}
                         onKeyDown={onKey} />
                </div>
              </div>
            )}

            <div className="auth-field">
              <label className="auth-field-label">Email</label>
              <div className="auth-input-wrap">
                <IconMail />
                <input type="email" autoComplete="email"
                       placeholder="you@example.com"
                       value={email}
                       onChange={e => setEmail(e.target.value)}
                       onKeyDown={onKey} />
              </div>
            </div>

            <div className="auth-field">
              <label className="auth-field-label">Password</label>
              <div className="auth-input-wrap">
                <IconLock />
                <input type={showPwd ? 'text' : 'password'}
                       autoComplete={mode === 'signup'
                         ? 'new-password' : 'current-password'}
                       placeholder={mode === 'signup'
                         ? 'At least 6 characters'
                         : 'Your password'}
                       value={pwd}

    function NumField({ label, hint, value, min, max, step, onChange }) {
      // Uncontrolled-ish: we keep a local string so the user can type "5."
      // mid-edit without React snapping it back. We commit on blur (and on
      // every valid keystroke). Avoids the dreaded "page jumps on number
      // change" feel — the input no longer round-trips through React state
      // for the raw text.
      const [text, setText] = React.useState(String(value));
      const lastCommitted = React.useRef(value);

      React.useEffect(() => {
        if (value !== lastCommitted.current) {
          setText(String(value));
          lastCommitted.current = value;
        }
      }, [value]);

      const commit = (raw) => {
        const n = parseFloat(raw);
        if (!Number.isFinite(n)) return;
        const clamped = Math.max(min, Math.min(max, n));
        const rounded = step >= 1 ? Math.round(clamped) : Math.round(clamped * 2) / 2;
        lastCommitted.current = rounded;
        onChange(rounded);
        setText(String(rounded));
      };

      const bump = (d) => {
        const cur = Number.isFinite(parseFloat(text)) ? parseFloat(text) : value;
        commit(cur + d);
      };

      const pct = Math.max(0, Math.min(100,
        ((Number(value) - min) / (max - min)) * 100));
      const displayValue = (() => {
        const n = parseFloat(text);
        if (!Number.isFinite(n)) return String(value);
        return step >= 1 ? String(Math.round(n)) : (Math.round(n * 2) / 2).toString();
      })();

      return (
        <div className="num-pro">
          <div className="num-pro-display">
            <span className="num-pro-value">{displayValue}</span>
            {label && <span className="num-pro-unit">{label}</span>}
          </div>

          <div className="num-pro-control">
            <button type="button" className="num-pro-btn"
                    onClick={() => bump(-step)}
                    disabled={value <= min}
                    aria-label="Decrease">−</button>

            <div className="num-pro-track">
              <input type="range"
                     min={min} max={max} step={step}
                     value={Number.isFinite(parseFloat(text)) ? parseFloat(text) : value}
                     style={{ ['--pct']: `${pct}%` }}
                     onChange={e => commit(e.target.value)}
                     aria-label={label || 'value'} />
              <div className="num-pro-scale">
                <span>{min}</span>
                <span>{max}</span>
              </div>
            </div>

            <button type="button" className="num-pro-btn"
                    onClick={() => bump(+step)}
                    disabled={value >= max}
                    aria-label="Increase">+</button>
          </div>
        </div>
      );
    }

    function Slider({ value, onChange, loEnd, hiEnd }) {
      const pct = ((value - 1) / 9) * 100;
      // Clamp the bubble so it never overhangs the track at the extremes.
      const bubblePct = Math.max(4, Math.min(96, pct));
      return (
        <div className="big-slider">
          <div className="big-slider-value" style={{
            left: `calc(${bubblePct}% - 22px)`,
          }}>{value}</div>
          <input type="range" className="slider"
                 min="1" max="10" step="1"
                 value={value}
                 style={{ ['--pct']: `${pct}%` }}
                 onChange={e => onChange(+e.target.value)}
                 aria-label={`${loEnd} to ${hiEnd}`} />
          <div className="big-slider-ticks" aria-hidden="true">
            {Array.from({ length: 10 }, (_, i) => (
              <span key={i} className={`tick ${i + 1 <= value ? 'on' : ''}`} />
            ))}
          </div>
          <div className="scale-ends">
            <span>{loEnd}</span>
            <span>{hiEnd}</span>
          </div>
        </div>

    function CheckinWizard({ initialSignals, initialFeeling, onCancel, onComplete }) {
      const [step, setStep]       = useState(0);
      const [signals, setSignals] = useState(initialSignals);
      const [feeling, setFeeling] = useState(initialFeeling);
      const [events,  setEvents]  = useState(() => new Set());
      const [notes,   setNotes]   = useState('');

      const set = React.useCallback(
        (k, v) => setSignals(s => ({ ...s, [k]: v })),
        []);
      const toggleEvent = React.useCallback(k => setEvents(prev => {
        const n = new Set(prev);
        // "Nothing specific" is exclusive: selecting it wipes the rest,
        // and selecting anything else implicitly un-selects it.
        if (k === EVENT_EXCLUSIVE) {
          if (n.has(EVENT_EXCLUSIVE)) {
            n.delete(EVENT_EXCLUSIVE);
          } else {
            n.clear();
            n.add(EVENT_EXCLUSIVE);
          }
        } else {
          n.delete(EVENT_EXCLUSIVE);
          n.has(k) ? n.delete(k) : n.add(k);
        }
        return n;
      }), []);

      // Wizard slide-in plays once, on mount only.
      const enterRef = useRef(true);
      useEffect(() => { enterRef.current = false; }, []);

      const total = QUESTIONS.length;
      const isLast = step === total - 1;
      const q = QUESTIONS[step];
      const progress = ((step + 1) / total) * 100;

      const next = () => {
        if (isLast) {
          onComplete({ signals, feeling, events: [...events], notes });
        } else {
          setStep(s => s + 1);
        }
      };

      return (
        <div className={`wizard${enterRef.current ? ' enter' : ''}`}>
          <div className="wizard-top">
            <button className="icon-btn solid" aria-label="Close" onClick={onCancel}>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                <path d="M6 6l12 12M18 6L6 18" stroke="currentColor"
                      strokeWidth="2" strokeLinecap="round" />
              </svg>
            </button>
            <div className="wizard-progress-bar">
              <div className="wizard-progress-fill"
                   style={{ width: `${progress}%` }} />
            </div>
            <span className="wizard-count">
              {step + 1}<span style={{ opacity: 0.5 }}> / {total}</span>
            </span>
          </div>

          <div className="wizard-body">
            <QuestionView
              key={step}
              q={q}
              signals={signals} set={set}
              feeling={feeling} setFeeling={setFeeling}
              events={events} toggleEvent={toggleEvent}
              notes={notes} setNotes={setNotes} />
          </div>

          <div className="wizard-bottom">
            {step > 0 ? (
              <button className="cta secondary back-btn"
                      onClick={() => setStep(s => s - 1)}>
                Back
              </button>
            ) : (
              <button className="cta secondary back-btn" onClick={onCancel}>
                Cancel
              </button>
            )}
            <button className="cta next-btn" onClick={next}>
              {isLast ? 'Save check-in' : 'Continue'}
            </button>
          </div>
        </div>
      );
    }

    /* =========================================================

    function HomeTab({ activeProfile, personHist, stats, insights,
                       onStartCheckin, onGoTracker, onToast }) {
      const thisWeekKey = isoDate(new Date());
      const thisWeek = personHist.find(e =>
        isoDate(new Date(e.when)) === thisWeekKey);
      const firstName = activeProfile.name.split(' ')[0];

      /* ---------- Dashboard data (merged from the old Insights tab) ---------- */
      const trackerToday  = getTrackerToday(activeProfile.personId);
      const dailyDelta    = trackerDelta(trackerToday);
      const recStatus     = recoveryStatus(trackerToday);
      const hasData       = personHist.length > 0;
      const latest        = personHist[0];
      const baseRisk      = latest ? latest.risk : 0;
      const displayRisk   = Math.max(0, Math.min(1, baseRisk + dailyDelta));
      const v             = verdict(Math.max(0.001, displayRisk));

      // 7-day vs previous-7-day comparator.
      let compareText = 'no comparison yet';
      if (personHist.length >= 2) {
        const recent = personHist.slice(0, Math.min(7, personHist.length));
        const older  = personHist.slice(7, Math.min(14, personHist.length));
        if (older.length > 0) {
          const avg = a => a.reduce((s, e) => s + e.risk, 0) / a.length;
          const diff = avg(recent) - avg(older);
          if (Math.abs(diff) < 0.03)      compareText = 'stable vs previous days';
          else if (diff > 0)              compareText = `+${(diff * 100).toFixed(0)}% vs previous days`;
          else                            compareText = `${(diff * 100).toFixed(0)}% vs previous days`;
        }
      }

      const chartData = personHist
        .slice(0, 30)
        .map(e => ({ date: e.when, risk: e.risk }))
        .reverse();
      const dims      = computeDimensions(personHist);
      const strongest = strongestDimension(dims);
      const personId  = activeProfile.personId;

      const snPanelRef = React.useRef(null);

      /* ----- Care Circle invite state ----- */
      const [snOpen, setSnOpen] = React.useState(false);
      const [snContacts, setSnContacts] = React.useState(() => {
        try { return JSON.parse(localStorage.getItem('wellcare-safety-net') || '[]'); }
        catch { return []; }
      });
      const [snMethod, setSnMethod] = React.useState('email');
      const [snName, setSnName] = React.useState('');
      const [snValue, setSnValue] = React.useState('');
      const [snRel, setSnRel] = React.useState('Friend');
      const [snThreshold, setSnThreshold] = React.useState(75);

      React.useEffect(() => {
        try { localStorage.setItem('wellcare-safety-net', JSON.stringify(snContacts)); }
        catch {}
      }, [snContacts]);

      const snValid =
        snMethod === 'email'
          ? /\S+@\S+\.\S+/.test(snValue.trim())
          : snValue.replace(/\D/g, '').length >= 7;

      function snInitials(c) {
        const n = (c.name || c.value || '?').trim();
        const parts = n.split(/[\s@.]+/).filter(Boolean);
        const a = (parts[0] || '?')[0] || '?';
        const b = (parts[1] || '')[0] || '';
        return (a + b).toUpperCase();
      }

      function snTimeAgo(ts) {
        const s = Math.max(1, Math.floor((Date.now() - ts) / 1000));
        if (s < 60) return 'just now';
        const m = Math.floor(s / 60);
        if (m < 60) return m + ' min ago';
        const h = Math.floor(m / 60);
        if (h < 24) return h + 'h ago';
        const d = Math.floor(h / 24);
        return d + 'd ago';
      }

      async function snSendInvite() {
        if (!snValid) return;
        const thresholdProb = snThreshold / 100;
        let link = window.location.href.split('#')[0];
        try {
          const token = await createInviteToken(activeProfile, {
            sharingMode: 'supportive',
            alertThreshold: thresholdProb,
          });
          link = inviteLinkForToken(token);
        } catch {}
        const greet = snName.trim()
          ? 'Hi ' + snName.trim().split(' ')[0] + ','
          : 'Hi,';
        const body =
          greet + '\n\n' +
          "I'm using WellCare to check in on my burnout risk, and I'd love " +
          'to have you in my Care Circle. If things get hard, you\u2019ll get ' +
          'a gentle nudge \u2014 no diagnoses, no raw data, just a heads-up ' +
          'so you can reach out.\n\n' +
          'Open the app: ' + link + '\n\n' +
          'Thank you for being there.\n\u2014 ' + firstName;
        const subj = 'Join my Care Circle on WellCare';

        if (snMethod === 'email') {

            ? snValue.split('@')[0]

          method: snMethod,
          value: snValue.trim(),

          threshold: snThreshold,
          invitedAt: Date.now(),

          alertThreshold: thresholdProb,

        setSnContacts(cs => [newC, ...cs]);
        setSnName('');
        setSnValue('');
        onToast && onToast('Invite created in Care Circle');

                  return (
                    <li key={e.id} className="mini-item">
                      <div className="mini-date">
                        <div className="when">{shortDate(e.when)}</div>
                        {e.notes && <div className="note">"{e.notes}"</div>}
                      </div>
                      <span className="mini-tag" style={{ color: ev.color }}>{ev.label}</span>
                      <span className="mini-pct" style={{ color: ev.color }}>
                        {(shownRisk * 100).toFixed(0)}%
                      </span>
                    </li>
                  );
                })}
              </ul>
            )}
          </div>

        </div>
      );
    }

    /* =========================================================
       TAB CONTENT — Insights
       ========================================================= */
    function RiskRing({ pct, color, label }) {
      const r = 70;
      const C = 2 * Math.PI * r;
      const offset = C * (1 - Math.max(0, Math.min(1, pct)));
      const size = 200;
      const c = size / 2;
      return (
        <div className="ring-wrap">
          <svg className="ring-svg" width={size} height={size}
               viewBox={`0 0 ${size} ${size}`}>
            <circle className="ring-track" cx={c} cy={c} r={r}
                    fill="none" strokeWidth="14"/>
            <circle className="ring-fill" cx={c} cy={c} r={r}
                    fill="none" strokeWidth="14"
                    strokeDasharray={C}
                    strokeDashoffset={offset}
                    strokeLinecap="round"
                    style={{ stroke: color,
                             transform: `rotate(-90deg)`,
                             transformOrigin: 'center' }}/>
            <text x={c} y={c - 8} className="ring-pct"
                  style={{ fill: color }}
                  textAnchor="middle" dominantBaseline="middle">
              {(pct * 100).toFixed(0)}%
            </text>
            <text x={c} y={c + 42} className="ring-label"
                  style={{ fill: color }}
                  textAnchor="middle" dominantBaseline="middle">
              {label}
            </text>
          </svg>
        </div>
      );
    }

    /* =========================================================
       Burnout Risk Over Time
       - Accepts [{ date, risk }] where risk is 0..1
       - Filters out invalid dates / risks
       - Empty state when < 3 valid points
       - Risk-aware colors driven by the latest valid point
       - Smooth curve + soft gradient area + dots + tooltip
       ========================================================= */
    function riskLevel(pct100) {
      if (pct100 >= 76) return { key: 'severe', label: 'Critical strain' };
      if (pct100 >= 56) return { key: 'high', label: 'High strain' };
      if (pct100 >= 31) return { key: 'elev', label: 'Moderate strain' };
      return { key: 'low', label: 'Lower strain' };
    }

    function fmtTrendDate(iso) {
      if (!iso) return '';
      const d = new Date(iso);
      if (Number.isNaN(d.getTime())) return '';
      return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
    }

    function TrendEmpty() {
      return (
        <div className="trend-empty">
          <svg width="120" height="64" viewBox="0 0 120 64" fill="none" aria-hidden="true">
            <line x1="8"  y1="52" x2="112" y2="52" stroke="currentColor" strokeWidth="1" strokeDasharray="2 4" opacity="0.6"/>
            <line x1="8"  y1="32" x2="112" y2="32" stroke="currentColor" strokeWidth="1" strokeDasharray="2 4" opacity="0.4"/>
            <line x1="8"  y1="12" x2="112" y2="12" stroke="currentColor" strokeWidth="1" strokeDasharray="2 4" opacity="0.25"/>
            <path d="M10 44 C 30 36, 50 28, 70 30 S 100 18, 112 22"
                  stroke="currentColor" strokeWidth="2" fill="none"
                  strokeLinecap="round" opacity="0.7"/>
            <circle cx="30" cy="36" r="2.6" fill="currentColor" opacity="0.85"/>
            <circle cx="60" cy="29" r="2.6" fill="currentColor" opacity="0.85"/>
            <circle cx="90" cy="24" r="2.6" fill="currentColor" opacity="0.85"/>
          </svg>
          <div className="title">Your trend will appear after a few check-ins.</div>
          <div className="body">
            Check in for a few days to see how your burnout risk changes
            over time.
          </div>
          <div className="hint">
            We'll look for patterns in energy, overwhelm, recovery and stress load.
          </div>
        </div>
      );
    }

    function TrendChart({ data }) {
      const [hover, setHover] = useState(null);

      // 1. Validate: keep only entries with a parseable date and a
      //    finite risk score in [0, 1].
      const valid = useMemo(() => {
        if (!Array.isArray(data)) return [];
        return data
          .map(d => {
            const t = d && d.date ? new Date(d.date) : null;
            const ts = t && !Number.isNaN(t.getTime()) ? t.getTime() : null;
            const r = Number(d && d.risk);
            if (ts == null) return null;
            if (!Number.isFinite(r) || r < 0 || r > 1) return null;
            return { ts, date: d.date, risk: r };
          })
          .filter(Boolean)
          .sort((a, b) => a.ts - b.ts);
      }, [data]);

      if (valid.length < 3) return <TrendEmpty />;

      // 2. Latest + previous → trend + risk colour driven by the latest.
      const latest    = valid[valid.length - 1];
      const previous  = valid[valid.length - 2];
      const latestPct = Math.round(latest.risk * 100);
      const lvl       = riskLevel(latestPct);
      const diff      = (latest.risk - previous.risk) * 100;
      const trend     = diff > 5 ? { key: 'up',   label: 'Rising',  arrow: '↑' }
                      : diff < -5 ? { key: 'down', label: 'Falling', arrow: '↓' }
                      :             { key: 'flat', label: 'Stable',  arrow: '→' };

      // 3. Geometry — responsive via viewBox.
      const W = 360, H = 200;
      const padL = 34, padR = 12, padT = 12, padB = 32;
      const innerW = W - padL - padR;
      const innerH = H - padT - padB;
      const n = valid.length;
      const xOf = i => padL + (i / (n - 1)) * innerW;
      const yOf = r => padT + (1 - Math.max(0, Math.min(1, r))) * innerH;

      const points = valid.map((d, i) => [xOf(i), yOf(d.risk)]);
      let linePath = `M ${points[0][0]} ${points[0][1]}`;
      for (let i = 0; i < points.length - 1; i++) {
        const p0 = points[i - 1] || points[i];
        const p1 = points[i];
        const p2 = points[i + 1];
        const p3 = points[i + 2] || p2;
        const cp1x = p1[0] + (p2[0] - p0[0]) / 6;
        const cp1y = p1[1] + (p2[1] - p0[1]) / 6;
        const cp2x = p2[0] - (p3[0] - p1[0]) / 6;
        const cp2y = p2[1] - (p3[1] - p1[1]) / 6;
        linePath += ` C ${cp1x} ${cp1y}, ${cp2x} ${cp2y}, ${p2[0]} ${p2[1]}`;
      }
      const baseY     = padT + innerH;
      const areaPath  = `${linePath} L ${xOf(n - 1)} ${baseY} L ${padL} ${baseY} Z`;
      const gradId    = `trend-grad-${lvl.key}`;

      // 4. Y grid labels at 0/25/50/75/100, X labels max 6 — formatted.
      const gridYs   = [0, 0.25, 0.5, 0.75, 1.0];
      const maxXLab  = 6;
      const stride   = Math.max(1, Math.ceil(n / maxXLab));
      const xLabels  = valid.map((d, i) => ({
        i, show: i === 0 || i === n - 1 || i % stride === 0,
      }));

      // 5. Tooltip — index of nearest dot to pointer.
      const onMove = (e) => {
        const svg = e.currentTarget;
        const rect = svg.getBoundingClientRect();
        const x = ((e.clientX - rect.left) / rect.width) * W;
        let best = 0, bestDist = Infinity;
        for (let i = 0; i < points.length; i++) {
          const dx = Math.abs(points[i][0] - x);
          if (dx < bestDist) { bestDist = dx; best = i; }
        }
        setHover(best);
      };
      const onLeave = () => setHover(null);

      // 6. Tooltip position in chart percent (so we can absolute-position
      //    the floating <div> over the SVG without measuring it).
      let tipStyle = null, tipPayload = null;
      if (hover != null && valid[hover]) {
        const p = points[hover];
        tipStyle = { left: `${(p[0] / W) * 100}%`, top: `${(p[1] / H) * 100}%` };
        const pct = Math.round(valid[hover].risk * 100);
        const lv  = riskLevel(pct);
        tipPayload = { pct, lv, date: fmtTrendDate(valid[hover].date) };
      }

      // 7. Risk colour for the gradient — driven by *latest* point.
      const stopColor = lvl.key === 'severe' ? 'var(--risk-severe)'
                      : lvl.key === 'high' ? 'var(--risk-high)'
                      : lvl.key === 'elev' ? 'var(--risk-elev)'
                      :                      'var(--risk-low)';

      return (
        <>
          <div className="trend-summary">
            <div className="leading">
              <span className={`dot`}
                    style={{ background: stopColor }} aria-hidden="true" />
              <div>
                <div className="latest-label">Latest risk</div>
                <div className="latest-value">{latestPct}%</div>
              </div>
            </div>
            <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap',
                          justifyContent: 'flex-end' }}>
              <span className={`strain-pill ${lvl.key}`}>{lvl.label}</span>
              <span className={`trend-pill ${trend.key}`}>
                <span className="arrow">{trend.arrow}</span>{trend.label}
              </span>
            </div>
          </div>

          <div className="trend-chart-wrap">
            <svg className={`trend-chart risk-${lvl.key}`}
                 viewBox={`0 0 ${W} ${H}`}
                 preserveAspectRatio="xMidYMid meet"
                 onMouseMove={onMove}
                 onMouseLeave={onLeave}
                 onTouchStart={(e) => {
                   const t = e.touches[0];
                   if (t) onMove({ currentTarget: e.currentTarget,
                                   clientX: t.clientX });
                 }}
                 onTouchMove={(e) => {
                   const t = e.touches[0];
                   if (t) onMove({ currentTarget: e.currentTarget,
                                   clientX: t.clientX });
                 }}
                 onTouchEnd={onLeave}>
              <defs>
                <linearGradient id={gradId} x1="0" x2="0" y1="0" y2="1">
                  <stop offset="0%"   stopColor={stopColor} stopOpacity="0.28" />
                  <stop offset="100%" stopColor={stopColor} stopOpacity="0.02" />
                </linearGradient>
              </defs>

              {gridYs.map(r => (
                <g key={r}>
                  <line className="grid-line"
                        x1={padL} x2={W - padR}
                        y1={yOf(r)} y2={yOf(r)} />
                  <text className="grid-label"
                        x={padL - 6} y={yOf(r) + 4}
                        textAnchor="end">
                    {Math.round(r * 100)}
                  </text>
                </g>
              ))}

              <path d={areaPath} fill={`url(#${gradId})`} />
              <path className="area-line" d={linePath} />

              {hover != null && (
                <line className="v-cursor"
                      x1={points[hover][0]} x2={points[hover][0]}
                      y1={padT} y2={padT + innerH} />
              )}

              {points.map(([x, y], i) => (
                <circle key={i} className={`area-dot ${i === hover ? 'active' : ''}`}
                        cx={x} cy={y} r={i === hover ? 5.5 : 3.6} />
              ))}

              {xLabels.map(({ i, show }) =>
                show ? (
                  <text key={i} className="x-label"
                        x={xOf(i)} y={padT + innerH + 18}
                        textAnchor="middle">
                    {fmtTrendDate(valid[i].date)}
                  </text>
                ) : null)}
            </svg>

            {tipPayload && (
              <div className="trend-tip" style={tipStyle} role="status">
                <div className="date">{tipPayload.date}</div>
                <div className="value">{tipPayload.pct}%</div>
                <div className={`strain ${tipPayload.lv.key}`}>
                  {tipPayload.lv.label}
                </div>
              </div>
            )}
          </div>
        </>
      );
    }

    /* =========================================================
       Check-in answers — direct echoes of the wizard sliders, no
       inversion or derivation. `latest` is what the user just
       reported; `avg` is the mean across their personHist for the
       same field. `direction` is -1 when "lower is better" (stress,
       workload) so the Strongest Area card doesn't celebrate high
       stress.
       ========================================================= */
    const DIMENSIONS = [
      { id: 'mood',              name: 'Mood',
        pick: e => e.signals && +e.signals.mood,
        min: 1, max: 10, unit: '/10', loEnd: 'low',   hiEnd: 'high',   direction: +1 },
      { id: 'stress',            name: 'Stress',
        pick: e => e.signals && +e.signals.stress,
        min: 1, max: 10, unit: '/10', loEnd: 'calm',  hiEnd: 'at limit', direction: -1 },
      { id: 'deadline_pressure', name: 'Workload',
        pick: e => e.signals && +e.signals.deadline_pressure,
        min: 1, max: 10, unit: '/10', loEnd: 'none',  hiEnd: 'crushing', direction: -1 },
      { id: 'sleep',             name: 'Sleep',
        pick: e => e.signals && +e.signals.sleep,
        min: 3, max: 11, unit: 'h',   loEnd: 'short', hiEnd: 'long',   direction: +1 },
      { id: 'hours',             name: 'Study/work hours',
        pick: e => e.signals && +e.signals.hours,
        min: 0, max: 16, unit: 'h',   loEnd: 'light', hiEnd: 'heavy',  direction: -1 },
      { id: 'mgr_support',       name: 'Support figure',
        pick: e => e.signals && +e.signals.mgr_support,
        min: 1, max: 10, unit: '/10', loEnd: 'low',   hiEnd: 'strong', direction: +1 },
      { id: 'peer_support',      name: 'Peer/social support',
        pick: e => e.signals && +e.signals.peer_support,
        min: 1, max: 10, unit: '/10', loEnd: 'low',   hiEnd: 'strong', direction: +1 },
    ];

    function fmtDimValue(dim, v) {
      if (!Number.isFinite(v)) return '—';
      const rounded = Math.round(v * 10) / 10;
      const txt = Number.isInteger(rounded) ? String(rounded) : rounded.toFixed(1);
      return dim.unit === 'h' ? `${txt}h` : txt;
    }

    function computeDimensions(personHist) {
      if (!personHist || personHist.length === 0) return [];
      // personHist[0] is the most recent check-in.
      return DIMENSIONS.map(dim => {
        const values = personHist.map(dim.pick).filter(v => Number.isFinite(v));
        if (values.length === 0) {
          return { ...dim, latest: null, avg: null, count: 0 };
        }
        const latest = values[0];
        const avg    = values.reduce((s, v) => s + v, 0) / values.length;
        return { ...dim, latest, avg, count: values.length };
      }).filter(d => d.latest != null);
    }

    function strongestDimension(dims) {
      if (!dims || dims.length === 0) return null;
      // Normalise each dimension's *average* to a 0..1 "positive" score
      // honouring its direction (so "Stress: high" doesn't win).
      let best = null, bestScore = -Infinity;
      for (const d of dims) {
        if (d.avg == null) continue;
        const range = d.max - d.min;
        if (range <= 0) continue;
        const rel = (d.avg - d.min) / range;
        const score = d.direction === -1 ? (1 - rel) : rel;
        if (score > bestScore) { bestScore = score; best = d; }
      }
      return best;
    }

    function InsightsTab({ personHist, stats, insights,
                            personId, activeProfile }) {
      const trackerToday = getTrackerToday(activeProfile.personId);
      const dailyDelta   = trackerDelta(trackerToday);

      const hasData = personHist.length > 0;
      // Latest risk (this week if exists, else most-recent check-in).
      const latest = personHist[0];
      const baseRisk = latest ? latest.risk : 0;
      const displayRisk = Math.max(0, Math.min(1, baseRisk + dailyDelta));
      const v = verdict(Math.max(0.001, displayRisk));

      // 7-day vs previous-7-day comparator.
      let compareText = 'no comparison yet';
      let compareKind = 'flat';
      if (personHist.length >= 2) {
        const recent  = personHist.slice(0, Math.min(7, personHist.length));
        const older   = personHist.slice(7, Math.min(14, personHist.length));
        if (older.length > 0) {
          const avg = a => a.reduce((s, e) => s + e.risk, 0) / a.length;
          const diff = avg(recent) - avg(older);
          if (Math.abs(diff) < 0.03) {
            compareText = 'stable vs previous days';
            compareKind = 'flat';
          } else if (diff > 0) {
            compareText = `+${(diff * 100).toFixed(0)}% vs previous days`;
            compareKind = 'up';
          } else {
            compareText = `${(diff * 100).toFixed(0)}% vs previous days`;
            compareKind = 'down';
          }
        }
      }

      // Build chart data from personHist directly (personHist is newest -> oldest;
      // the chart expects oldest -> newest and validates each point itself).
      const chartData = personHist
        .slice(0, 30)
        .map(e => ({ date: e.when, risk: e.risk }))
        .reverse();

      const dims = computeDimensions(personHist);
      const strongest = strongestDimension(dims);

      return (
        <div className="pane">
          <div className="eyebrow-pill">
            {todayLabel().toUpperCase()}
          </div>
          <h1 className="display-title">Your Dashboard</h1>
          <div className="display-sub">
            {personHist.length === 0
              ? 'No check-ins yet — start one from Home.'
              : `${personHist.length} check-in${personHist.length === 1 ? '' : 's'} recorded — keep going.`}
          </div>

          <div className="panel ring-card">
            <div className="panel-head">
              <div>
                <div className="panel-title">Burnout Risk</div>
                <div className="panel-sub">
                  Patterns linked to emotional overload — not a diagnosis.
                </div>
              </div>
            </div>
            {hasData ? (
              <>
                <RiskRing pct={displayRisk} color={v.color} label={v.label} />
                <div className="ring-foot">
                  <span className="compare">{compareText}</span>
                  <span className={`delta ${
                    dailyDelta > 0.005 ? 'up'
                    : dailyDelta < -0.005 ? 'down' : 'flat'}`}>
                    {dailyDelta > 0.005
                      ? `+${(dailyDelta * 100).toFixed(0)}% from today's check-in`
                      : dailyDelta < -0.005
                        ? `${(dailyDelta * 100).toFixed(0)}% from today's check-in`
                        : 'No shift from today'}
                  </span>
                </div>
              </>
            ) : (
              <div style={{ padding: '24px 8px 4px', textAlign: 'center',
                            color: 'var(--text-muted)' }}>
                Your risk ring appears here once you've completed a check-in.
              </div>
            )}
          </div>

          {strongest && (
            <div className="panel strongest-area">
              <div className="strongest-eyebrow">
                <svg viewBox="0 0 24 24" fill="none">
                  <circle cx="12" cy="12" r="9"
                          stroke="currentColor" strokeWidth="1.8"/>
                  <circle cx="12" cy="12" r="4.5"
                          stroke="currentColor" strokeWidth="1.8"/>
                  <circle cx="12" cy="12" r="1.6" fill="currentColor"/>
                </svg>
                Strongest Area
              </div>
              <div className="panel-title">{strongest.name}</div>
              <div className="panel-sub">
                Avg: {fmtDimValue(strongest, strongest.avg)}
                {strongest.unit === '/10' ? '/10' : ''}
                {strongest.direction === -1 ? ' · lower is better' : ''}
              </div>
            </div>
          )}

          <div className="panel trend-card">
            <div className="head-row">
              <div className="h">Burnout Risk Over Time</div>
            </div>
            <div className="sub">
              Your pattern becomes clearer as you check in over time.
            </div>
            <TrendChart data={chartData} />
          </div>

          {dims.length > 0 && (
            <div className="panel">
              <div className="panel-head">
                <div className="panel-title">Your latest check-in</div>
              </div>
              <div className="panel-sub" style={{ marginBottom: 14 }}>
                The exact values you reported — same scale as the questions.
              </div>
              {dims.map(d => {
                const range = d.max - d.min;
                const relLatest = range > 0
                  ? Math.max(0, Math.min(1, (d.latest - d.min) / range)) : 0;
                const relAvg    = range > 0
                  ? Math.max(0, Math.min(1, (d.avg    - d.min) / range)) : 0;
                const showAvg = d.count > 1
                  && Math.abs(d.latest - d.avg) > (d.unit === 'h' ? 0.25 : 0.1);
                return (
                  <div key={d.id} className="dim-row">
                    <div className="dim-label">{d.name}</div>
                    <div className="dim-value">{fmtDimValue(d, d.latest)}</div>
                    <div className="dim-bar">
                      <span style={{ width: `${Math.max(2, relLatest * 100)}%` }} />
                      {d.count > 1 && (
                        <i className="dim-avg-tick"
                           style={{ left: `${relAvg * 100}%` }}
                           title={`${d.count}-check-in average`} />
                      )}
                    </div>
                    <div className="dim-foot">
                      <span className="end">{d.loEnd}</span>
                      {showAvg && (
                        <span className="avg">
                          {d.count}-check-in avg · {fmtDimValue(d, d.avg)}
                        </span>
                      )}
                      <span className="end">{d.hiEnd}</span>
                    </div>
                  </div>
                );
              })}
            </div>
          )}

          {insights.length > 0 && (
            <div className="panel">
              <div className="panel-head">
                <div className="panel-title">What we noticed</div>
              </div>
              <div className="insights-list">
                {insights.map((ins, i) => (
                  <div key={i} className={`insight ${ins.kind}`}>
                    <div className="insight-icon">
                      {ins.kind === 'good' ? '↓'
                        : ins.kind === 'bad' ? '↑'
                        : ins.kind === 'warn' ? '!' : '·'}
                    </div>
                    <span>{ins.text}</span>
                  </div>
                ))}
              </div>
            </div>
          )}

          <div className="panel">
            <div className="panel-head">
              <div className="panel-title">History</div>
            </div>
            {personHist.length === 0 ? (
              <div style={{ color: 'var(--text-soft)', fontSize: 14 }}>
                No entries yet for {personId}.
              </div>
            ) : (
              <ul className="mini-list">
                {personHist.map((e, idx) => {
                  // The most recent check-in, when it's actually today's,
                  // mirrors the live ring (saved risk + today's tracker
                  // delta). Older entries stay as historical snapshots.
                  const isLatestToday = idx === 0
                    && typeof e.when === 'string'
                    && e.when.slice(0, 10) === todayKey();
                  const shownRisk = isLatestToday ? displayRisk : e.risk;
                  const ev = verdict(shownRisk);
                  return (
                    <li key={e.id} className="mini-item">
                      <div className="mini-date">
                        <div className="when">{shortDate(e.when)}</div>
                        {e.notes && <div className="note">"{e.notes}"</div>}
                      </div>
                      <span className="mini-tag" style={{ color: ev.color }}>{ev.label}</span>
                      <span className="mini-pct" style={{ color: ev.color }}>
                        {(shownRisk * 100).toFixed(0)}%
                      </span>
                    </li>
                  );
                })}
              </ul>
            )}
          </div>
        </div>
      );
    }

    /* =========================================================
       TAB CONTENT — Daily Check-In
       Category-based reflection across three sections:
       Today's State, Recovery, Stress Load.
       ========================================================= */
    const StateCard = React.memo(function StateCard({ card, value, onChange }) {
      return (
        <div className={`state-card ${card.muted ? 'muted' : ''}`}>
          <div className="name">{card.name}</div>
          {card.q && <div className="question">{card.q}</div>}
          <div className="pill-row" role="radiogroup" aria-label={card.name}>
            {card.opts.map(opt => {
              const selected = value === opt;
              return (
                <button key={opt} type="button" role="radio"
                        aria-checked={selected}
                        className={`pill-opt ${selected ? 'selected' : ''}`}
                        onClick={() => onChange(selected ? null : opt)}>
                  {opt}
                </button>
              );
            })}
          </div>
        </div>
      );
    });

    function TrackerTab({ activeProfile, trackerToday, setTrackerValue }) {
      const rec = recoveryStatus(trackerToday);
      return (
        <div className="pane">
          <div className="eyebrow-pill">
            {todayLabel().toUpperCase()}
          </div>
          <h1 className="display-title">Daily Tracker</h1>
          <div className="display-sub">
            Log the lifestyle factors that quietly shape your recovery —
            sleep, breaks, screens, social load.
          </div>

          <div className="panel">
            <div className="panel-head">
              <div>
                <div className="panel-title">Recovery Status</div>
                <div className="panel-sub">{rec.note}</div>
              </div>
              <span className="badge solid">{rec.label}</span>
            </div>
          </div>

          {CHECKIN_SECTIONS.map(sec => (
            <section key={sec.id} className="checkin-section">
              <div className="checkin-section-title">{sec.title}</div>
              {sec.cards.map(card => (

                and what helps you recover. Today's check-in connects
                energy, stress, recovery and burnout risk over time.
              </div>
            </div>
          </section>
        </div>
      );
