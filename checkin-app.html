                    <span className="pill">·</span>
                    <span className="lbl">{d.label}</span>
                  </div>
                ))}
              </>
            )}
            {modelDrivers.length > 0 && (
              <>
                <h3>Model contributors</h3>
                {modelDrivers.map(d => (
                  <div key={d.key} className={`driver ${d.c < 0 ? 'down' : 'up'}`}>
                    <span className="pill">{d.c < 0 ? '↓' : '↑'}</span>
                    <span className="lbl">{d.label}</span>
                    <span className="mag">{d.c > 0 ? '+' : ''}{d.c.toFixed(2)}</span>
                  </div>
                ))}
              </>
            )}
            {hybridAction && (
              <div className="card" style={{ marginTop: 16 }}>
                <div className="card-title">Suggested next step</div>
                <div style={{ fontSize: 14, color: 'var(--text-muted)', lineHeight: 1.55 }}>
                  {hybridAction}
                </div>
              </div>
            )}
            {safetyNetSuggested && (
              <div className="card" style={{
                marginTop: 16,
                borderColor: 'color-mix(in srgb, var(--primary) 35%, var(--border))',
                background: 'var(--primary-soft)',
              }}>
                <div className="card-title">Safety Net</div>
                <div style={{ fontSize: 14, color: 'var(--text)', lineHeight: 1.55 }}>
                  Strain is high enough that letting someone you trust know what is going on may help.
                  Open <strong>Home</strong> → Safety Net to send a gentle invite.
                </div>
              </div>
            )}
            {entry.notes && (
              <div className="card" style={{ marginTop: 16 }}>
                <div className="card-title">Your note</div>
                <div style={{ fontSize: 14, fontStyle: 'italic', color: 'var(--text-muted)' }}>
                  "{entry.notes}"
                </div>
              </div>
            )}
          </div>
          <div className="result-bottom">
            <button className="cta" onClick={onDismiss}>Done</button>
          </div>
        </div>
      );
    }

    /* =========================================================
       PROFILE MANAGER modal
       ========================================================= */
    function ProfileManager({ profiles, activeId, onClose,
                              onRename, onSetPin, onDeleteProfile,
                              onAddProfile }) {
      const [editing, setEditing] = useState(null);
      const [newName, setNewName] = useState('');

      const beginEdit = (p) => {
        setEditing(p.id);
        setNewName(p.name);
      };
      const commit = () => {
        onRename(editing, newName.trim() || 'You');
        setEditing(null);
      };

      const requestPassword = async (p) => {
        const pwd = prompt(`Change password for ${p.name}. New password (at least 6 characters):`);
        if (pwd === null) return;
        if (pwd.length < 6) {
          alert('Password must be at least 6 characters.');
          return;
        }
        const salt = genSalt();
        const h = await hashPin(pwd, salt);
        onSetPin(p.id, h, salt);
      };

      return (
        <div className="modal-backdrop" onClick={(e) => {
          if (e.target === e.currentTarget) onClose();
        }}>
          <div className="modal">
            <div className="modal-head">
              <span className="title">Manage profiles</span>
              <button className="icon-btn solid" onClick={onClose} aria-label="Close">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                  <path d="M6 6l12 12M18 6L6 18" stroke="currentColor"
                        strokeWidth="2" strokeLinecap="round" />
                </svg>
              </button>
            </div>
            <div className="modal-body">
              {profiles.map(p => (
                <div key={p.id} className="profile-row"
                     style={{ marginBottom: 10, cursor: 'default' }}>
                  <Avatar name={p.name} color={p.color} />
                  <div className="info">
                    {editing === p.id ? (
                      <input className="text-input" autoFocus
                             value={newName}
                             onChange={e => setNewName(e.target.value)}
                             onBlur={commit}
                             onKeyDown={e => e.key === 'Enter' && commit()} />
                    ) : (
                      <>
                        <div className="name">
                          {p.name}
                          {p.id === activeId && (
                            <span className="badge solid" style={{ marginLeft: 8 }}>active</span>
                          )}
                        </div>
                        <div className="meta">
                          {p.email || p.personId}
                        </div>
                      </>
                    )}
                  </div>
                  {editing !== p.id && (
                    <div style={{ display: 'flex', gap: 4 }}>
                      <button className="icon-btn solid" onClick={() => beginEdit(p)}
                              aria-label="Rename">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
                          <path d="M4 20h4l10-10-4-4L4 16v4z M14 6l4 4"
                                stroke="currentColor" strokeWidth="1.8"
                                strokeLinejoin="round" />
                        </svg>
                      </button>
                      <button className="icon-btn solid" onClick={() => requestPassword(p)}
                              aria-label="Change password">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
                          <rect x="5" y="11" width="14" height="9" rx="2"
                                stroke="currentColor" strokeWidth="1.8" />
                          <path d="M8 11V7a4 4 0 0 1 8 0v4"
                                stroke="currentColor" strokeWidth="1.8" />
                        </svg>
                      </button>
                      {profiles.length > 1 && (
                        <button className="icon-btn solid"
                                style={{ color: 'var(--risk-high)' }}
                                onClick={() => {
                                  if (confirm(`Delete "${p.name}"? Their check-ins stay in the CSV but disappear from this app.`)) {
                                    onDeleteProfile(p.id);
                                  }
                                }}
                                aria-label="Delete">
                          <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
                            <path d="M5 7h14M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"
                                  stroke="currentColor" strokeWidth="1.6"
                                  strokeLinecap="round" strokeLinejoin="round" />
                          </svg>
                        </button>
                      )}
                    </div>
                  )}
                </div>
              ))}

              <button className="add-profile-row" style={{ marginTop: 6 }}
                      onClick={onAddProfile}>
                + Add new profile
              </button>
            </div>
          </div>
        </div>
      );
    }

    /* =========================================================
       TAB CONTENT — Home
       ========================================================= */
    function HomeTab({ activeProfile, personHist, stats,
                       onStartCheckin, onGoDashboard, onGoTracker }) {
      const thisWeekKey = isoDate(new Date());
      const thisWeek = personHist.find(e =>
        isoDate(new Date(e.when)) === thisWeekKey);
      const firstName = activeProfile.name.split(' ')[0];

      const snPanelRef = React.useRef(null);

      /* ----- Safety Net state ----- */
      const [snOpen, setSnOpen] = React.useState(false);
      const [snContacts, setSnContacts] = React.useState(() => {
        try { return JSON.parse(localStorage.getItem('wellcare-safety-net') || '[]'); }
        catch { return []; }
      });
      const [snMethod, setSnMethod] = React.useState('email');
      const [snName, setSnName] = React.useState('');
      const [snValue, setSnValue] = React.useState('');
      const [snRel, setSnRel] = React.useState('Friend');
      const [snThreshold, setSnThreshold] = React.useState(75);

      React.useEffect(() => {
        try { localStorage.setItem('wellcare-safety-net', JSON.stringify(snContacts)); }
        catch {}
      }, [snContacts]);

      const snValid =
        snMethod === 'email'
          ? /\S+@\S+\.\S+/.test(snValue.trim())
          : snValue.replace(/\D/g, '').length >= 7;

      function snInitials(c) {
        const n = (c.name || c.value || '?').trim();
        const parts = n.split(/[\s@.]+/).filter(Boolean);
        const a = (parts[0] || '?')[0] || '?';
        const b = (parts[1] || '')[0] || '';
        return (a + b).toUpperCase();
      }

      function snTimeAgo(ts) {
        const s = Math.max(1, Math.floor((Date.now() - ts) / 1000));
        if (s < 60) return 'just now';
        const m = Math.floor(s / 60);
        if (m < 60) return m + ' min ago';
        const h = Math.floor(m / 60);
        if (h < 24) return h + 'h ago';
        const d = Math.floor(h / 24);
        return d + 'd ago';
      }

      function snSendInvite() {
        if (!snValid) return;
        const link = window.location.href.split('#')[0];
        const greet = snName.trim()
          ? 'Hi ' + snName.trim().split(' ')[0] + ','
          : 'Hi,';
        const body =
          greet + '\n\n' +
          "I'm using WellCare to check in on my burnout risk, and I'd love " +
          'to have you in my safety net. If things get hard, you\u2019ll get ' +
          'a gentle nudge \u2014 no diagnoses, no raw data, just a heads-up ' +
          'so you can reach out.\n\n' +
          'Open the app: ' + link + '\n\n' +
          'Thank you for being there.\n\u2014 ' + firstName;
        const subj = 'Be my Safety Net on WellCare';

        if (snMethod === 'email') {
          window.location.href =
            'mailto:' + encodeURIComponent(snValue.trim()) +
            '?subject=' + encodeURIComponent(subj) +
            '&body=' + encodeURIComponent(body);
        } else {
          const phone = snValue.replace(/[^\d+]/g, '');
          window.location.href =
            'sms:' + phone + '?body=' + encodeURIComponent(body);
        }

        const newC = {
          id: Date.now(),
          name: snName.trim() || (snMethod === 'email'
            ? snValue.split('@')[0]
            : snValue.trim()),
          method: snMethod,
          value: snValue.trim(),
          rel: snRel,
          threshold: snThreshold,
          invitedAt: Date.now(),
          status: 'pending',
        };
        setSnContacts(cs => [newC, ...cs]);
        setSnName('');
        setSnValue('');
      }

      function snResend(c) {
        setSnMethod(c.method);
        setSnName(c.name);
        setSnValue(c.value);
        setSnRel(c.rel);
        setSnThreshold(c.threshold);
      }

      function snRemove(id) {
        const removed = snContacts.find(c => c.id === id);
        const who = removed
          ? `${removed.name} (${removed.rel})`
          : 'this contact';
        const ok = window.confirm(
          'Remove ' + who + ' from your Safety Net?\n\n' +
          'They disappear from your list and this invitation ends for them here.\n' +
          'If they use WellCare, they use it as their own account — they do not stay tied ' +
          'to you as your Friend, Partner, etc., unless you invite them again.'
        );
        if (!ok) return;
        setSnContacts(cs => cs.filter(c => c.id !== id));
      }

      function scrollToSafetyNet() {
        snPanelRef.current?.scrollIntoView({
          behavior: 'smooth',
          block: 'start',
        });
      }

      return (
        <div className="pane">
          <div className="eyebrow-pill">
            <svg viewBox="0 0 24 24" fill="none">
              <path d="M12 2l1.5 4.5L18 8l-4.5 1.5L12 14l-1.5-4.5L6 8l4.5-1.5z M19 14l.8 2.2L22 17l-2.2.8L19 20l-.8-2.2L16 17l2.2-.8z"
                    fill="currentColor"/>
            </svg>
            Ready for today
          </div>
          <h1 className="display-title">
            {personHist.length === 0 ? `Welcome, ${firstName}` : 'Welcome back'}
          </h1>
          <div className="display-sub">
            Keep it light: a quick check-in, a glance at trends, and a small
            step toward steadier days.
          </div>

          <div className="panel">
            <div className="panel-head">
              <div>
                <div className="panel-title">Today's check-in</div>
                <div className="panel-sub">
                  {thisWeek
                    ? `${relDay(thisWeek.when)} · ${(thisWeek.risk * 100).toFixed(0)}% risk`
                    : 'Takes about 60 seconds.'}
                </div>
              </div>
              <button className="pill-cta" onClick={onStartCheckin}>
                {thisWeek ? 'Update' : 'Start'}
                <svg viewBox="0 0 24 24" fill="none">
                  <path d="M5 12h14M13 6l6 6-6 6"
                        stroke="currentColor" strokeWidth="2"
                        strokeLinecap="round" strokeLinejoin="round"/>
                </svg>
              </button>
            </div>

              <button className="sub-card" onClick={onGoDashboard}>
              <div className="label">
                <svg viewBox="0 0 24 24" fill="none">
                  <rect x="4" y="5" width="16" height="15" rx="2"
                        stroke="currentColor" strokeWidth="1.7"/>
                  <path d="M4 9h16 M8 3v4 M16 3v4"
                        stroke="currentColor" strokeWidth="1.7" strokeLinecap="round"/>
                </svg>
                Daily streak
              </div>
              <div className="desc">
                {stats.streak > 0
                  ? `${stats.streak} check-in${stats.streak === 1 ? '' : 's'} in a row — keep it up.`
                  : 'Your streak appears here once you check in a few days in a row.'}
              </div>
            </button>

            <button className="sub-card" onClick={onGoDashboard}>
              <div className="label">
                <svg viewBox="0 0 24 24" fill="none">
                  <path d="M4 20V10 M10 20V6 M16 20v-9 M22 20v-5"
                        stroke="currentColor" strokeWidth="1.8" strokeLinecap="round"/>
                </svg>
                Trend over time
              </div>
              <div className="desc">
                See your burnout risk curve and what's shifting it.
              </div>
            </button>

          </div>

          {/* =========================================================
              Safety Net — full feature panel
              ========================================================= */}
          <section ref={snPanelRef}
                   className="panel safety-net-panel"
                   aria-labelledby="sn-title">
            <div className="sn-hero">
              <div className="sn-shield" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                  <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                  <path d="M8 12.5l2.5 2.5L16 9.5"/>
                </svg>
              </div>
              <div className="sn-hero-text">
                <span className="sn-eyebrow">
                  <span className="dot-live"></span>
                  Protection active
                </span>
                <h2 className="sn-title" id="sn-title">Your Safety Net</h2>
                <p className="sn-subtitle">
                  Choose trusted people who can be gently alerted if your
                  burnout risk becomes critical — so you're never carrying
                  it alone.
                </p>
              </div>
            </div>

            <div className="sn-microcopy">
              "You don't have to go through burnout alone. Support activates
              quietly, only when patterns become concerning."
            </div>

            {snContacts.length > 0 ? (
              <>
              <div className="sn-contacts">
                {snContacts.map((c, i) => {
                  const status = c.status || 'pending';
                  const isPending   = status === 'pending';
                  const isEmergency = status === 'emergency';
                  const statusLabel =
                    isPending   ? 'Pending'   :
                    isEmergency ? 'Emergency' :
                    'Active';
                  const avatarClass = isEmergency
                    ? 'a3'
                    : (i % 2 === 0 ? 'a1' : 'a2');
                  return (
                    <div key={c.id}
                         className={"sn-contact" + (isEmergency ? " is-emergency" : "")}>
                      <div className={"sn-avatar " + avatarClass} aria-hidden="true">
                        {snInitials(c)}
                      </div>
                      <div className="sn-meta">
                        <div className="sn-name-row">
                          <span className="sn-name">{c.name}</span>
                          <span className="sn-rel">{c.rel}</span>
                        </div>
                        <div className="sn-detail">
                          <span className="sn-threshold">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                 strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                              <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
                            </svg>
                            Notified at {c.threshold}%
                          </span>
                          <span className="sn-channel">· {c.value}</span>
                        </div>
                        <span className="sn-last">
                          {isPending
                            ? 'Awaiting their acceptance · invite sent ' + snTimeAgo(c.invitedAt)
                              + ' via ' + (c.method === 'email' ? 'email' : 'SMS')
                              + '. They\'ll show active once they join WellCare from your link.'
                            : 'Accepted ' + snTimeAgo(c.acceptedAt || c.invitedAt)
                              + ' · ' + (c.method === 'email' ? 'email' : 'SMS')}
                        </span>
                        <div className="sn-actions-row">
                          <button type="button" className="sn-mini-btn"
                                  onClick={() => snResend(c)}>
                            {isPending ? 'Resend' : 'Re-invite'}
                          </button>
                          <button type="button" className="sn-mini-btn danger"
                                  onClick={() => snRemove(c.id)}>
                            Remove
                          </button>
                        </div>
                      </div>
                      <span className={"sn-status " + status}>{statusLabel}</span>
                    </div>
                  );
                })}
              </div>
              <p className="sn-removal-policy">
                If you remove someone from your Safety Net, they are no longer your listed
                contact here. They can still open WellCare and sign in like anyone else &mdash;
                as their own user, not as &ldquo;your&rdquo; Friend / Partner / Mentor slot.
                Only a new invite from you can link them here again under a relationship label.
              </p>
              </>
            ) : (
              <div className="sn-empty">
                <div className="sn-empty-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                       strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round">
                    <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
                    <circle cx="9" cy="7" r="4"/>
                    <path d="M19 8v6 M22 11h-6"/>
                  </svg>
                </div>
                <div className="sn-empty-title">No one in your circle yet</div>
                <div className="sn-empty-sub">
                  Invite someone you trust below. They&rsquo;ll get a private
                  link &mdash; nothing happens without their consent.
                </div>
              </div>
            )}

            {/* Invite form */}
            <div className="sn-invite-card">
              <div className="sn-invite-head">
                <div className="sn-invite-title">Invite a trusted contact</div>
                <div className="sn-invite-sub">
                  Send them a gentle invite link by email or text.
                </div>
              </div>

              <div className="sn-method-toggle" role="tablist">
                <button type="button"
                        role="tab"
                        aria-selected={snMethod === 'email'}
                        className={"sn-method-btn" + (snMethod === 'email' ? ' is-active' : '')}
                        onClick={() => setSnMethod('email')}>
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                       strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                    <rect x="3" y="5" width="18" height="14" rx="2"/>
                    <path d="M3 7l9 6 9-6"/>
                  </svg>
                  Gmail / Email
                </button>
                <button type="button"
                        role="tab"
                        aria-selected={snMethod === 'sms'}
                        className={"sn-method-btn" + (snMethod === 'sms' ? ' is-active' : '')}
                        onClick={() => setSnMethod('sms')}>
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                       strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                  </svg>
                  SMS / Phone
                </button>
              </div>

              <div className="sn-field-group">
                <label className="sn-field-label">
                  Their name <span className="sn-optional">(optional)</span>
                </label>
                <input className="sn-input"
                       type="text"
                       placeholder="e.g. Alex"
                       value={snName}
                       onChange={e => setSnName(e.target.value)}/>
              </div>

              <div className="sn-field-group">
                <label className="sn-field-label">
                  {snMethod === 'email' ? 'Their email address' : 'Their phone number'}
                </label>
                <input className="sn-input"
                       type={snMethod === 'email' ? 'email' : 'tel'}
                       inputMode={snMethod === 'email' ? 'email' : 'tel'}
                       autoComplete={snMethod === 'email' ? 'email' : 'tel'}
                       placeholder={snMethod === 'email'
                         ? 'name@example.com'
                         : '+1 555 123 4567'}
                       value={snValue}
                       onChange={e => setSnValue(e.target.value)}/>
              </div>

              <div className="sn-row-2">
                <div className="sn-field-group">
                  <label className="sn-field-label">Relationship</label>
                  <select className="sn-input sn-select"
                          value={snRel}
                          onChange={e => setSnRel(e.target.value)}>
                    <option>Friend</option>
                    <option>Partner</option>
                    <option>Family</option>
                    <option>Mentor</option>
                    <option>Therapist</option>
                    <option>Colleague</option>
                  </select>
                </div>
                <div className="sn-field-group">
                  <label className="sn-field-label">Alert at</label>
                  <div className="sn-thresh-chips">
                    {[60, 75, 90].map(t => (
                      <button type="button"
                              key={t}
                              className={"sn-chip" + (snThreshold === t ? ' is-active' : '')}
                              onClick={() => setSnThreshold(t)}>
                        {t}%
                      </button>
                    ))}
                  </div>
                </div>
              </div>

              <button type="button"
                      className="sn-cta"
                      disabled={!snValid}
                      onClick={snSendInvite}>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
                  <path d="M22 2L11 13"/>
                  <path d="M22 2l-7 20-4-9-9-4 20-7z"/>
                </svg>
                {snMethod === 'email' ? 'Send invite via email' : 'Send invite via SMS'}
              </button>
              <div className="sn-invite-hint">
                {snMethod === 'email'
                  ? 'Opens your email app with a pre-written message and the link.'
                  : 'Opens your messages app with a pre-written text and the link.'}
              </div>
            </div>

            <button
              type="button"
              className={"sn-expand-toggle" + (snOpen ? " is-open" : "")}
              onClick={() => setSnOpen(o => !o)}
              aria-expanded={snOpen}
              aria-controls="sn-details">
              <span>{snOpen ? 'Hide protection details' : 'How your safety net works'}</span>
              <span className="chev" aria-hidden="true">⌄</span>
            </button>

            <div
              className={"sn-details" + (snOpen ? " is-open" : "")}
              id="sn-details"
              role="region">
              <div className="sn-details-grid">
                <div className="sn-detail-item">
                  <div className="sn-detail-label">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                      <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                      <circle cx="9" cy="7" r="4"/>
                      <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
                      <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                    </svg>
                    Who gets alerted
                  </div>
                  <div className="sn-detail-value">
                    Only contacts you've approved, in the order you set.
                    They receive a gentle message — never your raw data.
                  </div>
                </div>
                <div className="sn-detail-item">
                  <div className="sn-detail-label">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                      <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
                    </svg>
                    What triggers alerts
                  </div>
                  <div className="sn-detail-value">
                    Sustained high burnout risk over multiple days — not a
                    single bad moment. Patterns, not panic.
                  </div>
                </div>
                <div className="sn-detail-item">
                  <div className="sn-detail-label">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                      <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
                      <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
                    </svg>
                    Notification style
                  </div>
                  <div className="sn-detail-value">
                    Soft, private message via SMS or email — warm wording,
                    no diagnoses, no alarms.

    function RiskRing({ pct, color, label }) {
      const r = 70;
      const C = 2 * Math.PI * r;
      const offset = C * (1 - Math.max(0, Math.min(1, pct)));
      const size = 200;
      const c = size / 2;
      return (
        <div className="ring-wrap">
          <svg className="ring-svg" width={size} height={size}
               viewBox={`0 0 ${size} ${size}`}>
            <circle className="ring-track" cx={c} cy={c} r={r}
                    fill="none" strokeWidth="14"/>
            <circle className="ring-fill" cx={c} cy={c} r={r}
                    fill="none" strokeWidth="14"
                    strokeDasharray={C}
                    strokeDashoffset={offset}
                    strokeLinecap="round"
                    style={{ stroke: color,
                             transform: `rotate(-90deg)`,
                             transformOrigin: 'center' }}/>
            <text x={c} y={c - 8} className="ring-pct"
                  style={{ fill: color }}
                  textAnchor="middle" dominantBaseline="middle">
              {(pct * 100).toFixed(0)}%
            </text>
            <text x={c} y={c + 42} className="ring-label"
                  style={{ fill: color }}
                  textAnchor="middle" dominantBaseline="middle">
              {label}
            </text>
          </svg>
        </div>
      );
    }

    /* =========================================================
       Burnout Risk Over Time
       - Accepts [{ date, risk }] where risk is 0..1
       - Filters out invalid dates / risks
       - Empty state when < 3 valid points
       - Risk-aware colors driven by the latest valid point
       - Smooth curve + soft gradient area + dots + tooltip
       ========================================================= */
    function riskLevel(pct100) {
      if (pct100 >= 76) return { key: 'severe', label: 'Critical strain' };
      if (pct100 >= 56) return { key: 'high', label: 'High strain' };
      if (pct100 >= 31) return { key: 'elev', label: 'Moderate strain' };
      return { key: 'low', label: 'Lower strain' };
    }

    function fmtTrendDate(iso) {
      if (!iso) return '';
      const d = new Date(iso);
      if (Number.isNaN(d.getTime())) return '';
      return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
    }

    function TrendEmpty() {
      return (
        <div className="trend-empty">
          <svg width="120" height="64" viewBox="0 0 120 64" fill="none" aria-hidden="true">
            <line x1="8"  y1="52" x2="112" y2="52" stroke="currentColor" strokeWidth="1" strokeDasharray="2 4" opacity="0.6"/>
            <line x1="8"  y1="32" x2="112" y2="32" stroke="currentColor" strokeWidth="1" strokeDasharray="2 4" opacity="0.4"/>
            <line x1="8"  y1="12" x2="112" y2="12" stroke="currentColor" strokeWidth="1" strokeDasharray="2 4" opacity="0.25"/>
            <path d="M10 44 C 30 36, 50 28, 70 30 S 100 18, 112 22"
                  stroke="currentColor" strokeWidth="2" fill="none"
                  strokeLinecap="round" opacity="0.7"/>
            <circle cx="30" cy="36" r="2.6" fill="currentColor" opacity="0.85"/>
            <circle cx="60" cy="29" r="2.6" fill="currentColor" opacity="0.85"/>
            <circle cx="90" cy="24" r="2.6" fill="currentColor" opacity="0.85"/>
          </svg>
          <div className="title">Your trend will appear after a few check-ins.</div>
          <div className="body">
            Check in for a few days to see how your burnout risk changes
            over time.
          </div>
          <div className="hint">
            We'll look for patterns in energy, overwhelm, recovery and stress load.
          </div>
        </div>
      );
    }

    function TrendChart({ data }) {
      const [hover, setHover] = useState(null);

      // 1. Validate: keep only entries with a parseable date and a
      //    finite risk score in [0, 1].
      const valid = useMemo(() => {
        if (!Array.isArray(data)) return [];
        return data
          .map(d => {
            const t = d && d.date ? new Date(d.date) : null;
            const ts = t && !Number.isNaN(t.getTime()) ? t.getTime() : null;
            const r = Number(d && d.risk);
            if (ts == null) return null;
            if (!Number.isFinite(r) || r < 0 || r > 1) return null;
            return { ts, date: d.date, risk: r };
          })
          .filter(Boolean)
          .sort((a, b) => a.ts - b.ts);
      }, [data]);

      if (valid.length < 3) return <TrendEmpty />;

      // 2. Latest + previous → trend + risk colour driven by the latest.
      const latest    = valid[valid.length - 1];
      const previous  = valid[valid.length - 2];
      const latestPct = Math.round(latest.risk * 100);
      const lvl       = riskLevel(latestPct);
      const diff      = (latest.risk - previous.risk) * 100;
      const trend     = diff > 5 ? { key: 'up',   label: 'Rising',  arrow: '↑' }
                      : diff < -5 ? { key: 'down', label: 'Falling', arrow: '↓' }
                      :             { key: 'flat', label: 'Stable',  arrow: '→' };

      // 3. Geometry — responsive via viewBox.
      const W = 360, H = 200;
      const padL = 34, padR = 12, padT = 12, padB = 32;
      const innerW = W - padL - padR;
      const innerH = H - padT - padB;
      const n = valid.length;
      const xOf = i => padL + (i / (n - 1)) * innerW;
      const yOf = r => padT + (1 - Math.max(0, Math.min(1, r))) * innerH;

      const points = valid.map((d, i) => [xOf(i), yOf(d.risk)]);
      let linePath = `M ${points[0][0]} ${points[0][1]}`;
      for (let i = 0; i < points.length - 1; i++) {
        const p0 = points[i - 1] || points[i];
        const p1 = points[i];
        const p2 = points[i + 1];
        const p3 = points[i + 2] || p2;
        const cp1x = p1[0] + (p2[0] - p0[0]) / 6;
        const cp1y = p1[1] + (p2[1] - p0[1]) / 6;
        const cp2x = p2[0] - (p3[0] - p1[0]) / 6;
        const cp2y = p2[1] - (p3[1] - p1[1]) / 6;
        linePath += ` C ${cp1x} ${cp1y}, ${cp2x} ${cp2y}, ${p2[0]} ${p2[1]}`;
      }
      const baseY     = padT + innerH;
      const areaPath  = `${linePath} L ${xOf(n - 1)} ${baseY} L ${padL} ${baseY} Z`;
      const gradId    = `trend-grad-${lvl.key}`;

      // 4. Y grid labels at 0/25/50/75/100, X labels max 6 — formatted.
      const gridYs   = [0, 0.25, 0.5, 0.75, 1.0];
      const maxXLab  = 6;
      const stride   = Math.max(1, Math.ceil(n / maxXLab));
      const xLabels  = valid.map((d, i) => ({
        i, show: i === 0 || i === n - 1 || i % stride === 0,
      }));

      // 5. Tooltip — index of nearest dot to pointer.
      const onMove = (e) => {
        const svg = e.currentTarget;
        const rect = svg.getBoundingClientRect();
        const x = ((e.clientX - rect.left) / rect.width) * W;
        let best = 0, bestDist = Infinity;
        for (let i = 0; i < points.length; i++) {
          const dx = Math.abs(points[i][0] - x);
          if (dx < bestDist) { bestDist = dx; best = i; }
        }
        setHover(best);
      };
      const onLeave = () => setHover(null);

      // 6. Tooltip position in chart percent (so we can absolute-position
      //    the floating <div> over the SVG without measuring it).
      let tipStyle = null, tipPayload = null;
      if (hover != null && valid[hover]) {
        const p = points[hover];
        tipStyle = { left: `${(p[0] / W) * 100}%`, top: `${(p[1] / H) * 100}%` };
        const pct = Math.round(valid[hover].risk * 100);
        const lv  = riskLevel(pct);
        tipPayload = { pct, lv, date: fmtTrendDate(valid[hover].date) };
      }

      // 7. Risk colour for the gradient — driven by *latest* point.
      const stopColor = lvl.key === 'severe' ? 'var(--risk-severe)'
                      : lvl.key === 'high' ? 'var(--risk-high)'
                      : lvl.key === 'elev' ? 'var(--risk-elev)'
                      :                      'var(--risk-low)';

      return (
        <>
          <div className="trend-summary">
            <div className="leading">
              <span className={`dot`}
                    style={{ background: stopColor }} aria-hidden="true" />
              <div>
                <div className="latest-label">Latest risk</div>
                <div className="latest-value">{latestPct}%</div>
              </div>
            </div>
            <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap',
                          justifyContent: 'flex-end' }}>
              <span className={`strain-pill ${lvl.key}`}>{lvl.label}</span>
              <span className={`trend-pill ${trend.key}`}>
                <span className="arrow">{trend.arrow}</span>{trend.label}
              </span>
            </div>
          </div>

          <div className="trend-chart-wrap">
            <svg className={`trend-chart risk-${lvl.key}`}
                 viewBox={`0 0 ${W} ${H}`}
                 preserveAspectRatio="xMidYMid meet"
                 onMouseMove={onMove}
                 onMouseLeave={onLeave}
                 onTouchStart={(e) => {
                   const t = e.touches[0];
                   if (t) onMove({ currentTarget: e.currentTarget,
                                   clientX: t.clientX });
                 }}
                 onTouchMove={(e) => {
                   const t = e.touches[0];
                   if (t) onMove({ currentTarget: e.currentTarget,
                                   clientX: t.clientX });
                 }}
                 onTouchEnd={onLeave}>
              <defs>
                <linearGradient id={gradId} x1="0" x2="0" y1="0" y2="1">
                  <stop offset="0%"   stopColor={stopColor} stopOpacity="0.28" />
                  <stop offset="100%" stopColor={stopColor} stopOpacity="0.02" />
                </linearGradient>
              </defs>

              {gridYs.map(r => (
                <g key={r}>
                  <line className="grid-line"
                        x1={padL} x2={W - padR}
                        y1={yOf(r)} y2={yOf(r)} />
                  <text className="grid-label"
                        x={padL - 6} y={yOf(r) + 4}
                        textAnchor="end">
                    {Math.round(r * 100)}
                  </text>
                </g>
              ))}

              <path d={areaPath} fill={`url(#${gradId})`} />
              <path className="area-line" d={linePath} />

              {hover != null && (
                <line className="v-cursor"
                      x1={points[hover][0]} x2={points[hover][0]}
                      y1={padT} y2={padT + innerH} />
              )}

              {points.map(([x, y], i) => (
                <circle key={i} className={`area-dot ${i === hover ? 'active' : ''}`}
                        cx={x} cy={y} r={i === hover ? 5.5 : 3.6} />
              ))}

              {xLabels.map(({ i, show }) =>
                show ? (
                  <text key={i} className="x-label"
                        x={xOf(i)} y={padT + innerH + 18}
                        textAnchor="middle">
                    {fmtTrendDate(valid[i].date)}
                  </text>
                ) : null)}
            </svg>

            {tipPayload && (
              <div className="trend-tip" style={tipStyle} role="status">
                <div className="date">{tipPayload.date}</div>
                <div className="value">{tipPayload.pct}%</div>
                <div className={`strain ${tipPayload.lv.key}`}>
                  {tipPayload.lv.label}
                </div>
              </div>
            )}
          </div>
        </>
      );
    }

    /* =========================================================
       Check-in answers — direct echoes of the wizard sliders, no
       inversion or derivation. `latest` is what the user just
       reported; `avg` is the mean across their personHist for the
       same field. `direction` is -1 when "lower is better" (stress,
       workload) so the Strongest Area card doesn't celebrate high
       stress.
       ========================================================= */
    const DIMENSIONS = [
      { id: 'mood',              name: 'Mood',
        pick: e => e.signals && +e.signals.mood,
        min: 1, max: 10, unit: '/10', loEnd: 'low',   hiEnd: 'high',   direction: +1 },
      { id: 'stress',            name: 'Stress',
        pick: e => e.signals && +e.signals.stress,
        min: 1, max: 10, unit: '/10', loEnd: 'calm',  hiEnd: 'at limit', direction: -1 },
      { id: 'deadline_pressure', name: 'Workload',
        pick: e => e.signals && +e.signals.deadline_pressure,
        min: 1, max: 10, unit: '/10', loEnd: 'none',  hiEnd: 'crushing', direction: -1 },
      { id: 'sleep',             name: 'Sleep',
        pick: e => e.signals && +e.signals.sleep,
        min: 3, max: 11, unit: 'h',   loEnd: 'short', hiEnd: 'long',   direction: +1 },
      { id: 'hours',             name: 'Work hours',
        pick: e => e.signals && +e.signals.hours,
        min: 0, max: 16, unit: 'h',   loEnd: 'light', hiEnd: 'heavy',  direction: -1 },
      { id: 'mgr_support',       name: 'Manager support',
        pick: e => e.signals && +e.signals.mgr_support,
        min: 1, max: 10, unit: '/10', loEnd: 'low',   hiEnd: 'strong', direction: +1 },
      { id: 'peer_support',      name: 'Peer support',
        pick: e => e.signals && +e.signals.peer_support,
        min: 1, max: 10, unit: '/10', loEnd: 'low',   hiEnd: 'strong', direction: +1 },
    ];

    function fmtDimValue(dim, v) {
      if (!Number.isFinite(v)) return '—';
      const rounded = Math.round(v * 10) / 10;
      const txt = Number.isInteger(rounded) ? String(rounded) : rounded.toFixed(1);
      return dim.unit === 'h' ? `${txt}h` : txt;
    }

    function computeDimensions(personHist) {
      if (!personHist || personHist.length === 0) return [];
      // personHist[0] is the most recent check-in.
      return DIMENSIONS.map(dim => {
        const values = personHist.map(dim.pick).filter(v => Number.isFinite(v));
        if (values.length === 0) {
          return { ...dim, latest: null, avg: null, count: 0 };
        }
        const latest = values[0];
        const avg    = values.reduce((s, v) => s + v, 0) / values.length;
        return { ...dim, latest, avg, count: values.length };
      }).filter(d => d.latest != null);
    }

    function strongestDimension(dims) {
      if (!dims || dims.length === 0) return null;
      // Normalise each dimension's *average* to a 0..1 "positive" score
      // honouring its direction (so "Stress: high" doesn't win).
      let best = null, bestScore = -Infinity;
      for (const d of dims) {
        if (d.avg == null) continue;
        const range = d.max - d.min;
        if (range <= 0) continue;
        const rel = (d.avg - d.min) / range;
        const score = d.direction === -1 ? (1 - rel) : rel;
        if (score > bestScore) { bestScore = score; best = d; }
      }
      return best;
    }

    function InsightsTab({ personHist, stats, insights,
                            personId, activeProfile }) {
      const trackerToday = getTrackerToday(activeProfile.personId);
      const dailyDelta   = trackerDelta(trackerToday);

      const hasData = personHist.length > 0;
      // Latest risk (this week if exists, else most-recent check-in).
      const latest = personHist[0];
      const baseRisk = latest ? latest.risk : 0;
      const displayRisk = Math.max(0, Math.min(1, baseRisk + dailyDelta));
      const v = verdict(Math.max(0.001, displayRisk));

      // 7-day vs previous-7-day comparator.
      let compareText = 'no comparison yet';
      let compareKind = 'flat';
      if (personHist.length >= 2) {
        const recent  = personHist.slice(0, Math.min(7, personHist.length));
        const older   = personHist.slice(7, Math.min(14, personHist.length));
        if (older.length > 0) {
          const avg = a => a.reduce((s, e) => s + e.risk, 0) / a.length;
          const diff = avg(recent) - avg(older);
          if (Math.abs(diff) < 0.03) {
            compareText = 'stable vs previous days';
            compareKind = 'flat';
          } else if (diff > 0) {
            compareText = `+${(diff * 100).toFixed(0)}% vs previous days`;
            compareKind = 'up';
          } else {
            compareText = `${(diff * 100).toFixed(0)}% vs previous days`;
            compareKind = 'down';
          }
        }
      }

      // Build chart data from personHist directly (personHist is newest -> oldest;
      // the chart expects oldest -> newest and validates each point itself).
      const chartData = personHist
        .slice(0, 30)
        .map(e => ({ date: e.when, risk: e.risk }))
        .reverse();

      const dims = computeDimensions(personHist);
      const strongest = strongestDimension(dims);

      return (
        <div className="pane">
          <div className="eyebrow-pill">
            {todayLabel().toUpperCase()}
          </div>
          <h1 className="display-title">Your Dashboard</h1>
          <div className="display-sub">
            {personHist.length === 0
              ? 'No check-ins yet — start one from Home.'
              : `${personHist.length} check-in${personHist.length === 1 ? '' : 's'} recorded — keep going.`}
          </div>

          <div className="panel ring-card">
            <div className="panel-head">
              <div>
                <div className="panel-title">Burnout Risk</div>
                <div className="panel-sub">
                  Patterns linked to emotional overload — not a diagnosis.
                </div>
              </div>
            </div>
            {hasData ? (
              <>
                <RiskRing pct={displayRisk} color={v.color} label={v.label} />
                <div className="ring-foot">
                  <span className="compare">{compareText}</span>
                  <span className={`delta ${
                    dailyDelta > 0.005 ? 'up'
                    : dailyDelta < -0.005 ? 'down' : 'flat'}`}>
                    {dailyDelta > 0.005
                      ? `+${(dailyDelta * 100).toFixed(0)}% from today's check-in`
                      : dailyDelta < -0.005
                        ? `${(dailyDelta * 100).toFixed(0)}% from today's check-in`
                        : 'No shift from today'}
                  </span>
                </div>
              </>
            ) : (
              <div style={{ padding: '24px 8px 4px', textAlign: 'center',
                            color: 'var(--text-muted)' }}>
                Your risk ring appears here once you've completed a check-in.
              </div>
            )}
          </div>

          {strongest && (
            <div className="panel strongest-area">
              <div className="strongest-eyebrow">
                <svg viewBox="0 0 24 24" fill="none">
                  <circle cx="12" cy="12" r="9"
                          stroke="currentColor" strokeWidth="1.8"/>
                  <circle cx="12" cy="12" r="4.5"
                          stroke="currentColor" strokeWidth="1.8"/>
                  <circle cx="12" cy="12" r="1.6" fill="currentColor"/>
                </svg>
                Strongest Area
              </div>
              <div className="panel-title">{strongest.name}</div>
              <div className="panel-sub">
                Avg: {fmtDimValue(strongest, strongest.avg)}
                {strongest.unit === '/10' ? '/10' : ''}
                {strongest.direction === -1 ? ' · lower is better' : ''}
              </div>
            </div>
          )}

          <div className="panel trend-card">
            <div className="head-row">
              <div className="h">Burnout Risk Over Time</div>
            </div>
            <div className="sub">
              Your pattern becomes clearer as you check in over time.
            </div>
            <TrendChart data={chartData} />
          </div>

          {dims.length > 0 && (
            <div className="panel">
              <div className="panel-head">
                <div className="panel-title">Your latest check-in</div>
              </div>
              <div className="panel-sub" style={{ marginBottom: 14 }}>
                The exact values you reported — same scale as the questions.
              </div>
              {dims.map(d => {
                const range = d.max - d.min;
                const relLatest = range > 0
                  ? Math.max(0, Math.min(1, (d.latest - d.min) / range)) : 0;
                const relAvg    = range > 0
                  ? Math.max(0, Math.min(1, (d.avg    - d.min) / range)) : 0;
                const showAvg = d.count > 1
                  && Math.abs(d.latest - d.avg) > (d.unit === 'h' ? 0.25 : 0.1);
                return (
                  <div key={d.id} className="dim-row">
                    <div className="dim-label">{d.name}</div>
                    <div className="dim-value">{fmtDimValue(d, d.latest)}</div>
                    <div className="dim-bar">
                      <span style={{ width: `${Math.max(2, relLatest * 100)}%` }} />
                      {d.count > 1 && (
                        <i className="dim-avg-tick"
                           style={{ left: `${relAvg * 100}%` }}
                           title={`${d.count}-check-in average`} />
                      )}
                    </div>
                    <div className="dim-foot">
                      <span className="end">{d.loEnd}</span>
                      {showAvg && (
                        <span className="avg">
                          {d.count}-check-in avg · {fmtDimValue(d, d.avg)}
                        </span>
                      )}
                      <span className="end">{d.hiEnd}</span>
                    </div>
                  </div>
                );
              })}
            </div>
          )}

          {insights.length > 0 && (
            <div className="panel">
              <div className="panel-head">
                <div className="panel-title">What we noticed</div>
              </div>
              <div className="insights-list">
                {insights.map((ins, i) => (
                  <div key={i} className={`insight ${ins.kind}`}>
                    <div className="insight-icon">
                      {ins.kind === 'good' ? '↓'
                        : ins.kind === 'bad' ? '↑'
                        : ins.kind === 'warn' ? '!' : '·'}
                    </div>
                    <span>{ins.text}</span>
                  </div>
                ))}
              </div>
            </div>
          )}

                  const isLatestToday = idx === 0
                    && typeof e.when === 'string'

    /* =========================================================
       APP — top-level state machine
       ========================================================= */
    const TABS = [
      { id: 'home',     label: 'Home' },
      { id: 'insights', label: 'Insights' },
      { id: 'team',     label: 'Team' },
      { id: 'profile',  label: 'Profile' },
    ];

    /** Tab bar order — used for subtle slide direction on change */
    const MAIN_TAB_ORDER = ['home', 'insights', 'tracker', 'profile'];
    const SUPPORTS_VIEW_TRANSITION =
      typeof document !== 'undefined'
      && typeof document.startViewTransition === 'function';

    /** Horizontal swipe distance (px) to move between main tabs */
    const SWIPE_TAB_MIN_PX = 64;
    const SWIPE_TAB_MAX_MS = 720;

    function App() {
      // Profiles + sign-in
      const [profiles, setProfiles]       = useState(() => loadProfiles());
      const [activeId, setActiveId]       = useState(() => loadStr(ACTIVE_KEY, ''));
      const activeProfile = useMemo(
        () => profiles.find(p => p.id === activeId) || null,
        [profiles, activeId]
      );

      // History + bundle + prefs
      const [history, setHistory]         = useState(loadHistory());
      const [bundle,  setBundle]          = useState(loadBundle());
      const [bundleSourceMeta, setBundleSourceMeta] = useState(() =>
        loadBundleSourceMeta());
      const engineSource = useMemo(
        () => bundleSourceDisplay(bundle, bundleSourceMeta),
        [bundle, bundleSourceMeta]
      );
      const [theme,   setTheme]           = useState(loadStr(THEME_KEY, 'system'));
      const [reminderDow, setReminderDow] = useState(loadStr(REMIND_KEY, ''));

      // UI
      const [tab, setTab]                 = useState('home');
      const [tabSlideDir, setTabSlideDir]   = useState(0);
      const [showWizard, setShowWizard]   = useState(false);
      const [result, setResult]           = useState(null);
      const [toast, setToast]             = useState(null);
      const [showProfileMgr, setShowProfileMgr] = useState(false);

      // Daily tracker — keyed by the active profile + today's date.
      const personId = activeProfile ? activeProfile.personId : '';
      const [trackerToday, setTrackerTodayState] = useState(
        () => personId ? getTrackerToday(personId) : {});
      useEffect(() => {
        if (personId) setTrackerTodayState(getTrackerToday(personId));
      }, [personId]);
      const setTrackerValue = (fieldId, value) => {
        setTrackerTodayState(prev => {
          const next = { ...prev };
          if (value == null) delete next[fieldId];
          else next[fieldId] = value;
          if (personId) setTrackerToday(personId, next);
          return next;
        });
      };

      const fileRef       = useRef(null);
      const bundleFileRef = useRef(null);
      const shellMainRef  = useRef(null);

      const goTab = useCallback((next) => {
        if (next === tab) return;
        const pi = MAIN_TAB_ORDER.indexOf(tab);
        const ni = MAIN_TAB_ORDER.indexOf(next);
        const dir = pi >= 0 && ni >= 0 && ni !== pi ? (ni > pi ? 1 : -1) : 0;
        const reduceMotion =
          typeof window.matchMedia === 'function'
          && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        const run = () => {
          ReactDOM.flushSync(() => {
            setTabSlideDir(dir);
            setTab(next);
          });
          requestAnimationFrame(() => {
            shellMainRef.current?.scrollTo(0, 0);
          });
        };

        if (SUPPORTS_VIEW_TRANSITION && !reduceMotion) {
          document.startViewTransition(run);
        } else {
          run();
        }
      }, [tab]);

      useEffect(() => {
        if (!activeProfile) return;
        const el = shellMainRef.current;
        if (!el) return;

        const ignoredStart = (target) => {
          if (!target || typeof target.closest !== 'function') return true;
          return !!target.closest(
            '.trend-chart-wrap, input, textarea, select, option'
          );
        };

        let activePid = null;
        let sx = 0;
        let sy = 0;
        let st = 0;

        let onWinUp = null;
        let onWinCancel = null;

        const cleanupWin = () => {
          if (onWinUp) {
            window.removeEventListener('pointerup', onWinUp);
            window.removeEventListener('pointercancel', onWinCancel);
            onWinUp = null;
            onWinCancel = null;
          }
        };

        const finishSwipe = (e) => {
          if (!e.isPrimary || e.pointerId !== activePid) return;
          activePid = null;
          cleanupWin();

          if (showWizard || result || showProfileMgr) return;
          const dt = Date.now() - st;
          const dx = e.clientX - sx;
          const dy = e.clientY - sy;
          if (dt > SWIPE_TAB_MAX_MS) return;
          if (Math.abs(dx) < SWIPE_TAB_MIN_PX) return;
          if (Math.abs(dy) > Math.abs(dx) * 0.65) return;

          const order = MAIN_TAB_ORDER;
          const i = order.indexOf(tab);
          if (i < 0) return;
          if (dx < 0) {
            if (i < order.length - 1) goTab(order[i + 1]);
          } else if (i > 0) {
            goTab(order[i - 1]);
          }
        };

        const onDown = (e) => {
          if (!e.isPrimary) return;
          if (activePid != null) return;
          if (e.pointerType === 'mouse' && e.button !== 0) return;
          if (ignoredStart(e.target)) return;

          activePid = e.pointerId;
          sx = e.clientX;
          sy = e.clientY;
          st = Date.now();

          onWinUp = (ev) => finishSwipe(ev);
          onWinCancel = (ev) => {
            if (ev.pointerId !== activePid) return;
            activePid = null;
            cleanupWin();
          };
          window.addEventListener('pointerup', onWinUp, { passive: true });
          window.addEventListener('pointercancel', onWinCancel, { passive: true });
        };

        el.addEventListener('pointerdown', onDown, { passive: true });

        return () => {
          el.removeEventListener('pointerdown', onDown);
          cleanupWin();
          activePid = null;
        };
      }, [activeProfile, tab, goTab, showWizard, result, showProfileMgr]);

      // Persistence
      useEffect(() => saveHistory(history), [history]);
      useEffect(() => { applyTheme(theme); saveStr(THEME_KEY, theme); }, [theme]);
      useEffect(() => saveStr(REMIND_KEY, reminderDow), [reminderDow]);
      useEffect(() => saveStr(ACTIVE_KEY, activeId), [activeId]);
      useEffect(() => saveJson(PROFILES_KEY, profiles), [profiles]);

      useEffect(() => {
        if (theme !== 'system') return;
        const mq = window.matchMedia('(prefers-color-scheme: dark)');
        const fn = () => applyTheme('system');
        mq.addEventListener('change', fn);
        return () => mq.removeEventListener('change', fn);
      }, [theme]);

      useEffect(() => {
        if (!toast) return;
        const t = setTimeout(() => setToast(null), 2400);
        return () => clearTimeout(t);
      }, [toast]);

      useEffect(() => {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.register('sw.js').then(reg => {
            // Check for an updated SW every time the page loads, and
            // when a new one is waiting, reload once so the user
            // immediately gets the latest copy instead of a stale one.
            reg.update?.();
            reg.addEventListener?.('updatefound', () => {
              const nw = reg.installing;
              if (!nw) return;
              nw.addEventListener('statechange', () => {
                if (nw.state === 'installed'
                    && navigator.serviceWorker.controller) {
                  if (!sessionStorage.getItem('sw-reloaded')) {
                    sessionStorage.setItem('sw-reloaded', '1');
                    nw.postMessage?.({ type: 'SKIP_WAITING' });
                    location.reload();
                  }
                }
              });
            });
          }).catch(() => {});
        }
      }, []);

      useEffect(() => {
        if (!activeProfile) return;
        maybeRemind(history, reminderDow, activeProfile.personId);
      }, [activeProfile?.id]);

      // Validate active profile, fall back if needed
      useEffect(() => {
        if (activeId && !profiles.find(p => p.id === activeId)) {
          setActiveId('');
        }
      }, [profiles, activeId]);

      // Scoring function used when backfilling risk on imported CSV rows.
      // Translates chip keys -> model events on the way in.
      const scoreFn = useMemo(() => {
        return (s, ev, feeling = 'managing', histSlice = []) => {
          const chipSet = ev instanceof Set ? ev : new Set(ev || []);
          const hybrid = calculateBurnoutRisk(s, histSlice, {
            feeling,
            events: [...chipSet],
          });
          let prob = hybrid.scoreProb;
          if (bundle && bundle.feature_cols && bundle.logreg && bundle.gbt) {
            const modelEv = eventsForModel(chipSet);
            const out = realModelScore(bundle, s, modelEv, histSlice);
            prob = Math.max(out.ensemble_mean, prob);
          }
          return prob;
        };
      }, [bundle]);

      // Person-filtered slices
      const personHist = useMemo(() => {
        if (!activeProfile) return [];
        return history.filter(e =>
          (e.person_id || 'me') === activeProfile.personId);
      }, [history, activeProfile]);

      const stats = useMemo(() => {
        const recent4 = personHist.slice(0, 4);
        return {
          weeks:   uniqueWeekKeys(personHist).length,
          streak:  computeStreak(personHist),
          latest:  personHist[0],
          avgRisk: recent4.length === 0 ? null
                   : recent4.reduce((s, e) => s + e.risk, 0) / recent4.length,
        };
      }, [personHist]);

      const insights = useMemo(
        () => buildInsights(personHist, personHist[0]),
        [personHist]
      );

      // -------- Actions --------
      const startCheckin = () => {
        setShowWizard(true);
      };

      // Always start the wizard from the neutral middle so the user
      // actively answers each question. Pre-filling from last week
      // would put the sliders "randomly around the chart".
      const wizardInitialSignals = useMemo(() => ({ ...DEFAULTS }), []);
      const wizardInitialFeeling = 'managing';

      const handleSave = ({ signals, feeling, events, notes }) => {
        const eventSet = new Set(events);
        const modelSignals = signalsForModel(signals);
        const modelEventSet = eventsForModel(eventSet);
        const historyForModel = personHist.slice(0, 60).map(h => ({
          signals: h.signals,
          events:  [...eventsForModel(new Set(h.events || []))],
        }));
        const historyForHybrid = personHist.slice(0, 28);

        const trackerToday = getTrackerToday(activeProfile.personId);
        const hybrid = calculateBurnoutRisk(modelSignals, historyForHybrid, {
          feeling,
          events: [...eventSet],
          trackerToday,
        });

        let scoreOutput = null;
        let risk = hybrid.scoreProb;

        const driverReasons = hybrid.topReasons.map((label, i) => ({
          key: 'reason-' + i,
          kind: 'reason',
          label,
          c: 0,
        }));
        let drivers = driverReasons;

        if (bundle && bundle.feature_cols && bundle.logreg && bundle.gbt) {
          scoreOutput = realModelScore(bundle, modelSignals, modelEventSet, historyForModel);
          risk = Math.max(risk, scoreOutput.ensemble_mean);
          const md = realModelDrivers(bundle, scoreOutput).map(d => ({
            ...d, kind: 'model',
          }));
          drivers = [...driverReasons, ...md];
        }

        const v = verdict(risk);
        const entry = {
          id: Date.now(),
          when: new Date().toISOString(),
          person_id: activeProfile.personId,
          signals: { ...signals },
          events: [...eventSet],
          feeling, notes,
          risk, verdict: v.label,
        };
        setHistory(h => [entry, ...h].slice(0, 1000));
        setResult({
          entry, v, drivers,
          hybridExplain: hybrid.explain,
          hybridAction: hybrid.recommendedAction,
          safetyNetSuggested: hybrid.safetyNetSuggested,
          modelLabel: scoreOutput
            ? 'Trained model blended with safety-aware check'
            : 'Safety-aware score',
        });
        setShowWizard(false);
      };

      const handleDismissResult = () => {
        setResult(null);
        goTab('home');
      };

      const clearAll = () => {
        if (confirm('Delete all check-ins for every profile? This cannot be undone.')) {
          setHistory([]);
          setToast('All check-ins deleted');
        }
      };

      const handleExport = () => {
        const csv = exportCsv(history);
        const blob = new Blob([csv], { type: 'text/csv' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `checkins-${new Date().toISOString().slice(0, 10)}.csv`;
        a.click();
        URL.revokeObjectURL(a.href);
        setToast(`Exported ${history.length} check-in${history.length === 1 ? '' : 's'}`);
      };

      const handleImportClick = () => fileRef.current?.click();
      const handleFileChange = (e) => {
        const f = e.target.files?.[0];
        if (!f) return;
        const reader = new FileReader();
        reader.onload = () => {
          try {
            const r = importCsv(reader.result, history, scoreFn);
            setHistory(r.history);
            setToast(`Imported ${r.added} new` + (r.skipped ? `, skipped ${r.skipped}` : ''));
          } catch {
            setToast('Could not parse that CSV');
          }
        };
        reader.readAsText(f);
        e.target.value = '';
      };

      const handleBundleClick = () => bundleFileRef.current?.click();
      const handleBundleChange = (e) => {
        const f = e.target.files?.[0];
        if (!f) return;
        const reader = new FileReader();
        reader.onload = () => {
          try {
            let raw = reader.result.trim();
            if (raw.startsWith('window.MODEL_BUNDLE')) {
              raw = raw.replace(/^[^=]*=\s*/, '').replace(/;\s*$/, '');
            } else if (!raw.startsWith('{')) {
              try { raw = atob(raw.replace(/\s+/g, '')); } catch {}
            }
            const parsed = JSON.parse(raw);
            if (!parsed.feature_cols || !parsed.logreg || !parsed.gbt) {
              throw new Error('Missing keys');
            }
            saveBundle(parsed);
            saveBundleSourceMeta({ kind: 'file', filename: f.name });
            setBundleSourceMeta({ kind: 'file', filename: f.name });
            setBundle(parsed);
            setToast('Trained model loaded');
          } catch {
            setToast('Could not load that file as a model bundle');
          }
        };
        reader.readAsText(f);
        e.target.value = '';
      };

      const clearBundle = () => {
        saveBundle(null);
        saveBundleSourceMeta(null);
        setBundleSourceMeta(null);
        setBundle(null);
        setToast('Reverted to heuristic scoring');
      };

      const requestReminder = async (dow) => {
        if (dow === '') {
          setReminderDow('');
          setToast('Reminders off');
          return;
        }
        if (!('Notification' in window)) {
          setToast('Notifications not supported in this browser');
          return;
        }
        const perm = await Notification.requestPermission();
        if (perm === 'granted') {
          setReminderDow(String(dow));
          setToast(`I'll remind you on ${DOWS[dow]}s`);
        } else {
          setToast('Reminder permission denied');
        }
      };

      // ---- Profile management actions ----
      const onSignIn = (pid) => { setActiveId(pid); setTab('home'); };
      const onSignOut = () => { setActiveId(''); setShowProfileMgr(false); };

      // Wipe everything for a clean test run.
      const wipeEverything = () => {
        try {
          [STORAGE_KEY, STORAGE_KEY_V1, THEME_KEY, REMIND_KEY,
           BUNDLE_KEY, BUNDLE_SOURCE_META_KEY, PROFILES_KEY, ACTIVE_KEY, TRACKER_KEY, LEGACY_PERSON]
            .forEach(k => localStorage.removeItem(k));
          sessionStorage.clear();
        } catch {}
        window.location.reload();
      };
      const onCreateProfile = (profile) => {
        setProfiles(ps => [...ps, profile]);
        setActiveId(profile.id);
        setTab('home');
      };
      const onRenameProfile = (id, name) => {
        setProfiles(ps => ps.map(p => p.id === id
          ? { ...p, name,
              personId: p.personId /* keep CSV identity stable */ }
          : p));
      };
      const onSetPin = (id, passwordHash, salt) => {
        setProfiles(ps => ps.map(p => p.id === id
          ? { ...p, passwordHash, salt }
          : p));
        setToast(passwordHash ? 'Password updated' : 'Password removed');
      };
      const onDeleteProfile = (id) => {
        setProfiles(ps => ps.filter(p => p.id !== id));
        if (id === activeId) setActiveId('');
      };
      const onPickFromTeam = (profileId) => {
        const p = profiles.find(x => x.id === profileId);
        if (!p) return;
        if (p.id !== activeId) {
          // Switching to a protected profile means signing out and going
          // through the login screen again.
          if (p.passwordHash) {
            setActiveId('');
            setToast(`Sign in as ${p.name} to drill in`);
          } else {
            setActiveId(p.id);
            goTab('insights');
          }
        } else {
          goTab('insights');
        }
      };

      // ============ LOGIN ============
      if (!activeProfile) {
        return (
          <>
            <LoginScreen
              profiles={profiles}
              onSignIn={onSignIn}
              onCreateProfile={onCreateProfile}
              onWipe={wipeEverything}
              onTransientToast={setToast}
            />
            {toast && <div className="toast">{toast}</div>}
          </>
        );
      }

      // ============ AUTHENTICATED SHELL ============
      const tabIcons = {
        home: (active) => (
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M3 11l9-7 9 7v9a2 2 0 0 1-2 2h-4v-6h-6v6H5a2 2 0 0 1-2-2v-9z"
                  stroke="currentColor" strokeWidth={active ? 2 : 1.8}
                  strokeLinejoin="round"
                  fill={active ? 'currentColor' : 'none'}
                  fillOpacity={active ? 0.12 : 0} />
          </svg>
        ),
        insights: (active) => (
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M3 20h18 M6 16l4-6 4 4 5-9"
                  stroke="currentColor" strokeWidth={active ? 2.2 : 1.8}
                  strokeLinecap="round" strokeLinejoin="round" />
          </svg>
        ),
        tracker: (active) => (
          <svg viewBox="0 0 24 24" fill="none">
            <rect x="4" y="4" width="7" height="7" rx="1.5"
                  stroke="currentColor" strokeWidth={active ? 2 : 1.8}
                  fill={active ? 'currentColor' : 'none'}
                  fillOpacity={active ? 0.12 : 0} />
            <rect x="13" y="4" width="7" height="7" rx="1.5"
                  stroke="currentColor" strokeWidth={active ? 2 : 1.8}
                  fill={active ? 'currentColor' : 'none'}
                  fillOpacity={active ? 0.12 : 0} />
            <rect x="4" y="13" width="7" height="7" rx="1.5"
                  stroke="currentColor" strokeWidth={active ? 2 : 1.8}
                  fill={active ? 'currentColor' : 'none'}
                  fillOpacity={active ? 0.12 : 0} />
            <rect x="13" y="13" width="7" height="7" rx="1.5"
                  stroke="currentColor" strokeWidth={active ? 2 : 1.8}
                  fill={active ? 'currentColor' : 'none'}
                  fillOpacity={active ? 0.12 : 0} />
          </svg>
        ),
        profile: (active) => (
          <svg viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="8" r="4"
                    stroke="currentColor" strokeWidth={active ? 2 : 1.8}
                    fill={active ? 'currentColor' : 'none'}
                    fillOpacity={active ? 0.12 : 0} />
            <path d="M4 21c0-4 4-6 8-6s8 2 8 6"
                  stroke="currentColor" strokeWidth={active ? 2 : 1.8}
                  strokeLinecap="round" />
          </svg>
        ),
      };

      const tabPaneClass =
        'tab-page vt-root'
        + (SUPPORTS_VIEW_TRANSITION
            ? ''
            : ` tab-fallback tab-dir-${
                tabSlideDir > 0 ? 'fwd' : tabSlideDir < 0 ? 'back' : 'neutral'
              }`);

      // Header is intentionally minimal in the new design — the screen
      // content carries its own eyebrow + display title.
      const headerTitle = '';
      const headerSub = '';

      return (
        <>
          <input ref={fileRef} type="file" accept=".csv,text/csv"
                 style={{ display: 'none' }}
                 onChange={handleFileChange} />
          <input ref={bundleFileRef} type="file"
                 accept=".json,.js,.b64,.txt,application/json,text/javascript,text/plain"
                 style={{ display: 'none' }}
                 onChange={handleBundleChange} />

          <div className="shell">
            <div className="app-header">
              <div />
              <div className="app-header-right">
                {tab !== 'profile' && (
                  <button className="icon-btn" aria-label="Profile"
                          onClick={() => goTab('profile')}>
                    <Avatar name={activeProfile.name}
                            color={activeProfile.color} size="sm" />
                  </button>
                )}
              </div>
            </div>

            <div className="app-main" ref={shellMainRef}>
              <div className={tabPaneClass} key={tab}>
              {tab === 'home' && (
                <HomeTab
                  activeProfile={activeProfile}
                  personHist={personHist}
                  stats={stats}
                  onStartCheckin={startCheckin}
                  onGoDashboard={() => goTab('insights')}
                  onGoTracker={() => goTab('tracker')}
                />
              )}
              {tab === 'insights' && (
                <InsightsTab
                  personHist={personHist}
                  stats={stats}
                  insights={insights}
                  personId={activeProfile.personId}
                  activeProfile={activeProfile}
                />
              )}
              {tab === 'tracker' && (
                <TrackerTab
                  activeProfile={activeProfile}
                  trackerToday={trackerToday}
                  setTrackerValue={setTrackerValue}
                />
              )}
              {tab === 'profile' && (
                <ProfileTab
                  activeProfile={activeProfile}
                  profiles={profiles}
                  history={history}
                  theme={theme} setTheme={setTheme}
                  reminderDow={reminderDow}
                  requestReminder={requestReminder}
                  bundle={bundle}
                  engineSource={engineSource}
                  onLoadBundle={handleBundleClick}
                  onClearBundle={clearBundle}
                  onExport={handleExport}
                  onImportClick={handleImportClick}
                  onManageProfiles={() => setShowProfileMgr(true)}
                  onSignOut={onSignOut}
                  onClearAll={clearAll}
                />
              )}
              </div>
            </div>
          </div>

          <div className="tabbar-dock">
            <nav className="tabbar" aria-label="Primary navigation">
              <button type="button"
                      className={`tab ${tab === 'home' ? 'active' : ''}`}
                      onClick={() => goTab('home')}>
                {tabIcons.home(tab === 'home')}
                <span>Home</span>
              </button>
              <button type="button"
                      className={`tab ${tab === 'insights' ? 'active' : ''}`}
                      onClick={() => goTab('insights')}>
                {tabIcons.insights(tab === 'insights')}
                <span>Dashboard</span>
              </button>
              <button type="button"
                      className="tab has-fab"
                      onClick={startCheckin}
                      aria-label="New check-in">
                <span className="fab">
                  <svg viewBox="0 0 24 24" fill="none">
                    <path d="M12 5v14M5 12h14"
                          stroke="currentColor" strokeWidth="2.5"
                          strokeLinecap="round" />
                  </svg>
                </span>
                <span>Check in</span>
              </button>
              <button type="button"
                      className={`tab ${tab === 'tracker' ? 'active' : ''}`}
                      onClick={() => goTab('tracker')}>
                {tabIcons.tracker(tab === 'tracker')}
                <span>Tracker</span>
              </button>
              <button type="button"
                      className={`tab ${tab === 'profile' ? 'active' : ''}`}
                      onClick={() => goTab('profile')}>
                {tabIcons.profile(tab === 'profile')}
                <span>Profile</span>
              </button>
            </nav>
          </div>

          {showWizard && (
            <CheckinWizard
              initialSignals={wizardInitialSignals}
              initialFeeling={wizardInitialFeeling}
              onCancel={() => setShowWizard(false)}
              onComplete={handleSave}
            />
          )}

          {result && (
            <ResultScreen result={result} engineSource={engineSource}
                          onDismiss={handleDismissResult} />
          )}

          {showProfileMgr && (
            <ProfileManager
              profiles={profiles}
              activeId={activeId}
              onClose={() => setShowProfileMgr(false)}
              onRename={onRenameProfile}
              onSetPin={onSetPin}
              onDeleteProfile={onDeleteProfile}
              onAddProfile={() => {
                setShowProfileMgr(false);
                setActiveId('');
              }}
            />
          )}

          {toast && <div className="toast">{toast}</div>}
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
