    function CareCircleTab({ profiles, history, activeProfile }) {
      const [connections, setConnections] = useState(() => loadConnections());
      const [selectedId, setSelectedId] = useState('');
      const [remoteTracker, setRemoteTracker] = useState({});

      useEffect(() => {
        const refresh = () => setConnections(loadConnections());
        window.addEventListener('wellcare-connections-changed', refresh);
        return () => window.removeEventListener('wellcare-connections-changed', refresh);
      }, []);

      useEffect(() => {
        let cancelled = false;
        const ids = [...new Set(connections
          .filter(c => isAcceptedConnection(c))
          .map(c => c.personId)
          .filter(Boolean))];
        if (!ids.length) {
          setRemoteTracker({});
          return;
        }
        Promise.all(ids.map(async id => [id, await fetchSharedTracker(id, activeProfile.personId)]))
          .then(entries => {
            if (cancelled) return;
            setRemoteTracker(Object.fromEntries(entries));
          });
        return () => { cancelled = true; };
      }, [connections, activeProfile.personId]);

      const byPerson = useMemo(() => {
        const map = new Map();
        for (const e of history) {
          const id = e.person_id || 'me';
          if (!map.has(id)) map.set(id, []);
          map.get(id).push(e);
        }
        for (const list of map.values()) {
          list.sort((a, b) => new Date(b.when) - new Date(a.when));
        }
        return map;
      }, [history]);

      const rows = useMemo(() => {
        const localProfileRows = profiles
          .filter(p => p.id !== activeProfile.id)
          .map(p => {
            const existing = connections.find(c => c.personId === p.personId || c.name === p.name);
            return normalizeConnection(existing || {
              id: `local-${p.id}`,
              personId: p.personId,
              name: p.name,
              relationship: p.relationship || 'Friend',
              status: 'accepted',
              color: p.color,
              source: 'local-profile',
            });
          });
        const merged = [...connections, ...localProfileRows];
        const seen = new Set();
        return merged
          .filter(c => {
            const key = c.personId || c.id;
            if (seen.has(key)) return false;
            seen.add(key);
            return true;
          })
          .map(c => {
            const remote = remoteTracker[c.personId] || [];
            const local = byPerson.get(c.personId) || [];
            const hist = local.length ? local : remote;
            const latest = hist[0] || null;
            return { conn: c, hist, latest };
          })
          .sort((a, b) => (b.latest?.risk || 0) - (a.latest?.risk || 0));
      }, [profiles, activeProfile.id, connections, byPerson]);

      const acceptedRows = rows.filter(r => isAcceptedConnection(r.conn));
      const visibleRiskRows = acceptedRows.filter(r => r.latest && r.conn.share.risk);
      const avg = visibleRiskRows.length
        ? visibleRiskRows.reduce((s, r) => s + r.latest.risk, 0) / visibleRiskRows.length
        : null;
      const elevated = visibleRiskRows.filter(r => r.latest.risk >= 0.56).length;
      const selected = rows.find(r => r.conn.id === selectedId) || null;

      function updateConnection(id, patch) {
        const current = loadConnections();
        const next = current.map(c => c.id === id ? normalizeConnection({ ...c, ...patch }) : c);
        saveConnections(next);
        setConnections(next);
      }

      function trendFor(hist) {
        if (!hist || hist.length < 2) return 'No trend yet';
        const diff = hist[0].risk - hist[Math.min(hist.length - 1, 6)].risk;
        if (diff > 0.06) return 'Rising';
        if (diff < -0.06) return 'Improving';
        return 'Stable';
      }

      function supportAction(risk, trend) {
        if (!Number.isFinite(risk)) return 'Invite them to share a first check-in when they are ready.';
        if (risk >= 0.76) return 'Reach out directly and offer specific help with one obligation today.';
        if (risk >= 0.56) return 'Send a gentle check-in and ask what would make the next 24 hours easier.';
        if (trend === 'Rising') return 'A low-pressure message may help before things build up.';
        return 'Keep the connection warm; no alert is needed right now.';
      }

      if (selected) {
        const { conn, hist, latest } = selected;
        const allowed = normalizeShareSettings(conn.share);
        const accepted = isAcceptedConnection(conn);
        const v = latest ? verdict(latest.risk) : null;
        const trend = allowed.trend ? trendFor(hist) : 'Private';
        const recoveryLabel = latest
          ? (latest.recovery_status || latest.recoveryStatus?.label || 'Not logged')
          : 'Not logged';
        const chartData = hist.slice(0, 14).map(e => ({ date: e.when, risk: e.risk })).reverse();
        const thresholdPct = Math.round((conn.alertThreshold || 0.75) * 100);

        return (
          <div className="pane">
            <button className="chip-btn" onClick={() => setSelectedId('')}>
              ← Care Circle
            </button>
            <div className="panel">
              <div className="circle-detail-head">
                <Avatar name={conn.name} color={conn.color || colorFor(conn.name)} size="lg" />
                <div style={{ flex: 1 }}>
                  <div className="panel-title" style={{ fontSize: 22 }}>{conn.name}</div>
                  <div className="panel-sub">
                    {conn.relationship || 'Friend'} · {accepted ? 'Connected' : conn.status}
                  </div>
                </div>
                {v && allowed.level && <span className="mini-tag" style={{ color: v.color }}>{v.label}</span>}
              </div>

              {!accepted ? (
                <div className="helper">
                  Tracker sharing starts after this connection is accepted.
                </div>
              ) : latest ? (
                <>
                  <RiskRing pct={allowed.risk ? latest.risk : 0} color={v.color}
                            label={allowed.risk ? v.label : 'Private'} />
                  <div className="circle-metric-grid">
                    <div className="circle-metric">
                      <div className="k">Burnout Risk</div>
                      <div className="v">{allowed.risk ? `${Math.round(latest.risk * 100)}%` : 'Private'}</div>
                    </div>
                    <div className="circle-metric">
                      <div className="k">Trend</div>
                      <div className="v">{trend}</div>
                    </div>
                    <div className="circle-metric">
                      <div className="k">Last Check-In</div>
                      <div className="v">{allowed.last_checkin ? shortDate(latest.when) : 'Private'}</div>
                    </div>
                    <div className="circle-metric">
                      <div className="k">Recovery Status</div>
                      <div className="v">{allowed.recovery_status ? recoveryLabel : 'Private'}</div>
                    </div>
                    <div className="circle-metric">
                      <div className="k">Alert Threshold</div>
                      <div className="v">{thresholdPct}%</div>
                    </div>
                  </div>
                  {allowed.trend && (
                    <div className="panel trend-card" style={{ marginTop: 12 }}>
                      <div className="head-row"><div className="h">Shared Risk History</div></div>
                      <TrendChart data={chartData} />
                    </div>
                  )}
                  <div className="panel" style={{ marginTop: 12 }}>
                    <div className="panel-title">Suggested support action</div>
                    <div className="panel-sub">{supportAction(latest.risk, trend)}</div>
                  </div>
                </>
              ) : (
                <div className="helper">
                  No shared check-ins yet. Once they check in, you will see only the tracker fields they allow.
                </div>
              )}

              {!String(conn.id).startsWith('local-') && (
                <div className="panel" style={{ marginTop: 12 }}>
                  <div className="panel-title">Alert threshold</div>
                  <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginTop: 10 }}>
                    <input type="range" min="0.45" max="0.95" step="0.01"
                           value={conn.alertThreshold || 0.75}
                           onChange={e => updateConnection(conn.id, { alertThreshold: parseFloat(e.target.value) })} />
                    <strong style={{ minWidth: 44, textAlign: 'right' }}>{thresholdPct}%</strong>
                  </div>
                </div>
              )}

              <div className="panel" style={{ marginTop: 12 }}>
                <div className="panel-title">Privacy boundary</div>
                <div className="privacy-list">
                  <div>Shared by default: risk percentage, risk level, trend, and last check-in time.</div>
                  <div>Hidden by default: private answers, exact habit details, notes, and sensitive explanations.</div>
                  <div>Top contributors: {allowed.top_contributors ? 'shared' : 'private'} · Recovery status: {allowed.recovery_status ? 'shared' : 'private'}</div>
                </div>
              </div>
            </div>
          </div>
        );
      }

      return (
        <div className="pane">
          <div className="home-hero">
            <div className="eyebrow">Care Circle latest</div>
            <div className="pct">{avg == null ? '—' : `${(avg * 100).toFixed(0)}%`}</div>
            <div className="verdict">
              {acceptedRows.length === 0
                ? 'Trusted people you connect with will appear here'
                : `${acceptedRows.length} connected ${acceptedRows.length === 1 ? 'person' : 'people'}${elevated > 0 ? ` · ${elevated} high risk` : ''}`}
            </div>
          </div>

          <div className="card">
            <div className="card-title">Connections</div>
            {rows.length === 0 && (
              <div className="empty">
                <svg width="60" height="60" viewBox="0 0 24 24" fill="none">
                  <circle cx="9" cy="8" r="3" stroke="currentColor" strokeWidth="1.4" />
                  <circle cx="17" cy="10" r="2.5" stroke="currentColor" strokeWidth="1.4" />
                  <path d="M3 20c0-3 3-5 6-5s6 2 6 5" stroke="currentColor" strokeWidth="1.4" />
                  <path d="M14 20c0-2 2-3.5 4-3.5s4 1.5 4 3.5" stroke="currentColor" strokeWidth="1.4" />
                </svg>
                <div className="title">No Care Circle yet</div>
                <div className="body">
                  Create or accept an invite from Profile to connect trusted people.
                </div>
              </div>
            )}
            {rows.map(({ conn, hist, latest }) => {
              const accepted = isAcceptedConnection(conn);
              const allowed = normalizeShareSettings(conn.share);
              const v = latest ? verdict(latest.risk) : null;
              const trend = latest && allowed.trend ? trendFor(hist) : 'Waiting';
              const recoveryLabel = latest
                ? (latest.recovery_status || latest.recoveryStatus?.label || 'Not logged')
                : 'No recovery status yet';
              const showRisk = accepted && latest && allowed.risk;
              return (
                <div key={conn.id}
                     className={`care-row ${accepted ? '' : 'paused'}`}
                     onClick={() => setSelectedId(conn.id)}
                     style={{ cursor: 'pointer' }}>
                  <Avatar name={conn.name} color={conn.color || colorFor(conn.name)} />
                  <div style={{ flex: 1 }}>
                    <div className="name">{conn.name}</div>
                    <div className="meta">
                      {conn.relationship || 'Friend'} · {accepted ? 'Accepted' : conn.status}
                      {' · '}
                      {latest && allowed.last_checkin ? `Last updated ${shortDate(latest.when)}` : 'No shared check-in yet'}
                      {' · '}
                      Trend: {trend}
                      {' · '}
                      Alert me at {Math.round((conn.alertThreshold || 0.75) * 100)}%
                      {' · '}
                      Recovery: {accepted && latest && allowed.recovery_status ? recoveryLabel : 'Private'}
                      {' В· '}
                      Notifications {conn.notificationEnabled === false ? 'off' : 'on'}
                    </div>
                  </div>
                  {v && allowed.level && <span className="mini-tag" style={{ color: v.color }}>{v.label}</span>}
                  <span className="pct" style={{ color: v ? v.color : 'var(--text-soft)' }}>
                    {showRisk ? `${(latest.risk * 100).toFixed(0)}%` : '—'}
                  </span>
                </div>
              );
            })}
            <div className="helper">
              Shared tracker view hides private answers and notes unless someone explicitly allows them.
            </div>
          </div>
        </div>
      );
    }

    /* =========================================================
       Sharing-mode UI — shared by Profile (and any other screen
       that surfaces trusted-person sharing controls).
       ========================================================= */
    function ShieldIcon() {
      return (
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6l8-3z"
                stroke="currentColor" strokeWidth="1.7"
                strokeLinejoin="round" />
          <path d="M9 12l2 2 4-4" stroke="currentColor" strokeWidth="1.7"
                strokeLinecap="round" strokeLinejoin="round" />
        </svg>
      );
    }
    function ChevDown() {
      return (
        <svg className="chev" width="14" height="14" viewBox="0 0 24 24"
             fill="none" aria-hidden="true">
          <path d="M6 9l6 6 6-6" stroke="currentColor" strokeWidth="2"
                strokeLinecap="round" strokeLinejoin="round" />
        </svg>
      );
    }
    function CheckTinyIcon() {
      return (
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M5 12l5 5 9-11" stroke="currentColor" strokeWidth="2.4"
                strokeLinecap="round" strokeLinejoin="round" />
        </svg>
      );
    }

    /** Friendly label for an advanced share permission. */
    const ADVANCED_TOGGLES = [
      { key: 'notificationEnabled', label: 'Notifications' },
      { key: 'risk',                label: 'Share risk %' },
      { key: 'trend',               label: 'Share trend' },
      { key: 'last_checkin',        label: 'Share last update' },
      { key: 'top_contributors',    label: 'Share top contributors' },
      { key: 'recovery_status',     label: 'Share recovery status' },
      { key: 'important_updates',   label: 'Share important updates' },
    ];

    /**
     * Trusted-person card with sharing-mode UI.
     * Replaces the old checkbox-heavy permissions list.
     */
    function ConnectionCard({ conn, onUpdate }) {
      const [showAdvanced, setShowAdvanced] = useState(false);
      const currentMode = conn.sharingMode || inferSharingMode(conn);
      const presetForCurrent = SHARING_MODES[currentMode];

      const pickMode = (modeId) => {
        onUpdate(conn.id, patchForMode(modeId));
      };

      // A change to any advanced toggle should mark the connection as
      // "custom" unless the resulting permissions happen to match a preset.
      const toggleAdvanced = (key, value) => {
        if (key === 'notificationEnabled') {
          const next = normalizeConnection({
            ...conn,
            notificationEnabled: value,
            sharingMode: undefined,
          });
          onUpdate(conn.id, {
            notificationEnabled: value,
            sharingMode: next.sharingMode,
          });
        } else {
          const nextShare = { ...normalizeShareSettings(conn.share), [key]: value };
          const next = normalizeConnection({
            ...conn,
            share: nextShare,
            sharingMode: undefined,
          });
          onUpdate(conn.id, {
            share: nextShare,
            sharingMode: next.sharingMode,
          });
        }
      };

      const setThreshold = (value) => {
        const next = normalizeConnection({
          ...conn,
          alertThreshold: value,
          sharingMode: undefined,
        });
        onUpdate(conn.id, {
          alertThreshold: value,
          sharingMode: next.sharingMode,
        });
      };

      const handle = conn.personId ? `@${String(conn.personId).replace(/^@/, '')}` : '';

      return (
        <div className="connection-card">
          <div className="conn-head">
            <Avatar name={conn.name} color={conn.color || colorFor(conn.name)} />
            <div style={{ flex: 1, minWidth: 0 }}>
              <div className="name">{conn.name}</div>
              {handle && <div className="handle">{handle}</div>}
            </div>
          </div>

          <div className="conn-row">
            <div className="conn-label">Relationship</div>
            <select className="text-input conn-relationship-select"
                    value={conn.relationship || 'Friend'}
                    onChange={e => onUpdate(conn.id, { relationship: e.target.value })}>
              <option>Friend</option>
              <option>Partner</option>
              <option>Family</option>
              <option>Coach</option>
            </select>
          </div>

          <div className="conn-row">
            <div className="conn-label">Sharing Mode</div>
            <div className="mode-pills" role="tablist" aria-label="Sharing mode">
              {Object.entries(SHARING_MODES).map(([id, preset]) => (
                <button key={id} type="button" role="tab"
                        aria-selected={currentMode === id}
                        className={`mode-pill ${currentMode === id ? 'active' : ''}`}
                        onClick={() => pickMode(id)}>
                  {preset.label}
                </button>
              ))}
            </div>
          </div>

          <div className="mode-summary" aria-live="polite">
            <div className="mode-title">
              <ShieldIcon />
              <span>
                {presetForCurrent ? `${presetForCurrent.label} sharing` : 'Custom sharing'}
              </span>
            </div>
            <div className="mode-desc">
              {presetForCurrent
                ? presetForCurrent.description
                : 'You have customised what this person can see.'}
            </div>
            <div className="mode-sees">{conn.name} can see:</div>
            <div className="share-pill-row">
              {(presetForCurrent ? presetForCurrent.pills : pillsFromShare(conn)).map((p, i) => (
                <span key={i} className="share-pill">
                  <CheckTinyIcon />{p}
                </span>
              ))}
            </div>
          </div>

          <button type="button"
                  className="customize-btn"
                  aria-expanded={showAdvanced}
                  onClick={() => setShowAdvanced(v => !v)}>
            <span>{showAdvanced ? 'Hide customisation' : 'Customise details'}</span>
            <ChevDown />
          </button>

          {showAdvanced && (
            <div className="customize-panel">
              {ADVANCED_TOGGLES.map(({ key, label }) => {
                const checked = key === 'notificationEnabled'
                  ? conn.notificationEnabled !== false
                  : !!normalizeShareSettings(conn.share)[key];
                return (
                  <div key={key} className="toggle-row">
                    <span className="lbl">{label}</span>
                    <label className="switch">
                      <input type="checkbox" checked={checked}
                             onChange={e => toggleAdvanced(key, e.target.checked)} />
                      <span className="slider" />
                    </label>
                  </div>
                );
              })}

              <div className="conn-row" style={{ marginTop: 4 }}>
                <div className="conn-label">Alert sensitivity</div>
                <div className="threshold-control">
                  <input type="range" min="0.45" max="0.95" step="0.01"
                         value={conn.alertThreshold || 0.75}
                         onChange={e => setThreshold(parseFloat(e.target.value))} />
                  <div className="val">{Math.round((conn.alertThreshold || 0.75) * 100)}%</div>
                </div>
                <div className="threshold-hint">
                  Trusted person is alerted when risk reaches this level.
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    /** Build pills for a "custom" sharing configuration from raw share flags. */
    function pillsFromShare(conn) {
      const s = normalizeShareSettings(conn.share);
      const out = [];
      if (s.risk)              out.push('Burnout %');
      else if (s.level)        out.push('Risk level');
      if (s.trend)             out.push('Trend');
      if (s.recovery_status)   out.push('Recovery status');
      if (s.top_contributors)  out.push('Top contributors');
      if (s.last_checkin)      out.push('Last update');
      if (s.important_updates) out.push('Important updates');
      if (!out.length)         out.push('Nothing yet');
      return out;
    }

    /* =========================================================
       TAB CONTENT — Profile / Settings

    function ProfileTab({

      onExport, onImportClick,
      onManageProfiles, onSignOut,

        window.addEventListener('wellcare-connections-changed', refresh);
        return () => window.removeEventListener('wellcare-connections-changed', refresh);

          onToast && onToast('Invite link copied to clipboard');

          setInviteInput('');

        } catch (e) { onToast && onToast('Invalid invite code'); }

      function updateConnection(id, patch) {
        setProfileConnections(prev => {
          const cs = prev.map(c => c.id === id ? normalizeConnection({ ...c, ...patch }) : c);
          saveConnections(cs);
          return cs;
        });
        onToast && onToast('Saved');
      }
      return (
        <div className="pane">
          <div className="eyebrow-pill">Account</div>
          <h1 className="display-title">Your Profile</h1>
          <div className="display-sub">
            Tune the app to match your life, study, work, and support network.
          </div>

          <div className="panel" style={{ display: 'flex', alignItems: 'center', gap: 14 }}>
            <Avatar name={activeProfile.name} color={activeProfile.color} size="lg" />
            <div style={{ flex: 1, minWidth: 0 }}>
              <div className="panel-title" style={{ fontSize: 22 }}>
                {activeProfile.name}
              </div>

                {activeProfile.email || activeProfile.personId} · {userCheckins} check-in{userCheckins === 1 ? '' : 's'}

            <button className="icon-btn solid" onClick={onSignOut}

              <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
                <path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3 M10 8l-4 4 4 4 M6 12h10"
                      stroke="currentColor" strokeWidth="1.8"
                      strokeLinecap="round" strokeLinejoin="round"/>
              </svg>
            </button>
          </div>

          <div className="panel">
            <div className="panel-head">
              <div className="panel-title">Appearance</div>
            </div>
            <div className="pref-row" style={{ paddingTop: 4 }}>
              <div>
                <div className="pref-label">Theme</div>
                <div className="pref-hint">Match your system or pick one.</div>
              </div>
              <div className="pref-control">
                <div className="seg compact">
                  {['light','system','dark'].map(t => (
                    <button key={t}
                            className={theme === t ? 'active' : ''}
                            onClick={() => setTheme(t)}>
                      {t === 'system' ? 'Auto' : t.charAt(0).toUpperCase() + t.slice(1)}
                    </button>
                  ))}
                </div>
              </div>
            </div>
          </div>

          <div className="panel">
            <div className="panel-head">
              <div className="panel-title">Reminders</div>
            </div>
            <div className="pref-row" style={{ paddingTop: 4 }}>
              <div>
                <div className="pref-label">Daily nudge</div>
                <div className="pref-hint">A browser notification on the day you pick — fires once that day until you check in.</div>
              </div>
              <div className="pref-control">
                <div className="seg compact">
                  <button className={reminderDow === '' ? 'active' : ''}
                          onClick={() => requestReminder('')}>Off</button>
                  {[1, 5, 0].map(d => (
                    <button key={d}
                            className={String(reminderDow) === String(d) ? 'active' : ''}
                            onClick={() => requestReminder(d)}>
                      {DOWS[d]}
                    </button>
                  ))}
                </div>
              </div>
            </div>
          </div>

          <div className="panel">
            <div className="panel-head">
              <div className="panel-title">Scoring engine</div>
            </div>
            <div className="action-row" style={{ cursor: 'default' }}>
              <div style={{ fontWeight: 600 }}>
                {engineSource && engineSource.mode === 'trained'
                  ? 'Trained model active'
                  : 'Built-in heuristic'}
              </div>
              <div style={{ display: 'flex', gap: 6 }}>
                <button className="icon-btn solid" onClick={onLoadBundle}
                        aria-label="Load model">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
                    <path d="M12 4v12 M6 10l6 6 6-6 M4 20h16"
                          stroke="currentColor" strokeWidth="1.8"
                          strokeLinecap="round" strokeLinejoin="round" />
                  </svg>
                </button>
                {bundle && (
                  <button className="icon-btn solid" onClick={onClearBundle}
                          aria-label="Revert">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
                      <path d="M3 12a9 9 0 1 0 3-6.7 M3 4v6h6"
                            stroke="currentColor" strokeWidth="1.8"
                            strokeLinecap="round" strokeLinejoin="round" />
                    </svg>
                  </button>
                )}
              </div>
            </div>
            <EngineSourceStrip info={engineSource} compact />
          </div>

          <div className="panel">
            <div className="panel-head">
              <div className="panel-title">Care Circle</div>
            </div>
            <div style={{ paddingTop: 8, display: 'grid', gap: 14 }}>
              {/* Invite block — Create is its own prominent action,
                  Paste + Accept live below a divider so it's clear they
                  belong to a different flow. */}
              <div className="care-invite-block">
                <button className="care-create-btn" onClick={handleCreateInvite}>
                  <svg viewBox="0 0 24 24" fill="none">
                    <path d="M12 5v14M5 12h14"
                          stroke="currentColor" strokeWidth="2.2"
                          strokeLinecap="round" />
                  </svg>
                  <span>Create invite link</span>
                </button>
                <div className="care-create-hint">
                  Generates a private link you can share with a trusted person.
                </div>

                <div className="care-invite-divider">Have an invite?</div>

                <div className="care-invite-accept-row">
                  <input className="text-input care-invite-input"
                         placeholder="Paste invite link or code"
                         value={inviteInput}
                         onChange={e => setInviteInput(e.target.value)} />
                  <button className="cta care-accept-btn"
                          onClick={handleAcceptInvite}>Accept</button>
                </div>
              </div>

              <div>
                <div style={{ fontWeight: 700, marginBottom: 6 }}>Your connections</div>
                <div className="conn-privacy-note" style={{ marginBottom: 10 }}>
                  You control what each person can see. You can change or
                  remove access anytime.
                </div>
                {profileConnections.length === 0 && (
                  <div style={{ color: 'var(--text-soft)' }}>
                    No connections yet — create or accept an invite.
                  </div>
                )}
                {profileConnections.map(c => (
                  <ConnectionCard key={c.id} conn={c} onUpdate={updateConnection} />
                ))}
              </div>
            </div>
          </div>

          <div className="panel">
            <div className="panel-head">
              <div className="panel-title">Data</div>
            </div>
            <EngineSourceStrip info={DATA_FILES_HELP} compact />
            <button className="action-row" onClick={onExport}
                    disabled={history.length === 0}>
              <span>Export check-ins (CSV)</span>
              <svg className="chev" width="18" height="18" viewBox="0 0 24 24" fill="none">
                <path d="M12 4v12 M6 10l6 6 6-6 M4 20h16"
                      stroke="currentColor" strokeWidth="1.8"
                      strokeLinecap="round" strokeLinejoin="round"/>
              </svg>
            </button>
            <button className="action-row" onClick={onImportClick}>
              <span>Import CSV</span>
              <svg className="chev" width="18" height="18" viewBox="0 0 24 24" fill="none">
                <path d="M12 20V8 M6 14l6-6 6 6 M4 4h16"
                      stroke="currentColor" strokeWidth="1.8"
                      strokeLinecap="round" strokeLinejoin="round"/>
              </svg>
            </button>
          </div>

          <div className="panel">
            <div className="panel-head">
              <div className="panel-title">Profiles</div>
            </div>
            <button className="action-row" onClick={onManageProfiles}>
              <span>
                Manage profiles
                <span style={{ color: 'var(--text-soft)', fontWeight: 400, marginLeft: 6 }}>
                  · {profiles.length}
                </span>
              </span>
              <svg className="chev" width="18" height="18" viewBox="0 0 24 24" fill="none">
                <path d="M9 6l6 6-6 6" stroke="currentColor" strokeWidth="2"
                      strokeLinecap="round" strokeLinejoin="round"/>
              </svg>
            </button>
          </div>

          <div style={{ display: 'grid', gap: 10, marginTop: 8 }}>
            <button className="cta secondary" onClick={onSignOut}>
              Sign out
            </button>
            <button className="danger-btn"
                    onClick={onClearAll}
                    disabled={history.length === 0}>
              Delete all check-ins
            </button>
          </div>

          <div className="helper" style={{ textAlign: 'center', marginTop: 16 }}>
            WellCare is not a diagnostic tool. It tracks self-reported patterns
            related to stress, emotional overload, and burnout risk. Risk is
            computed locally in this prototype.
          </div>
        </div>
      );
    }

    /* =========================================================
       APP — top-level state machine
       ========================================================= */
    const TABS = [
      { id: 'home',    label: 'Home' },
      { id: 'care',    label: 'Care Circle' },
      { id: 'tracker', label: 'Tracker' },
      { id: 'profile', label: 'Profile' },
    ];

    /** Tab bar order — used for subtle slide direction on change */
    const MAIN_TAB_ORDER = ['home', 'care', 'tracker', 'profile'];
    const SUPPORTS_VIEW_TRANSITION =
      typeof document !== 'undefined'
      && typeof document.startViewTransition === 'function';

    /** Horizontal swipe distance (px) to move between main tabs */
    const SWIPE_TAB_MIN_PX = 64;
    const SWIPE_TAB_MAX_MS = 720;

    function App() {
      // Profiles + sign-in
      const [profiles, setProfiles]       = useState(() => loadProfiles());
      const [activeId, setActiveId]       = useState(() => loadStr(ACTIVE_KEY, ''));
      const activeProfile = useMemo(
        () => profiles.find(p => p.id === activeId) || null,
        [profiles, activeId]
      );

      // History + bundle + prefs
      const [history, setHistory]         = useState(loadHistory());
      const [bundle,  setBundle]          = useState(loadBundle());
      const [bundleSourceMeta, setBundleSourceMeta] = useState(() =>
        loadBundleSourceMeta());
      const engineSource = useMemo(
        () => bundleSourceDisplay(bundle, bundleSourceMeta),
        [bundle, bundleSourceMeta]
      );
      const [theme,   setTheme]           = useState(loadStr(THEME_KEY, 'system'));
      const [reminderDow, setReminderDow] = useState(loadStr(REMIND_KEY, ''));

      // UI
      const [tab, setTab]                 = useState('home');
      const [tabSlideDir, setTabSlideDir]   = useState(0);
      const [showWizard, setShowWizard]   = useState(false);
      const [result, setResult]           = useState(null);
      const [toast, setToast]             = useState(null);
      const [showNotifPanel, setShowNotifPanel] = useState(false);
      const [notifications, setNotifications] = useState(() => loadNotifications());
      const [pendingInviteToken, setPendingInviteToken] = useState(() => readPendingInviteFromLocation());
      const [showProfileMgr, setShowProfileMgr] = useState(false);

      // Daily tracker — keyed by the active profile + today's date.
      const personId = activeProfile ? activeProfile.personId : '';
      const [trackerToday, setTrackerTodayState] = useState(
        () => personId ? getTrackerToday(personId) : {});
      useEffect(() => {
        if (personId) setTrackerTodayState(getTrackerToday(personId));
      }, [personId]);
      const setTrackerValue = (fieldId, value) => {
        setTrackerTodayState(prev => {
          const next = { ...prev };
          if (value == null) delete next[fieldId];
          else next[fieldId] = value;
          if (personId) setTrackerToday(personId, next);
          return next;
        });
      };

      const fileRef       = useRef(null);
      const bundleFileRef = useRef(null);
      const shellMainRef  = useRef(null);

      const goTab = useCallback((next) => {
        if (next === tab) return;
        const pi = MAIN_TAB_ORDER.indexOf(tab);
        const ni = MAIN_TAB_ORDER.indexOf(next);
        const dir = pi >= 0 && ni >= 0 && ni !== pi ? (ni > pi ? 1 : -1) : 0;
        const reduceMotion =
          typeof window.matchMedia === 'function'
          && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        const run = () => {
          ReactDOM.flushSync(() => {
            setTabSlideDir(dir);
            setTab(next);
          });
          requestAnimationFrame(() => {
            shellMainRef.current?.scrollTo(0, 0);
          });
        };

        if (SUPPORTS_VIEW_TRANSITION && !reduceMotion) {
          document.startViewTransition(run);
        } else {
          run();
        }
      }, [tab]);

      useEffect(() => {
        if (!activeProfile) return;
        const el = shellMainRef.current;
        if (!el) return;

        const ignoredStart = (target) => {
          if (!target || typeof target.closest !== 'function') return true;
          return !!target.closest(
            '.trend-chart-wrap, input, textarea, select, option'
          );
        };

        let activePid = null;
        let sx = 0;
        let sy = 0;
        let st = 0;

        let onWinUp = null;
        let onWinCancel = null;

        const cleanupWin = () => {
          if (onWinUp) {
            window.removeEventListener('pointerup', onWinUp);
            window.removeEventListener('pointercancel', onWinCancel);
            onWinUp = null;
            onWinCancel = null;
          }
        };

        const finishSwipe = (e) => {
          if (!e.isPrimary || e.pointerId !== activePid) return;
          activePid = null;
          cleanupWin();

          if (showWizard || result || showProfileMgr) return;
          const dt = Date.now() - st;
          const dx = e.clientX - sx;
          const dy = e.clientY - sy;
          if (dt > SWIPE_TAB_MAX_MS) return;
          if (Math.abs(dx) < SWIPE_TAB_MIN_PX) return;
          if (Math.abs(dy) > Math.abs(dx) * 0.65) return;

          const order = MAIN_TAB_ORDER;
          const i = order.indexOf(tab);
          if (i < 0) return;
          if (dx < 0) {
            if (i < order.length - 1) goTab(order[i + 1]);
          } else if (i > 0) {
            goTab(order[i - 1]);
          }
        };

        const onDown = (e) => {
          if (!e.isPrimary) return;
          if (activePid != null) return;
          if (e.pointerType === 'mouse' && e.button !== 0) return;
          if (ignoredStart(e.target)) return;

          activePid = e.pointerId;
          sx = e.clientX;
          sy = e.clientY;
          st = Date.now();

          onWinUp = (ev) => finishSwipe(ev);
          onWinCancel = (ev) => {
            if (ev.pointerId !== activePid) return;
            activePid = null;
            cleanupWin();
          };
          window.addEventListener('pointerup', onWinUp, { passive: true });
          window.addEventListener('pointercancel', onWinCancel, { passive: true });
        };

        el.addEventListener('pointerdown', onDown, { passive: true });

        return () => {
          el.removeEventListener('pointerdown', onDown);
          cleanupWin();
          activePid = null;
        };
      }, [activeProfile, tab, goTab, showWizard, result, showProfileMgr]);

      // Persistence
      useEffect(() => saveHistory(history), [history]);
      useEffect(() => { applyTheme(theme); saveStr(THEME_KEY, theme); }, [theme]);
      useEffect(() => saveStr(REMIND_KEY, reminderDow), [reminderDow]);
      useEffect(() => saveStr(ACTIVE_KEY, activeId), [activeId]);
      useEffect(() => saveJson(PROFILES_KEY, profiles), [profiles]);

      useEffect(() => {
        if (theme !== 'system') return;
        const mq = window.matchMedia('(prefers-color-scheme: dark)');
        const fn = () => applyTheme('system');
        mq.addEventListener('change', fn);
        return () => mq.removeEventListener('change', fn);
      }, [theme]);

      useEffect(() => {
        if (!toast) return;
        const t = setTimeout(() => setToast(null), 2400);
        return () => clearTimeout(t);
      }, [toast]);

      useEffect(() => {
        const refresh = () => setNotifications(loadNotifications());
        window.addEventListener('wellcare-notifications-changed', refresh);
        return () => window.removeEventListener('wellcare-notifications-changed', refresh);
      }, []);

      useEffect(() => {
        if (!activeProfile || !pendingInviteToken) return;
        let cancelled = false;
        acceptInviteToken(pendingInviteToken, activeProfile)
          .then(rec => {
            if (cancelled) return;
            clearPendingInvite();
            setPendingInviteToken('');
            setNotifications(loadNotifications());
            setToast(`${rec.name} added to Care Circle`);
            goTab('care');
          })
          .catch(() => {
            if (cancelled) return;
            clearPendingInvite();
            setPendingInviteToken('');
            setToast('Invite link was invalid or expired');
          });
        return () => { cancelled = true; };
      }, [activeProfile?.id, pendingInviteToken, goTab]);

      useEffect(() => {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.register('sw.js').then(reg => {
            // Check for an updated SW every time the page loads, and
            // when a new one is waiting, reload once so the user
            // immediately gets the latest copy instead of a stale one.
            reg.update?.();
            reg.addEventListener?.('updatefound', () => {
              const nw = reg.installing;
              if (!nw) return;
              nw.addEventListener('statechange', () => {
                if (nw.state === 'installed'
                    && navigator.serviceWorker.controller) {
                  if (!sessionStorage.getItem('sw-reloaded')) {
                    sessionStorage.setItem('sw-reloaded', '1');
                    nw.postMessage?.({ type: 'SKIP_WAITING' });
                    location.reload();
                  }
                }
              });
            });
          }).catch(() => {});
        }
      }, []);

      useEffect(() => {
        if (!activeProfile) return;
        maybeRemind(history, reminderDow, activeProfile.personId);
      }, [activeProfile?.id]);

      // Validate active profile, fall back if needed
      useEffect(() => {
        if (activeId && !profiles.find(p => p.id === activeId)) {
          setActiveId('');
        }
      }, [profiles, activeId]);

      // Scoring function used when backfilling risk on imported CSV rows.
      // Translates chip keys -> model events on the way in.
      const scoreFn = useMemo(() => {
        return (s, ev, feeling = 'managing', histSlice = []) => {
          const chipSet = ev instanceof Set ? ev : new Set(ev || []);
          const hybrid = calculateBurnoutRisk(s, histSlice, {
            feeling,
            events: [...chipSet],
          });
          let prob = hybrid.scoreProb;
          if (bundle && bundle.feature_cols && bundle.logreg && bundle.gbt) {
            const modelEv = eventsForModel(chipSet);
            const out = realModelScore(bundle, s, modelEv, histSlice);
            prob = Math.max(out.ensemble_mean, prob);
          }
          return prob;
        };
      }, [bundle]);

      // Person-filtered slices
      const personHist = useMemo(() => {
        if (!activeProfile) return [];
        return history.filter(e =>
          (e.person_id || 'me') === activeProfile.personId);
      }, [history, activeProfile]);

      const stats = useMemo(() => {
        const recent4 = personHist.slice(0, 4);
        return {
          weeks:   uniqueWeekKeys(personHist).length,
          streak:  computeStreak(personHist),
          latest:  personHist[0],
          avgRisk: recent4.length === 0 ? null
                   : recent4.reduce((s, e) => s + e.risk, 0) / recent4.length,
        };
      }, [personHist]);

      const insights = useMemo(
        () => buildInsights(personHist, personHist[0]),
        [personHist]
      );

      // -------- Actions --------
      const startCheckin = () => {
        setShowWizard(true);
      };

      // Always start the wizard from the neutral middle so the user
      // actively answers each question. Pre-filling from last week
      // would put the sliders "randomly around the chart".
      const wizardInitialSignals = useMemo(() => ({ ...DEFAULTS }), []);
      const wizardInitialFeeling = 'managing';

      const handleSave = ({ signals, feeling, events, notes }) => {
        const eventSet = new Set(events);
        const modelSignals = signalsForModel(signals);
        const modelEventSet = eventsForModel(eventSet);
        const historyForModel = personHist.slice(0, 60).map(h => ({
          signals: h.signals,
          events:  [...eventsForModel(new Set(h.events || []))],
        }));
        const historyForHybrid = personHist.slice(0, 28);

        const trackerToday = getTrackerToday(activeProfile.personId);
        const recStatus = recoveryStatus(trackerToday);
        const hybrid = calculateBurnoutRisk(modelSignals, historyForHybrid, {
          feeling,
          events: [...eventSet],
          trackerToday,
        });

        let scoreOutput = null;
        let risk = hybrid.scoreProb;

        const driverReasons = hybrid.topReasons.map((label, i) => ({
          key: 'reason-' + i,
          kind: 'reason',
          label,
          c: 0,
        }));
        let drivers = driverReasons;

        if (bundle && bundle.feature_cols && bundle.logreg && bundle.gbt) {
          scoreOutput = realModelScore(bundle, modelSignals, modelEventSet, historyForModel);
          risk = Math.max(risk, scoreOutput.ensemble_mean);
          const md = realModelDrivers(bundle, scoreOutput).map(d => ({
            ...d, kind: 'model',
          }));
          drivers = [...driverReasons, ...md];
        }

        const v = verdict(risk);
        const entry = {
          id: Date.now(),
          when: new Date().toISOString(),
          person_id: activeProfile.personId,
          signals: { ...signals },
          events: [...eventSet],
          feeling, notes,
          tracker: { ...trackerToday },
          recoveryStatus: recStatus,
          risk, verdict: v.label,
        };
        syncSharedCheckin(activeProfile, entry);
        notifyCareCircleForEntry(entry, history, activeProfile);
        setNotifications(loadNotifications());
        setHistory(h => [entry, ...h].slice(0, 1000));
        setResult({
          entry, v, drivers,
          hybridExplain: hybrid.explain,
          hybridAction: hybrid.recommendedAction,
          safetyNetSuggested: hybrid.safetyNetSuggested,
          modelLabel: scoreOutput
            ? 'Trained model blended with safety-aware check'
            : 'Safety-aware score',
        });
        setShowWizard(false);
      };

      const handleDismissResult = () => {
        setResult(null);
        goTab('home');
      };

      const clearAll = () => {
        if (confirm('Delete all check-ins for every profile? This cannot be undone.')) {
          setHistory([]);
          setToast('All check-ins deleted');
        }
      };

      const handleExport = () => {
        const csv = exportCsv(history);
        const blob = new Blob([csv], { type: 'text/csv' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `checkins-${new Date().toISOString().slice(0, 10)}.csv`;
        a.click();
        URL.revokeObjectURL(a.href);
        setToast(`Exported ${history.length} check-in${history.length === 1 ? '' : 's'}`);
      };

      const handleImportClick = () => fileRef.current?.click();
      const handleFileChange = (e) => {
        const f = e.target.files?.[0];
        if (!f) return;
        const reader = new FileReader();
        reader.onload = () => {
          try {
            const r = importCsv(reader.result, history, scoreFn);
            setHistory(r.history);
            setToast(`Imported ${r.added} new` + (r.skipped ? `, skipped ${r.skipped}` : ''));
          } catch {
            setToast('Could not parse that CSV');
          }
        };
        reader.readAsText(f);
        e.target.value = '';
      };

      const handleBundleClick = () => bundleFileRef.current?.click();
      const handleBundleChange = (e) => {
        const f = e.target.files?.[0];
        if (!f) return;
        const reader = new FileReader();
        reader.onload = () => {
          try {
            let raw = reader.result.trim();
            if (raw.startsWith('window.MODEL_BUNDLE')) {
              raw = raw.replace(/^[^=]*=\s*/, '').replace(/;\s*$/, '');
            } else if (!raw.startsWith('{')) {
              try { raw = atob(raw.replace(/\s+/g, '')); } catch {}
            }
            const parsed = JSON.parse(raw);
            if (!parsed.feature_cols || !parsed.logreg || !parsed.gbt) {
              throw new Error('Missing keys');
            }
            saveBundle(parsed);
            saveBundleSourceMeta({ kind: 'file', filename: f.name });
            setBundleSourceMeta({ kind: 'file', filename: f.name });
            setBundle(parsed);
            setToast('Trained model loaded');
          } catch {
            setToast('Could not load that file as a model bundle');
          }
        };
        reader.readAsText(f);
        e.target.value = '';
      };

      const clearBundle = () => {
        saveBundle(null);
        saveBundleSourceMeta(null);
        setBundleSourceMeta(null);
        setBundle(null);
        setToast('Reverted to heuristic scoring');
      };

      const requestReminder = async (dow) => {
        if (dow === '') {
          setReminderDow('');
          setToast('Reminders off');
          return;
        }
        if (!('Notification' in window)) {
          setToast('Notifications not supported in this browser');
          return;
        }
        const perm = await Notification.requestPermission();
        if (perm === 'granted') {
          setReminderDow(String(dow));
          setToast(`I'll remind you on ${DOWS[dow]}s`);
        } else {
          setToast('Reminder permission denied');
        }
      };

      // ---- Profile management actions ----
      const onSignIn = (pid) => { setActiveId(pid); setTab('home'); };
      const onSignOut = () => { setActiveId(''); setShowProfileMgr(false); };

      // Wipe everything for a clean test run.
      const wipeEverything = () => {
        try {
          [STORAGE_KEY, STORAGE_KEY_V1, THEME_KEY, REMIND_KEY,
           BUNDLE_KEY, BUNDLE_SOURCE_META_KEY, PROFILES_KEY, ACTIVE_KEY, TRACKER_KEY,
           CONNECTIONS_KEY, NOTIFS_KEY, ALERT_EVENTS_KEY, LEGACY_PERSON]
            .forEach(k => localStorage.removeItem(k));
          sessionStorage.clear();
        } catch {}
        window.location.reload();
      };
      const onCreateProfile = (profile) => {
        setProfiles(ps => [...ps, profile]);
        setActiveId(profile.id);
        setTab('home');
      };
      const onRenameProfile = (id, name) => {
        setProfiles(ps => ps.map(p => p.id === id
          ? { ...p, name,
              personId: p.personId /* keep CSV identity stable */ }
          : p));
      };
      const onSetPin = (id, passwordHash, salt) => {
        setProfiles(ps => ps.map(p => p.id === id
          ? { ...p, passwordHash, salt }
          : p));
        setToast(passwordHash ? 'Password updated' : 'Password removed');
      };
      const onDeleteProfile = (id) => {
        setProfiles(ps => ps.filter(p => p.id !== id));
        if (id === activeId) setActiveId('');
      };
      // ============ LOGIN ============
      if (!activeProfile) {
        return (
          <>
            <LoginScreen
              profiles={profiles}
              onSignIn={onSignIn}
              onCreateProfile={onCreateProfile}
              onWipe={wipeEverything}
              onTransientToast={setToast}
            />
            {toast && <div className="toast">{toast}</div>}
          </>
        );
      }

      // ============ AUTHENTICATED SHELL ============
      const tabIcons = {
        home: (active) => (
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M3 11l9-7 9 7v9a2 2 0 0 1-2 2h-4v-6h-6v6H5a2 2 0 0 1-2-2v-9z"
                  stroke="currentColor" strokeWidth={active ? 2 : 1.8}
                  strokeLinejoin="round"
                  fill={active ? 'currentColor' : 'none'}
                  fillOpacity={active ? 0.12 : 0} />
          </svg>
        ),
        insights: (active) => (
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M3 20h18 M6 16l4-6 4 4 5-9"
                  stroke="currentColor" strokeWidth={active ? 2.2 : 1.8}
                  strokeLinecap="round" strokeLinejoin="round" />
          </svg>
        ),
        tracker: (active) => (
          <svg viewBox="0 0 24 24" fill="none">
            <rect x="4" y="4" width="7" height="7" rx="1.5"
                  stroke="currentColor" strokeWidth={active ? 2 : 1.8}
                  fill={active ? 'currentColor' : 'none'}
                  fillOpacity={active ? 0.12 : 0} />
            <rect x="13" y="4" width="7" height="7" rx="1.5"
                  stroke="currentColor" strokeWidth={active ? 2 : 1.8}
                  fill={active ? 'currentColor' : 'none'}
                  fillOpacity={active ? 0.12 : 0} />
            <rect x="4" y="13" width="7" height="7" rx="1.5"
                  stroke="currentColor" strokeWidth={active ? 2 : 1.8}
                  fill={active ? 'currentColor' : 'none'}
                  fillOpacity={active ? 0.12 : 0} />
            <rect x="13" y="13" width="7" height="7" rx="1.5"
                  stroke="currentColor" strokeWidth={active ? 2 : 1.8}
                  fill={active ? 'currentColor' : 'none'}
                  fillOpacity={active ? 0.12 : 0} />
          </svg>
        ),
        profile: (active) => (
          <svg viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="8" r="4"
                    stroke="currentColor" strokeWidth={active ? 2 : 1.8}
                    fill={active ? 'currentColor' : 'none'}
                    fillOpacity={active ? 0.12 : 0} />
            <path d="M4 21c0-4 4-6 8-6s8 2 8 6"
                  stroke="currentColor" strokeWidth={active ? 2 : 1.8}
                  strokeLinecap="round" />
          </svg>
        ),
      };

      const tabPaneClass =
        'tab-page vt-root'
        + (SUPPORTS_VIEW_TRANSITION
            ? ''
            : ` tab-fallback tab-dir-${
                tabSlideDir > 0 ? 'fwd' : tabSlideDir < 0 ? 'back' : 'neutral'
              }`);

      // Header is intentionally minimal in the new design — the screen
      // content carries its own eyebrow + display title.
      const headerTitle = '';
      const headerSub = '';

      return (
        <>
          <input ref={fileRef} type="file" accept=".csv,text/csv"
                 style={{ display: 'none' }}
                 onChange={handleFileChange} />
          <input ref={bundleFileRef} type="file"
                 accept=".json,.js,.b64,.txt,application/json,text/javascript,text/plain"
                 style={{ display: 'none' }}
                 onChange={handleBundleChange} />

          <div className="shell">
            <div className="app-header">
              <div />
              <div className="app-header-right">
                <div style={{ position: 'relative' }}>
                  <button className="notif-btn" aria-label="Notifications"
                          onClick={() => setShowNotifPanel(s => !s)}>
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
                      <path d="M15 17h5l-1.405-1.405A2.032 2.032 0 0 1 18.6 14.6V11a6 6 0 1 0-12 0v3.6c0 .538-.214 1.055-.595 1.595L4 17h5"
                            stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round" />
                    </svg>
                    {notifications.length > 0 && (
                      <span className="notif-badge">{notifications.length}</span>
                    )}
                  </button>
                  {showNotifPanel && (
                    <div className="notif-panel">
                      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 8 }}>
                        <div style={{ fontWeight: 700 }}>Notifications</div>
                        <button className="icon-btn" onClick={() => { saveNotifications([]); setNotifications([]); setShowNotifPanel(false); }}>Clear</button>
                      </div>
                      {notifications.length === 0 && (
                        <div style={{ color: 'var(--text-soft)' }}>No notifications</div>
                      )}
                      {notifications.map(n => (
                        <div key={n.id} style={{ padding: 8, borderBottom: '1px solid var(--border)', display: 'flex', justifyContent: 'space-between', gap: 8 }}>
                          <div style={{ fontSize: 13 }}>
                            <div>{n.text}</div>
                            {n.ts && (
                              <div style={{ color: 'var(--text-soft)', fontSize: 11, marginTop: 2 }}>
                                {shortDate(new Date(n.ts).toISOString())}
                              </div>
                            )}
                          </div>
                          <div style={{ display: 'flex', gap: 6 }}>
                            <button className="icon-btn" onClick={() => { dismissNotification(n.id); }} title="Dismiss">×</button>
                          </div>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
                {tab !== 'profile' && (
                  <button className="icon-btn" aria-label="Profile"
                          onClick={() => goTab('profile')}>
                    <Avatar name={activeProfile.name}
                            color={activeProfile.color} size="sm" />
                  </button>
                )}
              </div>
            </div>

            <div className="app-main" ref={shellMainRef}>
              <div className={tabPaneClass} key={tab}>
              {tab === 'home' && (
                <HomeTab
                  activeProfile={activeProfile}
                  personHist={personHist}
                  stats={stats}
                  insights={insights}
                  onStartCheckin={startCheckin}
                  onGoTracker={() => goTab('tracker')}
                  onToast={setToast}
                />
              )}
              {tab === 'care' && (
                <CareCircleTab
                  profiles={profiles}
                  history={history}
                  activeProfile={activeProfile}
                />
              )}
              {tab === 'tracker' && (
                <TrackerTab
                  activeProfile={activeProfile}
                  trackerToday={trackerToday}
                  setTrackerValue={setTrackerValue}
                />
              )}
              {tab === 'profile' && (
                <ProfileTab
                  activeProfile={activeProfile}
                  profiles={profiles}
                  history={history}
                  theme={theme} setTheme={setTheme}
                  reminderDow={reminderDow}
                  requestReminder={requestReminder}
                  bundle={bundle}
                  engineSource={engineSource}
                  onLoadBundle={handleBundleClick}
                  onClearBundle={clearBundle}
                  onExport={handleExport}
                  onImportClick={handleImportClick}
                  onManageProfiles={() => setShowProfileMgr(true)}
                  onSignOut={onSignOut}
                  onClearAll={clearAll}
                  onToast={setToast}
                />
              )}
              </div>
            </div>
          </div>

          <div className="tabbar-dock">
            <nav className="tabbar" aria-label="Primary navigation">
              <button type="button"
                      className={`tab ${tab === 'home' ? 'active' : ''}`}
                      onClick={() => goTab('home')}>
                {tabIcons.home(tab === 'home')}
                <span>Home</span>
              </button>
              <button type="button"
                      className={`tab ${tab === 'care' ? 'active' : ''}`}
                      onClick={() => goTab('care')}>
                {/* simple people icon */}
                <svg viewBox="0 0 24 24" fill="none">
                  <circle cx="8" cy="8" r="3" stroke="currentColor" strokeWidth="1.6" />
                  <circle cx="17" cy="10" r="2.4" stroke="currentColor" strokeWidth="1.4" />
                  <path d="M3 20c0-3 3-5 6-5s6 2 6 5" stroke="currentColor" strokeWidth="1.4" fill="none" />
                </svg>
                <span>Care Circle</span>
              </button>
              <button type="button"
                      className="tab has-fab"
                      onClick={startCheckin}
                      aria-label="New check-in">
                <span className="fab">
                  <svg viewBox="0 0 24 24" fill="none">
                    <path d="M12 5v14M5 12h14"
                          stroke="currentColor" strokeWidth="2.5"
                          strokeLinecap="round" />
                  </svg>
                </span>
                <span>Check in</span>
              </button>
              <button type="button"
                      className={`tab ${tab === 'tracker' ? 'active' : ''}`}
                      onClick={() => goTab('tracker')}>
                {tabIcons.tracker(tab === 'tracker')}
                <span>Tracker</span>
              </button>
              <button type="button"
                      className={`tab ${tab === 'profile' ? 'active' : ''}`}
                      onClick={() => goTab('profile')}>
                {tabIcons.profile(tab === 'profile')}
                <span>Profile</span>
              </button>
            </nav>
          </div>

          {showWizard && (
            <CheckinWizard
              initialSignals={wizardInitialSignals}
              initialFeeling={wizardInitialFeeling}
              onCancel={() => setShowWizard(false)}
              onComplete={handleSave}
            />
          )}

          {result && (
            <ResultScreen result={result} engineSource={engineSource}
                          onDismiss={handleDismissResult} />
          )}

          {showProfileMgr && (
            <ProfileManager
              profiles={profiles}
              activeId={activeId}
              onClose={() => setShowProfileMgr(false)}
              onRename={onRenameProfile}
              onSetPin={onSetPin}
              onDeleteProfile={onDeleteProfile}
              onAddProfile={() => {
                setShowProfileMgr(false);
                setActiveId('');
              }}
            />
          )}

          {toast && <div className="toast">{toast}</div>}
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
