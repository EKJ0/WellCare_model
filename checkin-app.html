      color: var(--text);
      letter-spacing: -0.2px;
      margin-bottom: 2px;
    }
    .sn-invite-sub {
      font-size: 12.5px;
      color: var(--text-muted);
    }

    .sn-method-toggle {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      padding: 4px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 14px;
      margin-bottom: 14px;
    }
    .sn-method-btn {
      display: flex; align-items: center; justify-content: center; gap: 7px;
      padding: 9px 10px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 600;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.18s, color 0.18s, box-shadow 0.18s;
    }
    .sn-method-btn svg { width: 15px; height: 15px; }
    .sn-method-btn:hover { color: var(--text); }
    .sn-method-btn.is-active {
      background: var(--surface);
      color: var(--primary);
      box-shadow: var(--shadow-sm);
      border-color: var(--border);
    }

    .sn-field-group { margin-bottom: 12px; }
    .sn-field-label {
      display: block;
      font-size: 10.5px;
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 5px;
    }
    .sn-optional {
      font-weight: 500;
      color: var(--text-soft);
      text-transform: none;
      letter-spacing: 0;
    }

    .sn-input {
      width: 100%;
      padding: 11px 13px;
      font-size: 14px;
      font-family: var(--sans-font);
      color: var(--text);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 11px;
      outline: none;
      transition: border-color 0.18s, box-shadow 0.18s;
      -webkit-appearance: none;
      appearance: none;
    }
    .sn-input::placeholder { color: var(--text-soft); }
    .sn-input:focus {
      border-color: var(--primary-tint);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 18%, transparent);
    }
    .sn-select {
      background-image:
        linear-gradient(45deg, transparent 50%, var(--text-soft) 50%),
        linear-gradient(135deg, var(--text-soft) 50%, transparent 50%);
      background-position: calc(100% - 16px) 50%, calc(100% - 11px) 50%;
      background-size: 5px 5px, 5px 5px;
      background-repeat: no-repeat;
      padding-right: 30px;
    }

    .sn-row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 14px;
    }
    .sn-row-2 .sn-field-group { margin-bottom: 0; }

    .sn-thresh-chips {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 5px;
    }
    .sn-chip {
      padding: 9px 0;
      font-size: 12.5px;
      font-weight: 600;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text-muted);
      cursor: pointer;
      transition: border-color 0.18s, background 0.18s, color 0.18s;
    }
    .sn-chip:hover { border-color: var(--primary-tint); }
    .sn-chip.is-active {
      background: var(--primary-soft);
      color: var(--primary);
      border-color: var(--primary-tint);
    }

    .sn-cta:disabled {
      filter: grayscale(0.35);
      opacity: 0.55;
      cursor: not-allowed;
      box-shadow: none;
    }
    .sn-cta:disabled:hover { filter: grayscale(0.35); }

    .sn-invite-hint {
      text-align: center;
      font-size: 11.5px;
      color: var(--text-soft);
      margin-top: 8px;
    }

    /* ----- Saved contact row extras ----- */
    .sn-channel {
      color: var(--text-muted);
      word-break: break-all;
    }
    .sn-actions-row {
      display: flex; gap: 8px;
      margin-top: 8px;
    }
    .sn-mini-btn {
      font-size: 11.5px;
      font-weight: 600;
      padding: 5px 10px;
      border-radius: 8px;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      cursor: pointer;
      transition: border-color 0.18s, color 0.18s, background 0.18s;
    }
    .sn-mini-btn:hover {
      border-color: var(--primary-tint);
      color: var(--primary);
    }
    .sn-mini-btn.primary {
      background: var(--primary-soft);
      border-color: var(--primary-tint);
      color: var(--primary);
    }
    .sn-mini-btn.primary:hover {
      background: color-mix(in srgb, var(--primary) 18%, var(--primary-soft));
    }
    .sn-mini-btn.danger:hover {
      border-color: color-mix(in srgb, var(--risk-high) 40%, var(--border));
      color: var(--risk-high);
    }

    @media (max-width: 420px) {
      .sn-details-grid { grid-template-columns: 1fr; }
      .safety-net-panel { padding: 22px 18px 18px; }
      .sn-title { font-size: 22px; }
      .sn-row-2 { grid-template-columns: 1fr; }
    }

    /* Burnout-risk ring donut */
    .ring-card {
      text-align: center;
      padding: 22px 18px 26px;
    }
    .ring-card .panel-head {
      justify-content: center;
      text-align: center;
      margin-bottom: 18px;
    }
    .ring-card .panel-head > div {
      max-width: 22rem;
      margin: 0 auto;
    }
    .ring-card .panel-title {
      letter-spacing: 0.04em;
      word-spacing: 0.06em;
      line-height: 1.28;
    }
    .ring-card .panel-sub {
      margin-top: 10px;
      line-height: 1.6;
      letter-spacing: 0.02em;
      word-spacing: 0.03em;
    }
    .ring-card .ring-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 16px 0 18px;
    }
    .ring-svg { display: block; overflow: visible; }
    .ring-track  { stroke: var(--surface-2); }
    .ring-fill   { stroke: var(--risk-elev); transition: stroke-dashoffset 0.4s; }
    .ring-pct {
      font-family: var(--display-font);
      font-size: 46px;
      font-weight: 700;
      letter-spacing: 0.05em;
      font-variant-numeric: tabular-nums;
    }
    /* Same voice as .ring-pct — display serif, sized/stepped down */
    .ring-label {
      font-family: var(--display-font);
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.1em;
      word-spacing: 0.14em;
      text-transform: none;
      line-height: 1.5;
    }
    /* Supporting context stays sans — readable small type */
    .ring-foot {
      font-family: var(--sans-font);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      margin-top: 14px;
      padding-top: 6px;
      line-height: 1.55;
      letter-spacing: 0.03em;
      word-spacing: 0.04em;
    }
    .ring-foot .compare {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: var(--text-soft);
    }
    .ring-foot .compare::before {
      content: '—'; color: var(--border-strong); font-weight: 600;
    }
    .ring-foot .delta { font-weight: 600; }
    .ring-foot .delta.up   { color: var(--risk-high); }
    .ring-foot .delta.down { color: var(--risk-low); }
    .ring-foot .delta.flat { color: var(--text-soft); }

    /* Burnout Risk Over Time card */
    .trend-card .head-row {
      display: flex; align-items: baseline; justify-content: space-between;
      margin-bottom: 4px;
    }
    .trend-card .head-row .h {
      font-family: var(--display-font);

<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef, useCallback } = React;

    /* =========================================================
       MODEL — trained bundle + safety-aware hybrid layer
       A blended probability feeds UI verdict bands:
       Low / Moderate / High / Critical (0–100%).
       ========================================================= */
    /* The model is now trained on daily check-ins, so the signals the
       user types go straight to the scorer with no scale change.
       Older bundles that were trained on weekly hours can still be
       loaded — see legacyHoursScale() below. */
    function signalsForModel(s) { return s; }

    /* CSV rescoring shim — defaults missing meta (feeling, tracker chips).
       Live wizard flows always call calculateBurnoutRisk(...) directly. */
    function heuristicRisk(s, events) {
      const evArr = events instanceof Set ? [...events] : [...(events || [])];
      const r = calculateBurnoutRisk(s, [], {
        feeling: 'managing',
        events: evArr,
      });
      return r.scorePct / 100;
    }

    function clampRisk(x, lo, hi) {
      return Math.max(lo, Math.min(hi, x));
    }

    /**
     * Hybrid burnout risk — sensitive to severe combinations, trends,
     * and baseline drift. Protective factors are capped so they cannot
     * erase crisis-level signals.
     *
     * @param {object} inputs Wizard signals (hours, sleep, mood 1–10, …)
     * @param {Array<{signals:object}>} history Newest-first past entries
     * @param {object} [meta]
     * @param {string} [meta.feeling] 'fine' | 'managing' | 'burned'
     * @param {string[]|Set} [meta.events] User-facing chip keys
     * @param {object} [meta.trackerToday] Daily category answers for today
     */
    function calculateBurnoutRisk(inputs, history, meta) {
      meta = meta || {};
      const feeling = meta.feeling || 'managing';
      const chips = new Set(
        Array.isArray(meta.events) ? meta.events
          : meta.events instanceof Set ? [...meta.events]
          : []
      );
      const tracker = meta.trackerToday && typeof meta.trackerToday === 'object'
        ? meta.trackerToday : {};

      const mood = clampRisk(+inputs.mood || 5, 1, 10);
      const stress = clampRisk(+inputs.stress || 5, 1, 10);
      const deadline = clampRisk(+inputs.deadline_pressure || 5, 1, 10);
      const mgr = clampRisk(+inputs.mgr_support || 5, 1, 10);
      const peer = clampRisk(+inputs.peer_support || 5, 1, 10);
      const hours = clampRisk(+inputs.hours ?? 8, 0, 16);
      const sleepH = clampRisk(+inputs.sleep ?? 7, 2, 14);
      const onCall = +inputs.on_call_load || 0;

      const modelEv = eventsForModel(chips);

      const overwhelmChip =
        chips.has('overwhelm') || chips.has('work_stress')
        || chips.has('exams') || chips.has('bad_sleep');
      const overwhelmBool = stress >= 8 || overwhelmChip;

      const workloadIntensity = clampRisk(
        (hours / 16) * 0.42 + ((deadline - 1) / 9) * 0.58,
        0, 1,
      );

      const poorSleep = sleepH <= 5;
      const veryPoorSleep = sleepH <= 4;

      const focusStruggle = mood <= 4 && stress >= 7;

      function trBad(key, badVals) {
        const v = tracker[key];
        return !!(v && badVals.includes(v));
      }

      /* ---------- Severe domains (count once each; capped at 8) ---------- */
      const domains = [];
      if (stress >= 8) domains.push({ key: 'stress_high', label: 'stress is very high' });
      if (mood <= 3) domains.push({ key: 'mood_low', label: 'mood and energy are very low' });
      if (poorSleep) domains.push({ key: 'sleep_hours', label: 'sleep hours have been short' });
      if (overwhelmBool) domains.push({ key: 'overwhelm', label: 'you feel overwhelmed' });
      if (deadline >= 8 && hours >= 10) {
        domains.push({ key: 'load', label: 'workload volume is very heavy' });
      }
      if (focusStruggle) domains.push({ key: 'focus', label: 'focus has been difficult under strain' });
      if (feeling === 'burned') domains.push({ key: 'feeling_burned', label: 'you described feeling burned out' });

      if (trBad('energy', ['Drained', 'Low'])) {
        domains.push({ key: 'tr_energy', label: 'energy was low in today\'s brief log' });
      }
      if (trBad('overwhelm', ['Stressed', 'Overwhelmed'])) {
        domains.push({ key: 'tr_over', label: 'pressure felt high in today\'s brief log' });
      }
      if (trBad('motivation', ['Very difficult', 'Difficult'])) {
        domains.push({ key: 'tr_mot', label: 'motivation has been hard to find' });
      }
      if (trBad('sleepQuality', ['Poor'])) {
        domains.push({ key: 'tr_sleepq', label: 'sleep quality was poor today' });
      }
      if (trBad('workStudyPressure', ['High', 'Extreme'])) {
        domains.push({ key: 'tr_press', label: 'study/work pressure spiked today' });
      }
      if (trBad('socialConnection', ['Draining', 'Isolated'])) {
        domains.push({ key: 'tr_social', label: 'social connection felt draining or distant' });
      }
      if (trBad('recoveryTime', ['None'])) {
        domains.push({ key: 'tr_recovery', label: 'there was no real recovery time today' });
      }

      /* Dedupe by key */
      const domMap = new Map();
      for (const d of domains) domMap.set(d.key, d.label);
      const severeCount = domMap.size;

      /* ---------- Baseline layer (0–100), NOT a plain average ---------- */
      let baseline =
        Math.pow((stress - 1) / 9, 1.35) * 38
        + Math.pow((11 - mood) / 10, 1.25) * 30;

      if (sleepH <= 4) baseline += 26;
      else if (sleepH <= 5) baseline += 18;
      else if (sleepH <= 6) baseline += 10;
      else if (sleepH >= 8) baseline -= 4;

      baseline += workloadIntensity * 22;

      baseline += Math.pow((deadline - 1) / 9, 1.2) * 6;

      if (modelEv.has('deadline_crunch')) baseline += 7;
      if (modelEv.has('personal_shock')) baseline += 9;
      if (modelEv.has('reorg')) baseline += 6;
      if (modelEv.has('layoff')) baseline += 14;

      if (onCall >= 1.1) baseline += 10;
      else if (onCall >= 0.55) baseline += 5;

      if (feeling === 'burned') baseline += 18;
      else if (feeling === 'managing') baseline += 3;

      /* ---------- Combo multipliers (dangerous intersections) ---------- */
      let comboBoost = 1;
      if (stress >= 8 && mood <= 3) comboBoost *= 1.45;
      if (stress >= 8 && veryPoorSleep && overwhelmBool) comboBoost *= 1.38;
      if (poorSleep && workloadIntensity >= 0.55 && stress >= 7) comboBoost *= 1.22;
      if (mood <= 4 && mgr <= 4 && peer <= 4) comboBoost *= 1.12;

      baseline *= comboBoost;

      /* ---------- Trend vs personal baseline (recent history) ---------- */
      const hist = Array.isArray(history) ? history.slice(0, 28) : [];
      const pastSignals = hist.map(h => h.signals || h).filter(Boolean);

      let trendBoost = 0;
      const histReasons = [];

      if (pastSignals.length >= 3) {
        const avg = (pick) => mean(pastSignals.slice(0, 12).map(pick));
        const avgStress = avg(s => +s.stress || 5);
        const avgMood = avg(s => +s.mood || 5);
        const avgSleep = avg(s => +s.sleep || 7);

        if (stress >= avgStress + 2) {
          trendBoost += 10;
          histReasons.push('stress is higher than your recent usual');
        }
        if (mood <= avgMood - 2) {
          trendBoost += 10;
          histReasons.push('mood is lower than your recent usual');
        }
        if (sleepH <= avgSleep - 1.25) {
          trendBoost += 8;
          histReasons.push('sleep is worse than your recent usual');
        }

        const slopeS = slope(pastSignals.slice(0, 7).map(s => +s.stress || 5).reverse());
        const slopeM = slope(pastSignals.slice(0, 7).map(s => +s.mood || 5).reverse());
        if (slopeS > 0.35 && stress >= 7) {
          trendBoost += 8;
          histReasons.push('stress has been climbing over recent check-ins');
        }
        if (slopeM < -0.35 && mood <= 5) {
          trendBoost += 8;
          histReasons.push('mood has been slipping over recent check-ins');
        }
      }

      baseline += trendBoost;

      /* ---------- Protective layer (soft cap) ---------- */
      let protective =
        clampRisk((mgr - 5) / 5, 0, 1) * 5
        + clampRisk((peer - 5) / 5, 0, 1) * 4;

      if (modelEv.has('pto')) protective += 7;

      const hydrationGood = tracker.hydration === 'Good';
      const movementGood = tracker.movement === 'Active';
      const breaksEnough = tracker.breaks === 'Enough';
      const supportiveConnection = tracker.socialConnection === 'Supportive';
      const realRest = tracker.recoveryTime === 'Real rest';
      if (hydrationGood) protective += 2;
      if (movementGood) protective += 3;
      if (breaksEnough) protective += 2;
      if (supportiveConnection) protective += 3;
      if (realRest) protective += 4;

      const protectCap = baseline >= 52 ? 10 : 16;
      baseline -= Math.min(protectCap, protective);

      let score = clampRisk(baseline, 0, 100);

      /* ---------- Minimum floors (cannot average away crisis) ---------- */
      const floors = [];

      if (stress >= 8 && mood <= 3) {
        floors.push(65);
        histReasons.push('high stress paired with very low energy');
      }
      if (stress >= 8 && sleepH <= 4 && overwhelmBool) {
        floors.push(75);
      }
      if (severeCount >= 3) floors.push(70);
      if (feeling === 'burned' && stress >= 7 && mood <= 4) {
        floors.push(82);
      }

      /* Extreme exhaustion / cannot function */
      if ((feeling === 'burned' && mood <= 2 && stress >= 8)
          || (mood <= 2 && stress >= 9 && poorSleep)) {
        floors.push(92);
      }

      /* Repeated severe days from stored risk history */
      let severeRun = 0;
      for (const e of hist) {
        const r = typeof e.risk === 'number' ? e.risk : null;
        if (r != null && r >= 0.70) severeRun++;
        else break;
      }
      if (severeRun >= 2 && severeCount >= 2) floors.push(80);

      const floorVal = floors.length ? Math.max(...floors) : 0;
      if (floorVal > 0) score = Math.max(score, floorVal);

      /* ---------- Reasons narrative ---------- */
      const topReasons = [];

      if (stress >= 7) topReasons.push('stress is elevated');
      if (mood <= 4) topReasons.push('energy / mood is depleted');
      if (poorSleep) topReasons.push('sleep has been short');
      if (workloadIntensity >= 0.5 || deadline >= 8) topReasons.push('workload pressure is high');
      if (overwhelmBool) topReasons.push('overwhelm is present');
      if (tracker.screenTime === 'Avoidance' || tracker.screenTime === 'Late-night') {
        topReasons.push('screen time may be avoidance or affecting recovery');
      }
      if (tracker.alcohol === 'To cope' || tracker.alcohol === 'Affected sleep') {
        topReasons.push('alcohol may be coping-related or affecting sleep');
      }

      for (const hr of histReasons) {
        if (!topReasons.includes(hr)) topReasons.push(hr);
      }

      if (severeRun >= 2 && score >= 55) {
        topReasons.push('several consecutive high-risk days');
      }

      /* Dedupe while preserving order */
      const seen = new Set();
      const uniqReasons = [];
      for (const t of topReasons) {
        if (!seen.has(t)) { seen.add(t); uniqReasons.push(t); }
      }

      let explain = '';
      if (uniqReasons.length > 0 && score >= 31) {
        explain =
          'Your risk increased because ' +
          uniqReasons.slice(0, 4).join(', ') + '.';
      } else if (score >= 56) {
        explain =
          'Several strain signals came together today — worth slowing down.';
      } else {
        explain =
          'Overall strain looks manageable right now — keep checking in.';
      }

      /* ---------- Tier + advice ---------- */
      const roundedScore = Math.round(score);
      const vObj = verdict(roundedScore / 100);

      let recommendedAction;
      let safetyNetSuggested;

      if (roundedScore <= 30) {
        recommendedAction =
          'Maintain routines that help you recover; small habits compound.';
        safetyNetSuggested = false;
      } else if (roundedScore <= 55) {
        recommendedAction =
          'Schedule real breaks, protect sleep, and lighten one obligation if you can.';
        safetyNetSuggested = false;
      } else if (roundedScore <= 75) {
        recommendedAction =
          'Tell someone you trust how you are doing, cut non-essential load this week, '
          + 'and consider professional support if this persists.';
        safetyNetSuggested = true;
      } else {
        recommendedAction =
          'Prioritize safety: reach out to a trusted contact or crisis line now, '
          + 'rest aggressively, and seek urgent professional help if you feel unsafe.';
        safetyNetSuggested = true;
      }

      return {
        scorePct: roundedScore,
        scoreProb: clampRisk(roundedScore / 100, 0, 1),
        riskLevel: vObj.label,
        verdict: vObj,
        topReasons: uniqReasons.slice(0, 6),
        explain,
        recommendedAction,
        safetyNetSuggested,
        severeDomains: [...domMap.entries()].map(([k, label]) => ({ key: k, label })),
        severeCount,
        floorsApplied: floors.length ? floorVal : null,
      };
    }

    function sigmoid(z) { return 1 / (1 + Math.exp(-Math.max(-30, Math.min(30, z)))); }
    function walkTree(node, x) {
      while (!node.l) { node = x[node.f] <= node.t ? node.L : node.R; }
      return node.v;
    }
    function gbtPredict(gbt, x) {
      let F = gbt.init_log_odds;
      for (const tree of gbt.trees) F += gbt.learning_rate * walkTree(tree, x);
      return sigmoid(F);
    }
    function lrPredict(lr, xStd) {
      let z = lr.bias;
      for (let i = 0; i < lr.weights.length; i++) z += lr.weights[i] * xStd[i];
      return sigmoid(z);
    }
    function plattApply(platt, p) {
      const c = Math.min(1 - 1e-6, Math.max(1e-6, p));
      const s = Math.log(c / (1 - c));
      return sigmoid(platt.a * s + platt.b);
    }
    const FEATURE_RAW_COLS = ["hours", "sleep", "mood", "stress",
                              "mgr_support", "peer_support",
                              "deadline_pressure", "on_call_load"];

    /* Detect whether the loaded bundle was trained on daily data
       (uses *_ma7 features and days_since_pto) or the legacy weekly
       data (uses *_ma4 / *_ma12 and weeks_since_pto). The web app
       supports both so old bundles keep working. */
    function bundleSchema(featureCols) {
      const set = new Set(featureCols);
      if (set.has("hours_ma7") || set.has("days_since_pto")) {
        return { kind: "daily",  short: 7,  long: 28,  evWin: 14,
                 ptoFeat: "days_since_pto", ptoCap: 60,
                 evSuffix: "14d", hoursScale: 1 };
      }
      return   { kind: "weekly", short: 4,  long: 12,  evWin: 4,
                 ptoFeat: "weeks_since_pto", ptoCap: 12,
                 evSuffix: "4w",  hoursScale: 5 };
    }

    function mean(arr) {
      return arr.length ? arr.reduce((a,b) => a + b, 0) / arr.length : 0;
    }
    function stddev(arr) {
      if (arr.length < 2) return 0;
      const m = mean(arr);
      return Math.sqrt(arr.reduce((s,v) => s + (v - m)**2, 0) / (arr.length - 1));
    }
    function slope(arr) {
      const n = arr.length;
      if (n < 2) return 0;
      const xm = (n - 1) / 2;
      const ym = mean(arr);
      let num = 0, den = 0;
      for (let i = 0; i < n; i++) {
        num += (i - xm) * (arr[i] - ym);
        den += (i - xm) ** 2;
      }
      return den === 0 ? 0 : num / den;
    }

    /* Build the feature row the model expects.
       `history` = past daily check-ins for THIS user, newest first,
       same shape as entries in `entry.signals` (plus `events: [..]`).
       The current check-in (`raw` + `eventSet`) is appended as the
       most recent day. */
    function buildFeatureRow(featureCols, raw, eventSet, history) {
      const schema = bundleSchema(featureCols);
      // Newest-first -> oldest-first, then append today.
      const seq = (history || []).slice().reverse().map(h => ({
        signals: h.signals || h,
        events:  new Set(h.events || []),
      }));
      seq.push({ signals: raw, events: eventSet });

      // Legacy weekly bundle wants hours scaled up to weekly totals.
      const scaleHours = (v) => schema.hoursScale === 1 ? +v : +v * schema.hoursScale;

      const N = seq.length;
      const windowOf = (n) => seq.slice(Math.max(0, N - n), N);
      const valsIn = (rows, col) => rows.map(r => {
        const v = +r.signals[col];
        return col === "hours" ? scaleHours(v) : v;
      });
      const eventsHad = (rows, ev) => rows.some(r => r.events.has(ev));

      const today = seq[N - 1];
      const out = {};
      for (const c of FEATURE_RAW_COLS) {
        out[c] = c === "hours" ? scaleHours(today.signals[c]) : +today.signals[c];
      }

      // Rolling means.
      const shortWin = windowOf(schema.short);
      const longWin  = windowOf(schema.long);
      for (const c of FEATURE_RAW_COLS) {
        out[`${c}_ma${schema.short}`] = mean(valsIn(shortWin, c));
        out[`${c}_ma${schema.long}`]  = mean(valsIn(longWin,  c));
      }

      // Deltas (today minus short-window mean).
      for (const c of ["hours", "stress", "sleep", "mood", "deadline_pressure"]) {
        out[`${c}_delta${schema.short}`] = out[c] - out[`${c}_ma${schema.short}`];
      }

      // Volatility + slope over the short window.
      for (const c of ["hours", "stress", "sleep", "mood"]) {
        out[`${c}_std${schema.short}`] = stddev(valsIn(shortWin, c));
      }
      for (const c of ["hours", "stress"]) {
        out[`${c}_slope${schema.short}`] = slope(valsIn(shortWin, c));
      }

      // Event recency: did this event fire in the recency window?
      const evWindow = windowOf(schema.evWin);
      out[`had_layoff_${schema.evSuffix}`]   = eventsHad(evWindow, "layoff")          ? 1 : 0;
      out[`had_reorg_${schema.evSuffix}`]    = eventsHad(evWindow, "reorg")           ? 1 : 0;
      out[`had_deadline_${schema.evSuffix}`] = eventsHad(evWindow, "deadline_crunch") ? 1 : 0;

      // Recovery-day recency: legacy bundles still call this feature "pto".
      let sinceRecoveryDay = schema.ptoCap;
      for (let i = N - 1; i >= 0; i--) {
        if (seq[i].events.has("pto")) {
          sinceRecoveryDay = Math.min(schema.ptoCap, N - 1 - i);
          break;
        }
      }
      out[schema.ptoFeat] = sinceRecoveryDay;

      // Interactions — scaled for whichever schema the bundle expects.
      if (schema.kind === "daily") {
        out["hours_x_stress"]       = (out.hours * out.stress) / 20;
        out["low_sleep_high_hours"] = Math.max(0, out.hours - 10) * Math.max(0, 7 - out.sleep);
      } else {
        out["hours_x_stress"]       = (out.hours * out.stress) / 100;
        out["low_sleep_high_hours"] = Math.max(0, out.hours - 50) * Math.max(0, 7 - out.sleep);
      }

      return featureCols.map(c => out[c] === undefined ? 0 : out[c]);
    }
    function realModelScore(bundle, raw, eventSet, history) {
      const x = buildFeatureRow(bundle.feature_cols, raw, eventSet, history);
      const mu = bundle.standardization.mu;
      const sigma = bundle.standardization.sigma;
      const xStd = x.map((v, i) => (v - mu[i]) / sigma[i]);
      const p_lr  = lrPredict(bundle.logreg, xStd);
      const p_gbt_raw = gbtPredict(bundle.gbt, x);
      const p_gbt_cal = bundle.platt ? plattApply(bundle.platt, p_gbt_raw) : p_gbt_raw;
      return {
        logreg: p_lr, gbt_raw: p_gbt_raw, gbt_calibrated: p_gbt_cal,
        ensemble_mean: (p_lr + p_gbt_cal) / 2,
        x, xStd,
      };
    }
    function realModelDrivers(bundle, scoreOutput) {
      const w = bundle.logreg.weights;
      const cols = bundle.feature_cols;
      const xStd = scoreOutput.xStd;
      const PRETTY = {
        hours: "Study/workload hours today", sleep: "Sleep last night",
        mood: "Mood", stress: "Stress",
        mgr_support: "Support figure", peer_support: "Peer/social support",
        deadline_pressure: "Exam/assignment pressure", on_call_load: "Urgent obligations",
        // Daily-bundle features
        hours_ma7:  "Study/work hours (7-day avg)",  hours_ma28: "Study/work hours (28-day avg)",
        stress_ma7: "Stress (7-day avg)", stress_ma28: "Stress (28-day avg)",
        sleep_ma7:  "Sleep (7-day avg)",  sleep_ma28: "Sleep (28-day avg)",
        mood_ma7:   "Mood (7-day avg)",   mood_ma28:   "Mood (28-day avg)",
        hours_delta7: "Study/work hours vs 7-day avg",
        stress_delta7: "Stress vs 7-day avg",
        sleep_delta7:  "Sleep vs 7-day avg",
        mood_delta7:   "Mood vs 7-day avg",
        deadline_pressure_delta7: "Exam/assignment pressure vs 7-day avg",
        hours_std7:  "Study/work hours volatility",
        stress_std7: "Stress volatility",
        hours_slope7: "Study/work hours trend",
        stress_slope7: "Stress trend",
        had_layoff_14d:   "Recent major disruption",
        had_reorg_14d:    "Recent life change",
        had_deadline_14d: "Recent exam/deadline crunch",
        days_since_pto: "Days since recovery day",
        // Legacy weekly bundle features (kept so older bundles still label)
        hours_ma4: "Study/work hours (4-week avg)",  hours_ma12: "Study/work hours (12-week avg)",
        stress_ma4: "Stress (4-week avg)", stress_ma12: "Stress (12-week avg)",
        sleep_ma4: "Sleep (4-week avg)",  sleep_ma12: "Sleep (12-week avg)",
        mood_ma4: "Mood (4-week avg)",    mood_ma12: "Mood (12-week avg)",
        had_layoff_4w: "Recent major disruption",   had_reorg_4w: "Recent life change",
        had_deadline_4w: "Recent exam/deadline crunch",
        weeks_since_pto: "Weeks since recovery day",
        hours_x_stress: "Workload hours × stress",
        low_sleep_high_hours: "Low-sleep + high-hours combo",
      };
      const contribs = w.map((wi, i) => ({
        key: cols[i], label: PRETTY[cols[i]] || cols[i],
        c: wi * xStd[i],
      }));
      return contribs.filter(d => Math.abs(d.c) > 0.10)
                     .sort((a, b) => Math.abs(b.c) - Math.abs(a.c))
                     .slice(0, 5);
    }
    function heuristicDrivers(s, events) {
      const E = events instanceof Set ? events : new Set(events || []);
      const items = [
        { key: 'hours',             label: 'Heavy study/workload hours', c:  (s.hours - 40) / 12 },
        { key: 'sleep',             label: 'Low sleep',            c: -(s.sleep - 6) / 2 * 0.6 },
        { key: 'stress',            label: 'High stress',          c:  (s.stress - 5) / 3 },
        { key: 'mood',              label: 'Low mood',             c: -(s.mood - 6) / 4 },
        { key: 'deadline_pressure', label: 'Exam/assignment pressure', c:  (s.deadline_pressure - 4) / 3 },
        { key: 'mgr_support',       label: 'Support figure',       c: -(s.mgr_support - 6) / 4 * 0.6 },
        { key: 'peer_support',      label: 'Peer/social support',   c: -(s.peer_support - 6) / 5 * 0.6 },
        { key: 'on_call_load',      label: 'Urgent obligations',    c:  0.5 * s.on_call_load },
      ];
      if (E.has('layoff'))          items.push({ key: 'ev_lay', label: 'Recent major disruption', c:  0.8 });
      if (E.has('reorg'))           items.push({ key: 'ev_reo', label: 'Recent life change',    c:  0.5 });
      if (E.has('deadline_crunch')) items.push({ key: 'ev_dl',  label: 'Recent exam/deadline crunch', c:  0.4 });
      if (E.has('personal_shock'))  items.push({ key: 'ev_ps',  label: 'Personal shock',        c:  0.5 });
      if (E.has('pto'))             items.push({ key: 'ev_pto', label: 'Recent recovery day',   c: -0.9 });
      if (E.has('recognition'))     items.push({ key: 'ev_rec', label: 'Recent recognition',    c: -0.3 });
      return items.filter(d => Math.abs(d.c) > 0.15)
                  .sort((a, b) => Math.abs(b.c) - Math.abs(a.c))
                  .slice(0, 5);
    }

    function verdict(pProb) {
      const pct = Math.round(Math.max(0, Math.min(1, pProb || 0)) * 100);
      if (pct <= 30) return {
        label: 'Low',
        key: 'low',
        color: 'var(--risk-low)',
        note: 'Patterns look steadier — keep nurturing recovery.',
      };
      if (pct <= 55) return {
        label: 'Moderate',
        key: 'elev',
        color: 'var(--risk-elev)',
        note: 'Worth tuning recovery before things snowball.',
      };
      if (pct <= 75) return {
        label: 'High',
        key: 'high',
        color: 'var(--risk-high)',
        note: 'Serious strain — treat recovery as the main priority.',
      };
      return {
        label: 'Critical',
        key: 'severe',
        color: 'var(--risk-severe)',
        note: 'Crisis-level strain — please reach out for immediate support.',
      };
    }

    /* =========================================================
       Storage keys + profile model
       Profiles are first-class. Each profile carries its own
       personId so it round-trips through the CSV pipeline that
       train_real.py / load_real.py expect.
       ========================================================= */
    const STORAGE_KEY      = 'burnout_checkins_v2';
    const STORAGE_KEY_V1   = 'burnout_checkins_v1';
    const THEME_KEY        = 'burnout_theme';
    const REMIND_KEY       = 'burnout_remind_dow';
    const BUNDLE_KEY             = 'burnout_model_bundle';
    const BUNDLE_SOURCE_META_KEY = 'wellcare_bundle_source_meta';
    const PROFILES_KEY     = 'burnout_profiles_v1';
    const ACTIVE_KEY       = 'burnout_active_profile';
    const TRACKER_KEY      = 'burnout_tracker_v1';
    const LEGACY_PERSON    = 'burnout_person';

    /* =========================================================
       Daily check-in — category answers per (person, date).
       Storage shape:
         { [personId]: { [yyyy-mm-dd]: { energy, overwhelm, ... } } }
       Each value is a category string (e.g. "Low"), not a number.
       The heuristic delta below only tints the dashboard's preview;
       the trained ML model is scored from the wizard's signals.
       ========================================================= */
    /* Tracker sections.
       The daily check-in wizard already covers energy (feeling), stress
       (slider), and work/study pressure (deadline_pressure slider) and
       sleep hours — so we don't ask those again in the tracker.
       The tracker focuses on lifestyle context the wizard does NOT ask:
       sleep quality, hydration, movement, breaks, real rest, screen
       time, caffeine, social connection, plus optional substance use. */
    const CHECKIN_SECTIONS = [
      {
        id: 'recovery',
        title: 'Recovery',
        cards: [
          { id: 'sleepQuality', name: 'Sleep Quality',
            opts: ['Poor', 'Okay', 'Good', 'Great'] },
          { id: 'hydration',    name: 'Hydration',
            opts: ['Low', 'Okay', 'Good'] },
          { id: 'movement',     name: 'Movement',
            opts: ['None', 'Light', 'Active'] },
          { id: 'breaks',       name: 'Breaks',
            opts: ['None', 'Some', 'Enough'] },
          { id: 'recoveryTime', name: 'Real rest today',
            opts: ['Real rest', 'Some', 'None'] },
        ],
      },
      {
        id: 'habits',
        title: 'Daily Habits',
        cards: [
          { id: 'screenTime',       name: 'Screen Time',
            opts: ['Relaxing', 'Connecting', 'Avoidance', 'Late-night'] },
          { id: 'caffeine',         name: 'Caffeine',
            opts: ['None', 'Low', 'Moderate', 'High'] },
          { id: 'socialConnection', name: 'Social Connection',
            opts: ['Supportive', 'Neutral', 'Draining', 'Isolated'] },
          { id: 'motivation',       name: 'Motivation',
            q: 'How hard is it to get things done?',
            opts: ['Easy', 'Normal', 'Difficult', 'Very difficult'] },
          { id: 'alcohol',          name: 'Alcohol', muted: true,
            opts: ['None', 'Connected', 'To cope', 'Affected sleep'] },
          { id: 'nicotine',         name: 'Nicotine', muted: true,
            opts: ['None', 'Some', 'High'] },
        ],
      },
    ];

    // Per-option heuristic risk influence. Used only to nudge the
    // dashboard's "today's check-in" preview; the trained ML model
    // doesn't read these directly.
    // Keys removed (`energy`, `overwhelm`, `workStudyPressure`) overlap
    // with wizard questions — old stored values for those keys are
    // silently ignored by `getTrackerToday` so the dashboard stays
    // accurate after the cleanup.
    const CHECKIN_DELTA = {
      motivation:        { Easy: -0.015, Normal: 0, Difficult: +0.02, 'Very difficult': +0.04 },
      sleepQuality:      { Poor: +0.03, Okay: 0, Good: -0.015, Great: -0.03 },
      hydration:         { Low: +0.015, Okay: 0, Good: -0.01 },
      movement:          { None: +0.015, Light: -0.01, Active: -0.025 },
      breaks:            { None: +0.02, Some: 0, Enough: -0.015 },
      screenTime:        { Relaxing: 0, Connecting: -0.01, Avoidance: +0.025, 'Late-night': +0.04 },
      caffeine:          { None: 0, Low: 0, Moderate: 0, High: +0.02 },
      socialConnection:  { Supportive: -0.025, Neutral: 0, Draining: +0.025, Isolated: +0.035 },
      recoveryTime:      { 'Real rest': -0.035, Some: -0.01, None: +0.035 },
      alcohol:           { None: 0, Connected: -0.005, 'To cope': +0.035, 'Affected sleep': +0.045 },
      nicotine:          { None: 0, Some: +0.02, High: +0.04 },
    };

    function todayKey() { return new Date().toISOString().slice(0,10); }

    function loadTracker() { return loadJson(TRACKER_KEY, {}); }
    function saveTracker(t) { saveJson(TRACKER_KEY, t); }

    function getTrackerToday(personId) {
      const all = loadTracker();
      const day = all[personId] && all[personId][todayKey()];
      // Only keep recognised fields — old numeric habit data is ignored.
      const next = {};
      if (day && typeof day === 'object') {
        for (const k of Object.keys(CHECKIN_DELTA)) {
          if (typeof day[k] === 'string') next[k] = day[k];
        }
      }
      return next;
    }

    function setTrackerToday(personId, next) {
      const all = loadTracker();
      if (!all[personId]) all[personId] = {};
      all[personId][todayKey()] = next;
      saveTracker(all);
    }

    function getTrackerForDate(personId, iso) {
      if (!personId || !iso) return {};
      const all = loadTracker();
      const key = new Date(iso).toISOString().slice(0, 10);
      const day = all[personId] && all[personId][key];
      const next = {};
      if (day && typeof day === 'object') {
        for (const k of Object.keys(CHECKIN_DELTA)) {
          if (typeof day[k] === 'string') next[k] = day[k];
        }
      }
      return next;
    }

    // Sum of heuristic deltas across all selected categories for today.
    function trackerDelta(today) {
      let sum = 0;
      if (today && typeof today === 'object') {
        for (const [k, v] of Object.entries(today)) {
          const map = CHECKIN_DELTA[k];
          if (map && Object.prototype.hasOwnProperty.call(map, v)) sum += map[v];
        }
      }
      return Math.max(-0.15, Math.min(0.15, sum));
    }

    function recoveryStatus(today) {
      const entries = today && typeof today === 'object'
        ? Object.entries(today).filter(([, v]) => typeof v === 'string')
        : [];
      if (!entries.length) {
        return {
          key: 'not_logged',
          label: 'Not logged',
          score: null,
          note: 'Add tracker details to understand recovery capacity today.',
        };
      }

      const delta = trackerDelta(today);
      const positives = [
        today.sleepQuality === 'Good' || today.sleepQuality === 'Great',
        today.hydration === 'Good',
        today.movement === 'Active',
        today.breaks === 'Enough',
        today.recoveryTime === 'Real rest',
        today.socialConnection === 'Supportive',
        today.screenTime === 'Relaxing' || today.screenTime === 'Connecting',
      ].filter(Boolean).length;
      const strains = [
        today.sleepQuality === 'Poor',
        today.hydration === 'Low',
        today.movement === 'None',
        today.breaks === 'None',
        today.recoveryTime === 'None',
        today.socialConnection === 'Draining' || today.socialConnection === 'Isolated',
        today.screenTime === 'Avoidance' || today.screenTime === 'Late-night',
        today.motivation === 'Difficult' || today.motivation === 'Very difficult',
        today.caffeine === 'High',
        today.alcohol === 'To cope' || today.alcohol === 'Affected sleep',
        today.nicotine === 'High',
      ].filter(Boolean).length;

      if (delta <= -0.05 && positives >= 3) {
        return {
          key: 'strong',
          label: 'Strong recovery',
          score: Math.round((0.5 - delta) * 100),
          note: 'Recovery signals are protecting your baseline today.',
        };
      }
      if (delta <= 0.02 && positives >= strains) {
        return {
          key: 'partial',
          label: 'Partial recovery',
          score: Math.round((0.45 - delta) * 100),
          note: 'Some recovery is present, with room to protect rest.',
        };
      }
      if (delta >= 0.08 || strains >= 4) {
        return {
          key: 'at_risk',
          label: 'Recovery at risk',
          score: Math.max(0, Math.round((0.4 - delta) * 100)),
          note: 'Several habits point away from recovery today.',
        };
      }
      return {
        key: 'low',
        label: 'Low recovery',
        score: Math.max(0, Math.round((0.45 - delta) * 100)),
        note: 'Recovery looks thin today; one small reset may help.',
      };
    }

    function loadHistory() {
      try {
        const v2 = JSON.parse(localStorage.getItem(STORAGE_KEY));
        if (Array.isArray(v2)) return v2;
        const v1 = JSON.parse(localStorage.getItem(STORAGE_KEY_V1));
        if (Array.isArray(v1)) return v1.map(e => ({ ...e, person_id: 'me', notes: '' }));
      } catch {}
      return [];
    }
    function saveHistory(h) {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(h)); } catch {}
    }
    function loadStr(key, dflt) {
      try { return localStorage.getItem(key) ?? dflt; } catch { return dflt; }
    }
    function saveStr(key, v) {
      try { localStorage.setItem(key, v ?? ''); } catch {}
    }
    function loadJson(key, dflt) {
      try {
        const s = localStorage.getItem(key);
        return s ? JSON.parse(s) : dflt;
      } catch { return dflt; }
    }
    function saveJson(key, v) {
      try { localStorage.setItem(key, JSON.stringify(v)); } catch {}
    }

    function loadBundle() {
      if (window.MODEL_BUNDLE) return window.MODEL_BUNDLE;
      try {
        const s = localStorage.getItem(BUNDLE_KEY);
        return s ? JSON.parse(s) : null;
      } catch { return null; }
    }
    function saveBundle(b) {
      try {
        if (b) localStorage.setItem(BUNDLE_KEY, JSON.stringify(b));
        else   localStorage.removeItem(BUNDLE_KEY);
      } catch {}
    }

    function loadBundleSourceMeta() {
      try {
        const s = localStorage.getItem(BUNDLE_SOURCE_META_KEY);
        return s ? JSON.parse(s) : null;
      } catch { return null; }
    }
    function saveBundleSourceMeta(m) {
      try {
        if (m == null) localStorage.removeItem(BUNDLE_SOURCE_META_KEY);
        else localStorage.setItem(BUNDLE_SOURCE_META_KEY, JSON.stringify(m));
      } catch {}
    }

    // --- Connections & Notifications (client-only prototype storage) ---
    const CONNECTIONS_KEY = 'wellcare_connections_v1';
    const NOTIFS_KEY = 'wellcare_notifications_v1';
    const ALERT_EVENTS_KEY = 'wellcare_alert_events_v1';
    const PENDING_INVITE_KEY = 'wellcare_pending_invite_token';
    const DEFAULT_SHARE_SETTINGS = {
      risk: true,
      level: true,
      trend: true,
      last_checkin: true,
      top_contributors: false,
      recovery_status: false,
      important_updates: true,
      private_answers: false,
      notes: false,
    };

    /* ---------------------------------------------------------------
       Sharing-mode presets.
       A "mode" is a friendly name for a permission preset. Trusted
       connections always store full per-permission settings, but the
       UI lets the user pick a mode and we apply the matching preset.
       If the user manually toggles anything that drifts from a preset,
       the connection becomes "custom".
       --------------------------------------------------------------- */
    const SHARING_MODES = {
      minimal: {
        label: 'Minimal',
        tagline: 'Critical alerts only',
        description: 'Only sends critical alerts when you may need support.',
        pills: ['High-risk alerts', 'Last safety update'],
        permissions: {
          risk: false,
          level: true,
          trend: false,
          last_checkin: true,
          top_contributors: false,
          recovery_status: false,
          important_updates: true,
          private_answers: false,
          notes: false,
        },
        notificationEnabled: true,
        alertThreshold: 0.80,
      },
      supportive: {
        label: 'Supportive',
        tagline: 'Balanced support',
        description: 'Balanced sharing for trusted support without oversharing.',
        pills: ['Burnout trend', 'Recovery status', 'Important updates'],
        permissions: {
          risk: false,
          level: true,
          trend: true,
          last_checkin: true,
          top_contributors: false,
          recovery_status: true,
          important_updates: true,
          private_answers: false,
          notes: false,
        },
        notificationEnabled: true,
        alertThreshold: 0.70,
      },
      full: {
        label: 'Full Support',
        tagline: 'Deep wellbeing context',
        description: 'Shares deeper wellbeing context for close trusted people.',
        pills: ['Burnout %', 'Trend', 'Recovery status', 'Top contributors', 'Last update', 'Important alerts'],
        permissions: {
          risk: true,
          level: true,
          trend: true,
          last_checkin: true,
          top_contributors: true,
          recovery_status: true,
          important_updates: true,
          private_answers: false,
          notes: false,
        },
        notificationEnabled: true,
        alertThreshold: 0.60,
      },
    };
    const DEFAULT_SHARING_MODE = 'supportive';

    /** Return mode id whose preset matches current connection, or 'custom'. */
    function inferSharingMode(conn) {
      const share = normalizeShareSettings(conn.share);
      const notif = conn.notificationEnabled !== false;
      const thr = +conn.alertThreshold;
      for (const [id, preset] of Object.entries(SHARING_MODES)) {
        const permMatch = Object.keys(preset.permissions)
          .every(k => !!share[k] === !!preset.permissions[k]);
        const notifMatch = notif === preset.notificationEnabled;
        const thrMatch = Number.isFinite(thr)
          ? Math.abs(thr - preset.alertThreshold) < 0.005
          : true;
        if (permMatch && notifMatch && thrMatch) return id;
      }
      return 'custom';
    }

    /** Patch to apply when switching a connection to a given mode. */
    function patchForMode(modeId) {
      const preset = SHARING_MODES[modeId];
      if (!preset) return {};
      return {
        share: { ...preset.permissions },
        notificationEnabled: preset.notificationEnabled,
        alertThreshold: preset.alertThreshold,
        sharingMode: modeId,
      };
    }
    const ACCEPTED_CONNECTION_STATUSES = new Set(['accepted', 'active']);

    function normalizeShareSettings(share) {
      return { ...DEFAULT_SHARE_SETTINGS, ...(share || {}) };
    }
    function normalizeConnection(c) {
      const status = c.status === 'active' ? 'accepted' : (c.status || 'accepted');
      // If a stored connection has no explicit sharingMode yet, infer it
      // from its current permissions (falls back to DEFAULT_SHARING_MODE
      // when the connection is brand new with no share settings).
      const seedHasShareInfo = c && (c.share || Number.isFinite(+c.alertThreshold));
      const base = {
        ...c,
        status,
        relationship: c.relationship || 'Friend',
        alertThreshold: Number.isFinite(+c.alertThreshold) ? +c.alertThreshold : SHARING_MODES[DEFAULT_SHARING_MODE].alertThreshold,
        share: normalizeShareSettings(c.share || (seedHasShareInfo ? {} : SHARING_MODES[DEFAULT_SHARING_MODE].permissions)),
        notificationEnabled: c.notificationEnabled !== false,
      };
      const explicit = typeof c.sharingMode === 'string' && (SHARING_MODES[c.sharingMode] || c.sharingMode === 'custom');
      base.sharingMode = explicit ? c.sharingMode : inferSharingMode(base);
      return base;
    }
    function isAcceptedConnection(c) {
      return ACCEPTED_CONNECTION_STATUSES.has((c.status || '').toLowerCase());
    }
    function loadConnections() {
      const seen = new Set();
      return loadJson(CONNECTIONS_KEY, [])
        .map(normalizeConnection)
        .filter(c => {
          const key = c.personId || c.id;
          if (seen.has(key)) return false;
          seen.add(key);
          return true;
        });
    }
    function saveConnections(v) {
      saveJson(CONNECTIONS_KEY, (v || []).map(normalizeConnection));
      try { window.dispatchEvent(new CustomEvent('wellcare-connections-changed')); } catch {}
    }
    function upsertConnection(rec) {
      const normalized = normalizeConnection(rec);
      const conns = loadConnections();
      const idx = conns.findIndex(c =>
        c.id === normalized.id ||
        (normalized.personId && c.personId === normalized.personId)
      );
      if (idx >= 0) conns[idx] = { ...conns[idx], ...normalized };
      else conns.push(normalized);
      saveConnections(conns);
      return normalized;
    }

    function extractInviteToken(raw) {
      const value = String(raw || '').trim();
      if (!value) return '';
      try {
        const url = new URL(value, window.location.href);
        return url.searchParams.get('invite')
          || url.searchParams.get('token')
          || (url.hash || '').replace(/^#(?:invite=|token=)?/, '')
          || value;
      } catch {
        const match = value.match(/[?#&](?:invite|token)=([^&#]+)/);
        return match ? decodeURIComponent(match[1]) : value;
      }
    }

    function inviteLinkForToken(token) {
      try {
        const url = new URL(window.location.href);
        url.searchParams.set('invite', token);
        url.hash = '';
        return url.toString();
      } catch {
        return token;
      }
    }

    function encodeLocalInvitePayload(payload) {
      const bytes = new TextEncoder().encode(JSON.stringify(payload));
      let bin = '';
      for (const b of bytes) bin += String.fromCharCode(b);
      return btoa(bin);
    }

    function decodeBase64Url(value) {
      const normalized = String(value || '')
        .replace(/-/g, '+')
        .replace(/_/g, '/');
      const padded = normalized + '='.repeat((4 - normalized.length % 4) % 4);
      return atob(padded);
    }

    function decodeLocalInvitePayload(token) {
      const raw = String(token || '').trim();
      const encodedPayload = raw.includes('.') ? raw.split('.')[0] : raw;
      const bin = raw.includes('.')
        ? decodeBase64Url(encodedPayload)
        : atob(encodedPayload);
      const bytes = Uint8Array.from(bin, ch => ch.charCodeAt(0));
      return JSON.parse(new TextDecoder().decode(bytes));
    }

    function readPendingInviteFromLocation() {
      try {
        const url = new URL(window.location.href);
        const token = url.searchParams.get('invite') || url.searchParams.get('token');
        if (!token) return sessionStorage.getItem(PENDING_INVITE_KEY) || '';
        sessionStorage.setItem(PENDING_INVITE_KEY, token);
        url.searchParams.delete('invite');
        url.searchParams.delete('token');
        window.history.replaceState(null, '', url.pathname + url.search + url.hash);
        return token;
      } catch {
        try { return sessionStorage.getItem(PENDING_INVITE_KEY) || ''; } catch { return ''; }
      }
    }

    function clearPendingInvite() {
      try { sessionStorage.removeItem(PENDING_INVITE_KEY); } catch {}
    }

    async function createInviteToken(fromProfile, options) {
      const sharingMode = (options && options.sharingMode) || DEFAULT_SHARING_MODE;
      const preset = SHARING_MODES[sharingMode] || SHARING_MODES[DEFAULT_SHARING_MODE];
      const share = (options && options.share) || preset.permissions;
      const alertThreshold = Number.isFinite(+((options || {}).alertThreshold))
        ? +options.alertThreshold
        : preset.alertThreshold;
      const notificationEnabled = options &&
        Object.prototype.hasOwnProperty.call(options, 'notificationEnabled')
        ? options.notificationEnabled !== false
        : preset.notificationEnabled !== false;
      const inviteBody = {
        from: { personId: fromProfile.personId || fromProfile.id || 'unknown', name: fromProfile.name || '' },
        sharingMode,
        share,
        alertThreshold,
        notificationEnabled,
      };
      // Try server-issued token first, fallback to local base64 token when unavailable
      try {
        const resp = await fetch('/api/invite/create', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(inviteBody) });
        if (resp.ok) { const j = await resp.json(); if (j && j.token) return j.token; }
      } catch (e) { /* ignore, fallback below */ }
      try {
        const payload = {
          from: fromProfile.personId || fromProfile.id || 'unknown',
          name: fromProfile.name || '',
          sharingMode,
          share,
          alertThreshold,
          notificationEnabled,
          ts: Date.now(),
        };
        return encodeLocalInvitePayload(payload);
      } catch { return ''; }
    }

    async function acceptInviteToken(token, acceptorProfile) {
      token = extractInviteToken(token);
      // Try server accept endpoint first
      try {
        const acceptor = acceptorProfile ? {
          personId: acceptorProfile.personId || acceptorProfile.id || '',
          name: acceptorProfile.name || '',
        } : null;
        const resp = await fetch('/api/invite/accept', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, acceptor }),
        });
        if (resp.ok) {
          const j = await resp.json();
          if (j && j.connection) {
            const incomingMode = j.connection.sharingMode || DEFAULT_SHARING_MODE;
            const preset = SHARING_MODES[incomingMode] || SHARING_MODES[DEFAULT_SHARING_MODE];
            const rec = normalizeConnection({
              id: j.connection.id || (`${j.connection.personId}-${Math.floor(Math.random()*100000)}`),
              personId: j.connection.personId,
              name: j.connection.name || j.connection.personId,
              status: 'accepted',
              relationship: j.connection.relationship || 'Friend',
              alertThreshold: j.connection.alertThreshold || preset.alertThreshold,
              share: j.connection.share || preset.permissions,
              notificationEnabled: j.connection.notificationEnabled !== false,
              sharingMode: incomingMode,
              created_at: Date.now(),
            });
            upsertConnection(rec);
            pushNotification(`${rec.name} joined your Care Circle`);
            return rec;
          }
        }
      } catch (e) { /* continue to local fallback */ }
      try {
        const obj = decodeLocalInvitePayload(token);
        const incomingMode = obj.sharingMode || DEFAULT_SHARING_MODE;
        const preset = SHARING_MODES[incomingMode] || SHARING_MODES[DEFAULT_SHARING_MODE];
        const id = `${obj.from}-${Math.floor(Math.random()*100000)}`;
        const rec = normalizeConnection({
          id,
          personId: obj.from,
          name: obj.name || obj.from,
          status: 'accepted',
          relationship: 'Friend',
          alertThreshold: obj.alertThreshold || preset.alertThreshold,
          share: obj.share || preset.permissions,
          notificationEnabled: obj.notificationEnabled !== false,
          sharingMode: incomingMode,
          created_at: Date.now(),
        });
        upsertConnection(rec);
        pushNotification(`${rec.name} joined your Care Circle`);
        return rec;
      } catch (e) { throw new Error('invalid invite'); }
    }

    function loadNotifications() { return loadJson(NOTIFS_KEY, []); }
    function saveNotifications(a) { saveJson(NOTIFS_KEY, a || []); }
    function pushNotification(text, meta) {
      const n = loadNotifications();
      const item = { id: 'n'+Date.now(), text, ts: Date.now(), read: false, ...(meta || {}) };
      n.unshift(item);
      saveNotifications(n);
      try { window.dispatchEvent(new CustomEvent('wellcare-notifications-changed')); } catch {}
      return item;
    }
    function dismissNotification(id) {
      const n = loadNotifications().filter(x => x.id !== id);
      saveNotifications(n);
      try { window.dispatchEvent(new CustomEvent('wellcare-notifications-changed')); } catch {}
    }
    async function syncSharedCheckin(profile, entry) {
      if (!profile || !entry) return;
      try {
        await fetch('/api/checkins', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            personId: profile.personId,
            name: profile.name,
            entry: {
              id: entry.id,
              when: entry.when,
              risk: entry.risk,
              verdict: entry.verdict,
              recovery_status: entry.recoveryStatus?.label || '',
              recovery_key: entry.recoveryStatus?.key || '',
            },
          }),
        });
      } catch {}
    }
    async function fetchSharedTracker(personId, viewerPersonId) {
      if (!personId) return [];
      try {
        const qs = viewerPersonId
          ? `?viewerPersonId=${encodeURIComponent(viewerPersonId)}`
          : '';
        const resp = await fetch(`/api/shared-tracker/${encodeURIComponent(personId)}${qs}`);
        if (!resp.ok) return [];
        const data = await resp.json();
        return Array.isArray(data.checkins) ? data.checkins : [];
      } catch {
        return [];
      }
    }
    function loadAlertEvents() { return loadJson(ALERT_EVENTS_KEY, []); }
    function saveAlertEvents(a) { saveJson(ALERT_EVENTS_KEY, a || []); }
    function alertCooldownAllows(key, cooldownMs) {
      const now = Date.now();
      const events = loadAlertEvents().filter(e => now - (e.ts || 0) < cooldownMs);
      const blocked = events.some(e => e.key === key);
      if (!blocked) {
        events.unshift({ key, ts: now });
        saveAlertEvents(events.slice(0, 200));
      } else {
        saveAlertEvents(events);
      }
      return !blocked;
    }
    function notifyCareCircleForEntry(entry, previousHistory, activeProfile) {
      const conns = loadConnections()
        .filter(c => isAcceptedConnection(c) && c.notificationEnabled !== false)
        .filter(c => c.personId === entry.person_id || c.name === activeProfile.name);
      if (!conns.length) return;
      const previous = (previousHistory || [])
        .find(e => (e.person_id || 'me') === entry.person_id);
      for (const c of conns) {
        const threshold = c.alertThreshold || 0.75;
        const crossed = entry.risk >= threshold && (!previous || previous.risk < threshold);
        const rising = previous && entry.risk >= 0.55 && entry.risk - previous.risk >= 0.10;
        if (!crossed && !rising) continue;
        const kind = crossed ? 'threshold_crossed' : 'risk_rising';
        const key = `${kind}:${c.id}:${new Date(entry.when).toISOString().slice(0,10)}`;
        if (!alertCooldownAllows(key, 20 * 60 * 60 * 1000)) continue;
        const pct = Math.round(entry.risk * 100);
        const msg = crossed
          ? `${activeProfile.name}'s burnout risk reached ${pct}%. A gentle check-in may help.`
          : `${activeProfile.name}'s burnout risk is rising. A gentle check-in may help.`;
        pushNotification(msg, { kind, personId: entry.person_id, connectionId: c.id });
      }
    }

    /** Human-visible description of where the active scoring bundle comes from. */
    function bundleSourceDisplay(bundle, meta) {
      if (!bundle) {
        return {
          mode: 'heuristic',
          title: 'Scoring source',

            'CSV round-trip uses outputs/load_real.py with exports from Profile → Data.',

      if (meta && meta.kind === 'file' && meta.filename) {

    /** Profile → Data: where CSV / history live (no remote backend in this build). */
    const DATA_FILES_HELP = {
      title: 'Your check-in data',
      paths: [
        'Stored in this browser under localStorage key burnout_checkins_v2.',
        'Export writes a dated CSV to your Downloads folder (Profile → Export check-ins).',
        'Import expects compatible CSV from this app or from outputs/load_real.py / training pipelines.',
      ],
    };
    function applyTheme(theme) {
      const isDark = theme === 'dark' ||
        (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
