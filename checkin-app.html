  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef, useCallback } = React;

    /* =========================================================
       MODEL — trained bundle + safety-aware hybrid layer
       A blended probability feeds UI verdict bands:
       Low / Moderate / High / Critical (0–100%).
       ========================================================= */
    /* The model is now trained on daily check-ins, so the signals the
       user types go straight to the scorer with no scale change.
       Older bundles that were trained on weekly hours can still be
       loaded — see legacyHoursScale() below. */
    function signalsForModel(s) { return s; }

    /* CSV rescoring shim — defaults missing meta (feeling, tracker chips).
       Live wizard flows always call calculateBurnoutRisk(...) directly. */
    function heuristicRisk(s, events) {
      const evArr = events instanceof Set ? [...events] : [...(events || [])];
      const r = calculateBurnoutRisk(s, [], {
        feeling: 'managing',
        events: evArr,
      });
      return r.scorePct / 100;
    }

    function clampRisk(x, lo, hi) {
      return Math.max(lo, Math.min(hi, x));
    }

    /**
     * Hybrid burnout risk — sensitive to severe combinations, trends,
     * and baseline drift. Protective factors are capped so they cannot
     * erase crisis-level signals.
     *
     * @param {object} inputs Wizard signals (hours, sleep, mood 1–10, …)
     * @param {Array<{signals:object}>} history Newest-first past entries
     * @param {object} [meta]
     * @param {string} [meta.feeling] 'fine' | 'managing' | 'burned'
     * @param {string[]|Set} [meta.events] User-facing chip keys
     * @param {object} [meta.trackerToday] Daily category answers for today
     */
    function calculateBurnoutRisk(inputs, history, meta) {
      meta = meta || {};
      const feeling = meta.feeling || 'managing';
      const chips = new Set(
        Array.isArray(meta.events) ? meta.events
          : meta.events instanceof Set ? [...meta.events]
          : []
      );
      const tracker = meta.trackerToday && typeof meta.trackerToday === 'object'
        ? meta.trackerToday : {};

      const mood = clampRisk(+inputs.mood || 5, 1, 10);
      const stress = clampRisk(+inputs.stress || 5, 1, 10);
      const deadline = clampRisk(+inputs.deadline_pressure || 5, 1, 10);
      const mgr = clampRisk(+inputs.mgr_support || 5, 1, 10);
      const peer = clampRisk(+inputs.peer_support || 5, 1, 10);
      const hours = clampRisk(+inputs.hours ?? 8, 0, 16);
      const sleepH = clampRisk(+inputs.sleep ?? 7, 2, 14);
      const onCall = +inputs.on_call_load || 0;

      const modelEv = eventsForModel(chips);

      const overwhelmChip =
        chips.has('overwhelm') || chips.has('work_stress')
        || chips.has('exams') || chips.has('bad_sleep');
      const overwhelmBool = stress >= 8 || overwhelmChip;

      const workloadIntensity = clampRisk(
        (hours / 16) * 0.42 + ((deadline - 1) / 9) * 0.58,
        0, 1,
      );

      const poorSleep = sleepH <= 5;
      const veryPoorSleep = sleepH <= 4;

      const focusStruggle = mood <= 4 && stress >= 7;

      function trBad(key, badVals) {
        const v = tracker[key];
        return !!(v && badVals.includes(v));
      }

      /* ---------- Severe domains (count once each; capped at 8) ---------- */
      const domains = [];
      if (stress >= 8) domains.push({ key: 'stress_high', label: 'stress is very high' });
      if (mood <= 3) domains.push({ key: 'mood_low', label: 'mood and energy are very low' });
      if (poorSleep) domains.push({ key: 'sleep_hours', label: 'sleep hours have been short' });
      if (overwhelmBool) domains.push({ key: 'overwhelm', label: 'you feel overwhelmed' });
      if (deadline >= 8 && hours >= 10) {
        domains.push({ key: 'load', label: 'workload volume is very heavy' });
      }
      if (focusStruggle) domains.push({ key: 'focus', label: 'focus has been difficult under strain' });
      if (feeling === 'burned') domains.push({ key: 'feeling_burned', label: 'you described feeling burned out' });

      if (trBad('energy', ['Drained', 'Low'])) {
        domains.push({ key: 'tr_energy', label: 'energy was low in today\'s brief log' });
      }
      if (trBad('overwhelm', ['Stressed', 'Overwhelmed'])) {
        domains.push({ key: 'tr_over', label: 'pressure felt high in today\'s brief log' });
      }
      if (trBad('motivation', ['Very difficult', 'Difficult'])) {
        domains.push({ key: 'tr_mot', label: 'motivation has been hard to find' });
      }
      if (trBad('sleepQuality', ['Poor'])) {
        domains.push({ key: 'tr_sleepq', label: 'sleep quality was poor today' });
      }
      if (trBad('workStudyPressure', ['High', 'Extreme'])) {
        domains.push({ key: 'tr_press', label: 'study/work pressure spiked today' });
      }

      /* Dedupe by key */
      const domMap = new Map();
      for (const d of domains) domMap.set(d.key, d.label);
      const severeCount = domMap.size;

      /* ---------- Baseline layer (0–100), NOT a plain average ---------- */
      let baseline =
        Math.pow((stress - 1) / 9, 1.35) * 38
        + Math.pow((11 - mood) / 10, 1.25) * 30;

      if (sleepH <= 4) baseline += 26;
      else if (sleepH <= 5) baseline += 18;
      else if (sleepH <= 6) baseline += 10;
      else if (sleepH >= 8) baseline -= 4;

      baseline += workloadIntensity * 22;

      baseline += Math.pow((deadline - 1) / 9, 1.2) * 6;

      if (modelEv.has('deadline_crunch')) baseline += 7;
      if (modelEv.has('personal_shock')) baseline += 9;
      if (modelEv.has('reorg')) baseline += 6;
      if (modelEv.has('layoff')) baseline += 14;

      if (onCall >= 1.1) baseline += 10;
      else if (onCall >= 0.55) baseline += 5;

      if (feeling === 'burned') baseline += 18;
      else if (feeling === 'managing') baseline += 3;

      /* ---------- Combo multipliers (dangerous intersections) ---------- */
      let comboBoost = 1;
      if (stress >= 8 && mood <= 3) comboBoost *= 1.45;
      if (stress >= 8 && veryPoorSleep && overwhelmBool) comboBoost *= 1.38;
      if (poorSleep && workloadIntensity >= 0.55 && stress >= 7) comboBoost *= 1.22;
      if (mood <= 4 && mgr <= 4 && peer <= 4) comboBoost *= 1.12;

      baseline *= comboBoost;

      /* ---------- Trend vs personal baseline (recent history) ---------- */
      const hist = Array.isArray(history) ? history.slice(0, 28) : [];
      const pastSignals = hist.map(h => h.signals || h).filter(Boolean);

      let trendBoost = 0;
      const histReasons = [];

      if (pastSignals.length >= 3) {
        const avg = (pick) => mean(pastSignals.slice(0, 12).map(pick));
        const avgStress = avg(s => +s.stress || 5);
        const avgMood = avg(s => +s.mood || 5);
        const avgSleep = avg(s => +s.sleep || 7);

        if (stress >= avgStress + 2) {
          trendBoost += 10;
          histReasons.push('stress is higher than your recent usual');
        }
        if (mood <= avgMood - 2) {
          trendBoost += 10;
          histReasons.push('mood is lower than your recent usual');
        }
        if (sleepH <= avgSleep - 1.25) {
          trendBoost += 8;
          histReasons.push('sleep is worse than your recent usual');
        }

        const slopeS = slope(pastSignals.slice(0, 7).map(s => +s.stress || 5).reverse());
        const slopeM = slope(pastSignals.slice(0, 7).map(s => +s.mood || 5).reverse());
        if (slopeS > 0.35 && stress >= 7) {
          trendBoost += 8;
          histReasons.push('stress has been climbing over recent check-ins');
        }
        if (slopeM < -0.35 && mood <= 5) {
          trendBoost += 8;
          histReasons.push('mood has been slipping over recent check-ins');
        }
      }

      baseline += trendBoost;

      /* ---------- Protective layer (soft cap) ---------- */
      let protective =
        clampRisk((mgr - 5) / 5, 0, 1) * 5
        + clampRisk((peer - 5) / 5, 0, 1) * 4;

      if (modelEv.has('pto')) protective += 7;

      const hydrationGood = tracker.hydration === 'Good';
      const movementGood = tracker.movement === 'Active';
      const breaksEnough = tracker.breaks === 'Enough';
      if (hydrationGood) protective += 2;
      if (movementGood) protective += 3;
      if (breaksEnough) protective += 2;

      const protectCap = baseline >= 52 ? 10 : 16;
      baseline -= Math.min(protectCap, protective);

      let score = clampRisk(baseline, 0, 100);

      /* ---------- Minimum floors (cannot average away crisis) ---------- */
      const floors = [];

      if (stress >= 8 && mood <= 3) {
        floors.push(65);
        histReasons.push('high stress paired with very low energy');
      }
      if (stress >= 8 && sleepH <= 4 && overwhelmBool) {
        floors.push(75);
      }
      if (severeCount >= 3) floors.push(70);
      if (feeling === 'burned' && stress >= 7 && mood <= 4) {
        floors.push(82);
      }

      /* Extreme exhaustion / cannot function */
      if ((feeling === 'burned' && mood <= 2 && stress >= 8)
          || (mood <= 2 && stress >= 9 && poorSleep)) {
        floors.push(92);
      }

      /* Repeated severe days from stored risk history */
      let severeRun = 0;
      for (const e of hist) {
        const r = typeof e.risk === 'number' ? e.risk : null;
        if (r != null && r >= 0.70) severeRun++;
        else break;
      }
      if (severeRun >= 2 && severeCount >= 2) floors.push(80);

      const floorVal = floors.length ? Math.max(...floors) : 0;
      if (floorVal > 0) score = Math.max(score, floorVal);

      /* ---------- Reasons narrative ---------- */
      const topReasons = [];

      if (stress >= 7) topReasons.push('stress is elevated');
      if (mood <= 4) topReasons.push('energy / mood is depleted');
      if (poorSleep) topReasons.push('sleep has been short');
      if (workloadIntensity >= 0.5 || deadline >= 8) topReasons.push('workload pressure is high');
      if (overwhelmBool) topReasons.push('overwhelm is present');

      for (const hr of histReasons) {
        if (!topReasons.includes(hr)) topReasons.push(hr);
      }

      if (severeRun >= 2 && score >= 55) {
        topReasons.push('several consecutive high-risk days');
      }

      /* Dedupe while preserving order */
      const seen = new Set();
      const uniqReasons = [];
      for (const t of topReasons) {
        if (!seen.has(t)) { seen.add(t); uniqReasons.push(t); }
      }

      let explain = '';
      if (uniqReasons.length > 0 && score >= 31) {
        explain =
          'Your risk increased because ' +
          uniqReasons.slice(0, 4).join(', ') + '.';
      } else if (score >= 56) {
        explain =
          'Several strain signals came together today — worth slowing down.';
      } else {
        explain =
          'Overall strain looks manageable right now — keep checking in.';
      }

      /* ---------- Tier + advice ---------- */
      const roundedScore = Math.round(score);
      const vObj = verdict(roundedScore / 100);

      let recommendedAction;
      let safetyNetSuggested;

      if (roundedScore <= 30) {
        recommendedAction =
          'Maintain routines that help you recover; small habits compound.';
        safetyNetSuggested = false;
      } else if (roundedScore <= 55) {
        recommendedAction =
          'Schedule real breaks, protect sleep, and lighten one obligation if you can.';
        safetyNetSuggested = false;
      } else if (roundedScore <= 75) {
        recommendedAction =
          'Tell someone you trust how you are doing, cut non-essential load this week, '
          + 'and consider professional support if this persists.';
        safetyNetSuggested = true;
      } else {
        recommendedAction =
          'Prioritize safety: reach out to a trusted contact or crisis line now, '
          + 'rest aggressively, and seek urgent professional help if you feel unsafe.';
        safetyNetSuggested = true;
      }

      return {
        scorePct: roundedScore,
        scoreProb: clampRisk(roundedScore / 100, 0, 1),
        riskLevel: vObj.label,
        verdict: vObj,
        topReasons: uniqReasons.slice(0, 6),
        explain,
        recommendedAction,
        safetyNetSuggested,
        severeDomains: [...domMap.entries()].map(([k, label]) => ({ key: k, label })),
        severeCount,
        floorsApplied: floors.length ? floorVal : null,
      };
    }

    function sigmoid(z) { return 1 / (1 + Math.exp(-Math.max(-30, Math.min(30, z)))); }
    function walkTree(node, x) {
      while (!node.l) { node = x[node.f] <= node.t ? node.L : node.R; }
      return node.v;
    }
    function gbtPredict(gbt, x) {
      let F = gbt.init_log_odds;
      for (const tree of gbt.trees) F += gbt.learning_rate * walkTree(tree, x);
      return sigmoid(F);
    }
    function lrPredict(lr, xStd) {
      let z = lr.bias;
      for (let i = 0; i < lr.weights.length; i++) z += lr.weights[i] * xStd[i];
      return sigmoid(z);
    }
    function plattApply(platt, p) {
      const c = Math.min(1 - 1e-6, Math.max(1e-6, p));
      const s = Math.log(c / (1 - c));
      return sigmoid(platt.a * s + platt.b);
    }
    const FEATURE_RAW_COLS = ["hours", "sleep", "mood", "stress",
                              "mgr_support", "peer_support",
                              "deadline_pressure", "on_call_load"];

    /* Detect whether the loaded bundle was trained on daily data
       (uses *_ma7 features and days_since_pto) or the legacy weekly
       data (uses *_ma4 / *_ma12 and weeks_since_pto). The web app
       supports both so old bundles keep working. */
    function bundleSchema(featureCols) {
      const set = new Set(featureCols);
      if (set.has("hours_ma7") || set.has("days_since_pto")) {
        return { kind: "daily",  short: 7,  long: 28,  evWin: 14,
                 ptoFeat: "days_since_pto", ptoCap: 60,
                 evSuffix: "14d", hoursScale: 1 };
      }
      return   { kind: "weekly", short: 4,  long: 12,  evWin: 4,
                 ptoFeat: "weeks_since_pto", ptoCap: 12,
                 evSuffix: "4w",  hoursScale: 5 };
    }

    function mean(arr) {
      return arr.length ? arr.reduce((a,b) => a + b, 0) / arr.length : 0;
    }
    function stddev(arr) {
      if (arr.length < 2) return 0;
      const m = mean(arr);
      return Math.sqrt(arr.reduce((s,v) => s + (v - m)**2, 0) / (arr.length - 1));
    }
    function slope(arr) {
      const n = arr.length;
      if (n < 2) return 0;
      const xm = (n - 1) / 2;
      const ym = mean(arr);
      let num = 0, den = 0;
      for (let i = 0; i < n; i++) {
        num += (i - xm) * (arr[i] - ym);
        den += (i - xm) ** 2;
      }
      return den === 0 ? 0 : num / den;
    }

    /* Build the feature row the model expects.
       `history` = past daily check-ins for THIS user, newest first,
       same shape as entries in `entry.signals` (plus `events: [..]`).
       The current check-in (`raw` + `eventSet`) is appended as the
       most recent day. */
    function buildFeatureRow(featureCols, raw, eventSet, history) {
      const schema = bundleSchema(featureCols);
      // Newest-first -> oldest-first, then append today.
      const seq = (history || []).slice().reverse().map(h => ({
        signals: h.signals || h,
        events:  new Set(h.events || []),
      }));
      seq.push({ signals: raw, events: eventSet });

      // Legacy weekly bundle wants hours scaled up to weekly totals.
      const scaleHours = (v) => schema.hoursScale === 1 ? +v : +v * schema.hoursScale;

      const N = seq.length;
      const windowOf = (n) => seq.slice(Math.max(0, N - n), N);
      const valsIn = (rows, col) => rows.map(r => {
        const v = +r.signals[col];
        return col === "hours" ? scaleHours(v) : v;
      });
      const eventsHad = (rows, ev) => rows.some(r => r.events.has(ev));

      const today = seq[N - 1];
      const out = {};
      for (const c of FEATURE_RAW_COLS) {
        out[c] = c === "hours" ? scaleHours(today.signals[c]) : +today.signals[c];
      }

      // Rolling means.
      const shortWin = windowOf(schema.short);
      const longWin  = windowOf(schema.long);
      for (const c of FEATURE_RAW_COLS) {
        out[`${c}_ma${schema.short}`] = mean(valsIn(shortWin, c));
        out[`${c}_ma${schema.long}`]  = mean(valsIn(longWin,  c));
      }

      // Deltas (today minus short-window mean).
      for (const c of ["hours", "stress", "sleep", "mood", "deadline_pressure"]) {
        out[`${c}_delta${schema.short}`] = out[c] - out[`${c}_ma${schema.short}`];
      }

      // Volatility + slope over the short window.
      for (const c of ["hours", "stress", "sleep", "mood"]) {
        out[`${c}_std${schema.short}`] = stddev(valsIn(shortWin, c));
      }
      for (const c of ["hours", "stress"]) {
        out[`${c}_slope${schema.short}`] = slope(valsIn(shortWin, c));
      }

      // Event recency: did this event fire in the recency window?
      const evWindow = windowOf(schema.evWin);
      out[`had_layoff_${schema.evSuffix}`]   = eventsHad(evWindow, "layoff")          ? 1 : 0;
      out[`had_reorg_${schema.evSuffix}`]    = eventsHad(evWindow, "reorg")           ? 1 : 0;
      out[`had_deadline_${schema.evSuffix}`] = eventsHad(evWindow, "deadline_crunch") ? 1 : 0;

      // PTO recency: scan history backwards for the last "pto" event.
      let sincePTO = schema.ptoCap;
      for (let i = N - 1; i >= 0; i--) {
        if (seq[i].events.has("pto")) {
          sincePTO = Math.min(schema.ptoCap, N - 1 - i);
          break;
        }
      }
      out[schema.ptoFeat] = sincePTO;

      // Interactions — scaled for whichever schema the bundle expects.
      if (schema.kind === "daily") {
        out["hours_x_stress"]       = (out.hours * out.stress) / 20;
        out["low_sleep_high_hours"] = Math.max(0, out.hours - 10) * Math.max(0, 7 - out.sleep);
      } else {
        out["hours_x_stress"]       = (out.hours * out.stress) / 100;
        out["low_sleep_high_hours"] = Math.max(0, out.hours - 50) * Math.max(0, 7 - out.sleep);
      }

      return featureCols.map(c => out[c] === undefined ? 0 : out[c]);
    }
    function realModelScore(bundle, raw, eventSet, history) {
      const x = buildFeatureRow(bundle.feature_cols, raw, eventSet, history);
      const mu = bundle.standardization.mu;
      const sigma = bundle.standardization.sigma;
      const xStd = x.map((v, i) => (v - mu[i]) / sigma[i]);
      const p_lr  = lrPredict(bundle.logreg, xStd);
      const p_gbt_raw = gbtPredict(bundle.gbt, x);
      const p_gbt_cal = bundle.platt ? plattApply(bundle.platt, p_gbt_raw) : p_gbt_raw;
      return {
        logreg: p_lr, gbt_raw: p_gbt_raw, gbt_calibrated: p_gbt_cal,
        ensemble_mean: (p_lr + p_gbt_cal) / 2,
        x, xStd,
      };
    }
    function realModelDrivers(bundle, scoreOutput) {
      const w = bundle.logreg.weights;
      const cols = bundle.feature_cols;
      const xStd = scoreOutput.xStd;
      const PRETTY = {
        hours: "Hours today", sleep: "Sleep last night",
        mood: "Mood", stress: "Stress",
        mgr_support: "Manager support", peer_support: "Peer support",
        deadline_pressure: "Workload pressure", on_call_load: "On-call load",
        // Daily-bundle features
        hours_ma7:  "Hours (7-day avg)",  hours_ma28: "Hours (28-day avg)",
        stress_ma7: "Stress (7-day avg)", stress_ma28: "Stress (28-day avg)",
        sleep_ma7:  "Sleep (7-day avg)",  sleep_ma28: "Sleep (28-day avg)",
        mood_ma7:   "Mood (7-day avg)",   mood_ma28:   "Mood (28-day avg)",
        hours_delta7: "Hours vs 7-day avg",
        stress_delta7: "Stress vs 7-day avg",
        sleep_delta7:  "Sleep vs 7-day avg",
        mood_delta7:   "Mood vs 7-day avg",
        deadline_pressure_delta7: "Workload vs 7-day avg",
        hours_std7:  "Hours volatility",
        stress_std7: "Stress volatility",
        hours_slope7: "Hours trend",
        stress_slope7: "Stress trend",
        had_layoff_14d:   "Recent layoff",
        had_reorg_14d:    "Recent reorg",
        had_deadline_14d: "Recent deadline crunch",
        days_since_pto: "Days since PTO",
        // Legacy weekly bundle features (kept so older bundles still label)
        hours_ma4: "Hours (4-week avg)",  hours_ma12: "Hours (12-week avg)",
        stress_ma4: "Stress (4-week avg)", stress_ma12: "Stress (12-week avg)",
        sleep_ma4: "Sleep (4-week avg)",  sleep_ma12: "Sleep (12-week avg)",
        mood_ma4: "Mood (4-week avg)",    mood_ma12: "Mood (12-week avg)",
        had_layoff_4w: "Recent layoff",   had_reorg_4w: "Recent reorg",
        had_deadline_4w: "Recent deadline crunch",
        weeks_since_pto: "Weeks since PTO",
        hours_x_stress: "Hours × stress",
        low_sleep_high_hours: "Low-sleep + high-hours combo",
      };
      const contribs = w.map((wi, i) => ({
        key: cols[i], label: PRETTY[cols[i]] || cols[i],
        c: wi * xStd[i],
      }));
      return contribs.filter(d => Math.abs(d.c) > 0.10)
                     .sort((a, b) => Math.abs(b.c) - Math.abs(a.c))
                     .slice(0, 5);
    }
    function heuristicDrivers(s, events) {
      const E = events instanceof Set ? events : new Set(events || []);
      const items = [
        { key: 'hours',             label: 'Long hours',           c:  (s.hours - 40) / 12 },
        { key: 'sleep',             label: 'Low sleep',            c: -(s.sleep - 6) / 2 * 0.6 },
        { key: 'stress',            label: 'High stress',          c:  (s.stress - 5) / 3 },
        { key: 'mood',              label: 'Low mood',             c: -(s.mood - 6) / 4 },
        { key: 'deadline_pressure', label: 'Deadline pressure',    c:  (s.deadline_pressure - 4) / 3 },
        { key: 'mgr_support',       label: 'Manager support',      c: -(s.mgr_support - 6) / 4 * 0.6 },
        { key: 'peer_support',      label: 'Peer support',         c: -(s.peer_support - 6) / 5 * 0.6 },
        { key: 'on_call_load',      label: 'On-call load',         c:  0.5 * s.on_call_load },
      ];
      if (E.has('layoff'))          items.push({ key: 'ev_lay', label: 'Recent layoff',         c:  0.8 });
      if (E.has('reorg'))           items.push({ key: 'ev_reo', label: 'Recent reorg',          c:  0.5 });
      if (E.has('deadline_crunch')) items.push({ key: 'ev_dl',  label: 'Recent deadline crunch',c:  0.4 });
      if (E.has('personal_shock'))  items.push({ key: 'ev_ps',  label: 'Personal shock',        c:  0.5 });
      if (E.has('pto'))             items.push({ key: 'ev_pto', label: 'Recent PTO',            c: -0.9 });
      if (E.has('recognition'))     items.push({ key: 'ev_rec', label: 'Recent recognition',    c: -0.3 });
      return items.filter(d => Math.abs(d.c) > 0.15)
                  .sort((a, b) => Math.abs(b.c) - Math.abs(a.c))
                  .slice(0, 5);
    }

    function verdict(pProb) {
      const pct = Math.round(Math.max(0, Math.min(1, pProb || 0)) * 100);
      if (pct <= 30) return {
        label: 'Low',
        key: 'low',
        color: 'var(--risk-low)',
        note: 'Patterns look steadier — keep nurturing recovery.',
      };
      if (pct <= 55) return {
        label: 'Moderate',
        key: 'elev',
        color: 'var(--risk-elev)',
        note: 'Worth tuning recovery before things snowball.',
      };
      if (pct <= 75) return {
        label: 'High',
        key: 'high',
        color: 'var(--risk-high)',
        note: 'Serious strain — treat recovery as the main priority.',
      };
      return {
        label: 'Critical',
        key: 'severe',
        color: 'var(--risk-severe)',
        note: 'Crisis-level strain — please reach out for immediate support.',
      };
    }

    /* =========================================================

       personId so it round-trips through the CSV pipeline that

    const BUNDLE_SOURCE_META_KEY = 'wellcare_bundle_source_meta';

    const CHECKIN_SECTIONS = [

    // Per-option heuristic risk influence. Used only to nudge the
    // dashboard's "today's check-in" preview; the trained ML model

    function todayKey() { return new Date().toISOString().slice(0,10); }

    function loadTracker() { return loadJson(TRACKER_KEY, {}); }
    function saveTracker(t) { saveJson(TRACKER_KEY, t); }

    function getTrackerToday(personId) {
      const all = loadTracker();
      const day = all[personId] && all[personId][todayKey()];
      // Only keep recognised fields — old numeric habit data is ignored.
      const next = {};
      if (day && typeof day === 'object') {
        for (const k of Object.keys(CHECKIN_DELTA)) {
          if (typeof day[k] === 'string') next[k] = day[k];
        }
      }
      return next;
    }

    function setTrackerToday(personId, next) {
      const all = loadTracker();
      if (!all[personId]) all[personId] = {};
      all[personId][todayKey()] = next;
      saveTracker(all);
    }

    // Sum of heuristic deltas across all selected categories for today.
    function trackerDelta(today) {
      let sum = 0;
      if (today && typeof today === 'object') {
        for (const [k, v] of Object.entries(today)) {
          const map = CHECKIN_DELTA[k];
          if (map && Object.prototype.hasOwnProperty.call(map, v)) sum += map[v];
        }
      }
      return Math.max(-0.15, Math.min(0.15, sum));
    }

    function loadHistory() {
      try {
        const v2 = JSON.parse(localStorage.getItem(STORAGE_KEY));
        if (Array.isArray(v2)) return v2;

        if (Array.isArray(v1)) return v1.map(e => ({ ...e, person_id: 'me', notes: '' }));
      } catch {}
      return [];
    }
    function saveHistory(h) {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(h)); } catch {}

    function loadStr(key, dflt) {

    function applyTheme(theme) {

    /* =========================================================
       PIN hashing (Web Crypto). Optional per profile.
       ========================================================= */
    function hexFromBytes(arr) {
      return Array.from(arr).map(b => b.toString(16).padStart(2,'0')).join('');
    }
    function genSalt() {
      const arr = new Uint8Array(16);
      crypto.getRandomValues(arr);
      return hexFromBytes(arr);
    }
    async function hashPin(pin, salt) {
      const data = new TextEncoder().encode(salt + ':' + pin);
      const buf  = await crypto.subtle.digest('SHA-256', data);
      return hexFromBytes(new Uint8Array(buf));
    }
    function genProfileId() {
      const arr = new Uint8Array(8);
      crypto.getRandomValues(arr);
      return 'p_' + hexFromBytes(arr);
    }

    /* Sage-anchored deterministic color per profile/name. */
    const AVATAR_COLORS = [
      '#3F6B3A', '#4D7A4A', '#5B8E63', '#6BA15F', '#7AAD73',
      '#8FA265', '#A89F4F', '#C68F2A', '#C77450', '#B5562B',
      '#7B7F8C', '#5F8294',
    ];
    function colorFor(s) {
      let h = 0;
      const str = String(s || '');
      for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) >>> 0;
      return AVATAR_COLORS[h % AVATAR_COLORS.length];
    }
    function initialsOf(name) {
      const parts = String(name || '').trim().split(/\s+/);
      if (parts.length === 0) return '?';
      if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
      return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
    }

    /* =========================================================
       Migration: if we have history but no profiles, seed
       profiles from the unique person_id values so existing
       data isn't orphaned.
       ========================================================= */
    function loadProfiles() {
      // No auto-seeding from history. The login screen is the gate: until
      // the user has either signed up or signed in, they can't see anything.
      // Old history rows stay in localStorage; they become visible again
      // automatically if the user signs up with a name whose personId
      // matches their historical person_id.
      const stored = loadJson(PROFILES_KEY, null);
      if (!Array.isArray(stored)) return [];
      // Migrate legacy PIN-only profiles to the email + password schema.
      // Old PINs become the password; the synthesized email is just so the
      // user has something to type at the sign-in screen. If they don't
      // remember any of this, the "Start fresh" link wipes everything.
      let dirty = false;
      const migrated = stored.map(p => {
        const next = { ...p };
        if (!next.passwordHash && next.pinHash) {
          next.passwordHash = next.pinHash;
          dirty = true;
        }
        if (!next.email && next.name) {
          next.email = `${(next.personId || next.name)
            .toLowerCase().replace(/[^a-z0-9]+/g, '')}@local`;
          dirty = true;
        }
        return next;
      });
      if (dirty) saveJson(PROFILES_KEY, migrated);
      return migrated;
    }

    /* =========================================================
       Dates / insights / CSV / reminders — same as before
       ========================================================= */
    function mondayOf(d) {
      const m = new Date(d);
      const day = (m.getDay() + 6) % 7;
      m.setDate(m.getDate() - day);
      m.setHours(0, 0, 0, 0);
      return m;
    }
    function isoDate(d) { return mondayOf(d).toISOString().slice(0, 10); }
    function todayLabel() {
      return new Date().toLocaleDateString(undefined,
        { weekday: 'long', month: 'long', day: 'numeric' });
    }
    function shortDate(iso) {
      return new Date(iso).toLocaleDateString(undefined,
        { month: 'short', day: 'numeric', year: 'numeric' });
    }
    function relWeek(iso) {
      const wk = mondayOf(new Date(iso));
      const now = mondayOf(new Date());
      const days = Math.round((now - wk) / 86400e3);
      if (days < 7)  return 'This week';
      if (days < 14) return 'Last week';
      const weeks = Math.round(days / 7);
      return `${weeks} weeks ago`;
    }
    function relDay(iso) {
      const d = new Date(iso); d.setHours(0,0,0,0);
      const now = new Date(); now.setHours(0,0,0,0);
      const days = Math.round((now - d) / 86400e3);
      if (days <= 0) return 'Today';
      if (days === 1) return 'Yesterday';
      if (days < 7)  return `${days} days ago`;
      return relWeek(iso);
    }
    const DOWS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

    function uniqueWeekKeys(history) {
      return [...new Set(history.map(e => isoDate(new Date(e.when))))];
    }
    function computeStreak(history) {
      if (history.length === 0) return 0;
      const sorted = [...new Set(history.map(e =>
        mondayOf(new Date(e.when)).getTime()
      ))].sort((a, b) => b - a);
      let streak = 1;
      for (let i = 1; i < sorted.length; i++) {
        if (sorted[i - 1] - sorted[i] === 7 * 86400e3) streak++;
        else break;
      }
      return streak;
    }

    function buildInsights(personHist, latest) {
      if (!latest) return [];
      const out = [];
      const recent = personHist.slice(0, 12);
      const risks  = recent.map(e => e.risk);

      let elevStreak = 0;
      for (const e of personHist) {
        if (e.risk >= 0.56) elevStreak++; else break;
      }
      if (elevStreak >= 3) {
        out.push({ kind: 'bad', text:
          `${elevStreak} check-ins in a row at high strain or higher.` });
      } else if (elevStreak === 2) {
        out.push({ kind: 'warn', text: `Second consecutive day at high strain or higher.` });
      }

      if (personHist.length >= 4) {
        const pastStress = personHist.slice(1).map(e => e.signals.stress);
        if (latest.signals.stress > Math.max(...pastStress)) {
          out.push({ kind: 'bad', text:
            `Highest stress in ${personHist.length - 1} weeks of tracking.` });
        }
        const pastSleep = personHist.slice(1).map(e => e.signals.sleep);
        if (latest.signals.sleep < Math.min(...pastSleep)) {
          out.push({ kind: 'bad', text:
            `Lowest sleep in ${personHist.length - 1} weeks.` });
        }
      }

      if (personHist.length >= 8) {
        const a = risks.slice(0, 4).reduce((s,v)=>s+v,0)/4;
        const b = personHist.slice(4, 8).reduce((s,e)=>s+e.risk,0)/4;
        const delta = a - b;
        if (delta >= 0.10) {
          out.push({ kind: 'warn', text:
            `Risk trending up: last 4 weeks averaged ${(a*100).toFixed(0)}%, ` +
            `previous 4 averaged ${(b*100).toFixed(0)}%.` });
        } else if (delta <= -0.10) {
          out.push({ kind: 'good', text:
            `Risk trending down: last 4 weeks averaged ${(a*100).toFixed(0)}%, ` +
            `down from ${(b*100).toFixed(0)}%.` });
        }
      }

      const ptoIdx = personHist.findIndex(e => e.events.includes('pto'));
      if (ptoIdx >= 8) {
        out.push({ kind: 'warn', text: `${ptoIdx}+ weeks since you logged PTO.` });
      } else if (ptoIdx === -1 && personHist.length >= 8) {
        out.push({ kind: 'warn', text: `No PTO logged in the last ${personHist.length} weeks.` });
      }

      if (out.length === 0 && personHist.length >= 4) {
        out.push({ kind: 'good', text:
          `Steady week. Nothing unusual vs your last ${personHist.length - 1} weeks.` });
      }
      return out.slice(0, 4);
    }

    /* CSV — one row per daily check-in. `date` is the calendar day
       of the entry; `week_start` is kept as the Monday-of-week alias so
       older versions of load_real.py / train_real.py still parse it.

       Two events columns are written:
         - `events`        : model-vocabulary events (deadline_crunch,
                             personal_shock, pto, ...) so train_real.py
                             can compute rolling event features
                             unchanged.
         - `events_chips`  : the original user-facing chip keys
                             (exams, family, health, ...) so future
                             analysis can drill into the human-friendly
                             vocabulary. */
    const EXPORT_COLS = [
      'person_id', 'team_id', 'date', 'week_start', 'submitted_at',
      'hours', 'sleep', 'mood', 'stress',
      'mgr_support', 'peer_support', 'deadline_pressure', 'on_call_load',
      'events', 'events_chips', 'burnout', 'feeling',
      'risk_percent', 'verdict', 'notes',
    ];
    const FEELING_TO_BURNOUT = { fine: 0, managing: 0, burned: 1 };
    function csvEscape(v) {
      const s = v == null ? '' : String(v);
      return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
    }
    function exportCsv(history) {
      const rows = history.map(e => ({
        person_id:    e.person_id || 'me',
        team_id:      e.person_id || 'me',
        date:         new Date(e.when).toISOString().slice(0, 10),
        week_start:   isoDate(new Date(e.when)),
        submitted_at: e.when,
        hours: e.signals.hours, sleep: e.signals.sleep,
        mood:  e.signals.mood,  stress: e.signals.stress,
        mgr_support: e.signals.mgr_support,
        peer_support: e.signals.peer_support,
        deadline_pressure: e.signals.deadline_pressure,
        on_call_load: e.signals.on_call_load,
        events: [...eventsForModel(new Set(e.events || []))].join('|'),
        events_chips: (e.events || []).join('|'),
        burnout: FEELING_TO_BURNOUT[e.feeling] ?? 0,
        feeling: e.feeling,
        risk_percent: (e.risk * 100).toFixed(1),
        verdict: e.verdict,
        notes: e.notes || '',
      }));
      return [
        EXPORT_COLS.join(','),
        ...rows.map(r => EXPORT_COLS.map(c => csvEscape(r[c])).join(',')),
      ].join('\n');
    }
    function parseCsvLine(line) {
      const out = []; let cur = '', q = false;
      for (let i = 0; i < line.length; i++) {
        const c = line[i];
        if (q) {
          if (c === '"' && line[i + 1] === '"') { cur += '"'; i++; }
          else if (c === '"') q = false;
          else cur += c;
        } else {
          if (c === ',') { out.push(cur); cur = ''; }
          else if (c === '"' && cur === '') q = true;
          else cur += c;
        }
      }
      out.push(cur);
      return out;
    }
    function parseCsv(text) {
      const lines = text.split(/\r?\n/).filter(l => l.trim().length);
      if (lines.length < 2) return [];
      const header = parseCsvLine(lines[0]).map(h => h.trim());
      return lines.slice(1).map(line => {
        const cells = parseCsvLine(line);
        const row = {};
        header.forEach((h, i) => row[h] = cells[i]);
        return row;
      });
    }
    function importCsv(text, existing, scorer) {
      const rows = parseCsv(text);
      let added = 0, skipped = 0;
      const known = new Set(existing.map(e => `${e.person_id}|${e.when}`));
      const next = [...existing];
      const now = Date.now();
      rows.forEach((r, i) => {
        const when = r.submitted_at || r.when ||
                     (r.date ? new Date(r.date).toISOString() : null) ||
                     (r.week_start ? new Date(r.week_start).toISOString() : null);
        if (!when) { skipped++; return; }
        const person_id = (r.person_id || 'me').trim() || 'me';
        if (known.has(`${person_id}|${when}`)) { skipped++; return; }
        const num = (k, d) => {
          const v = parseFloat(r[k]);
          return Number.isFinite(v) ? v : d;
        };
        const signals = {
          hours: num('hours', 8), sleep: num('sleep', 7),
          mood: num('mood', 7), stress: num('stress', 5),
          mgr_support: num('mgr_support', 7),
          peer_support: num('peer_support', 7),
          deadline_pressure: num('deadline_pressure', 4),
          on_call_load: num('on_call_load', 0),
        };
        // Prefer the human-friendly `events_chips` column if it's
        // present (newer exports). Fall back to the model-vocabulary
        // `events` column for older / external CSVs.
        const eventsRaw = (r.events_chips || r.events || '')
          .split('|').map(s => s.trim()).filter(Boolean);
        const events = eventsRaw;
        const feeling = r.feeling || (parseInt(r.burnout) === 1 ? 'burned' : 'managing');
        const eventSet = new Set(events);
        const priorNewestFirst = next
          .filter(e =>
            e.person_id === person_id
            && new Date(e.when).getTime() < new Date(when).getTime())
          .sort((a, b) => new Date(b.when) - new Date(a.when))
          .slice(0, 28);
        const risk = scorer(signals, eventSet, feeling, priorNewestFirst);
        next.push({
          id: now + i, when, person_id, signals, events, feeling,
          notes: r.notes || '',
          risk, verdict: verdict(risk).label,
        });
        known.add(`${person_id}|${when}`);
        added++;
      });
      next.sort((a, b) => new Date(b.when) - new Date(a.when));
      return { history: next, added, skipped };
    }

    /* Reminders — fire once per day. */
    async function maybeRemind(history, dow, personId) {
      if (dow == null || dow === '') return;
      if (!('Notification' in window)) return;
      if (Notification.permission !== 'granted') return;
      const today = new Date();
      if (today.getDay() !== parseInt(dow)) return;
      const todayIso = today.toISOString().slice(0, 10);
      const hasToday = history.some(e =>
        e.person_id === personId
        && new Date(e.when).toISOString().slice(0, 10) === todayIso);
      if (hasToday) return;
      const todayKey = today.toDateString();
      if (sessionStorage.getItem('reminded_' + todayKey)) return;
      sessionStorage.setItem('reminded_' + todayKey, '1');
      try {
        new Notification("WellCare check-in", {
          body: "Two minutes today saves a tough day later. Tap to log how you're doing.",
          tag: "wellcare-checkin-daily",
        });
      } catch {}
    }

    /* =========================================================
       Static config
       ========================================================= */
    // Daily-scale defaults: `hours` is hours worked TODAY (0–16) and
    // `sleep` is hours slept LAST NIGHT. The trained model expects
    // weekly hours, so we convert on the way into the scorer — see
    // signalsForModel().
    const DEFAULTS = {
      hours: 8, sleep: 7,
      // All 1–10 sliders start in the middle so the user has to actively
      // place themselves rather than nudge from a random pre-set.
      mood: 5, stress: 5,
      mgr_support: 5, peer_support: 5,
      deadline_pressure: 5,
      on_call_load: 0,
    };
    /* Life-context chips shown on the wizard's "what's putting pressure
       on you" screen. We keep the keys short and snake_case for storage
       but show warm, supportive labels.

       `none` is an exclusive option: tapping it clears everything else,
       and tapping any other chip clears `none`. See toggleEvent below.

       The model was trained on a smaller event vocabulary
       (deadline_crunch, reorg, layoff, pto, personal_shock,
       recognition). EVENT_TO_MODEL maps each user-friendly chip to
       whichever model event it most closely resembles so the trained
       scorer still gets the right signal. Chips that don't map (bad
       sleep, work stress, feeling good, etc.) influence the model
       only through the slider answers — which is exactly right
       because those things are already measured on the sliders. */
    const EVENTS = [
      { key: 'exams',          label: 'Exams / deadlines' },
      { key: 'bad_sleep',      label: 'Bad sleep' },
      { key: 'overwhelm',      label: 'Too much going on' },
      { key: 'work_stress',    label: 'Work stress' },
      { key: 'family',         label: 'Family stuff' },
      { key: 'relationship',   label: 'Relationship issues' },
      { key: 'unmotivated',    label: 'Feeling unmotivated' },
      { key: 'social_burnout', label: 'Social burnout' },
      { key: 'big_change',     label: 'Big life change' },
      { key: 'health',         label: 'Health issues' },
      { key: 'finances',       label: 'Financial stress' },
      { key: 'travel',         label: 'Traveling / routine change' },
      { key: 'conflict',       label: 'Conflict with someone' },
      { key: 'pto',            label: 'Taking time off' },
      { key: 'good',           label: 'Actually feeling good lately' },
      { key: 'none',           label: 'Nothing specific' },
    ];

    const EVENT_EXCLUSIVE = 'none';

    const EVENT_TO_MODEL = {
      exams:          'deadline_crunch',
      pto:            'pto',
      big_change:     'reorg',
      family:         'personal_shock',
      relationship:   'personal_shock',
      social_burnout: 'personal_shock',
      health:         'personal_shock',
      finances:       'personal_shock',
      conflict:       'personal_shock',
      good:           'recognition',
    };

    /* Translate user-facing chip keys into the trained-model
       event vocabulary. Anything not in the map drops out silently. */
    function eventsForModel(userEvents) {
      const set = userEvents instanceof Set ? userEvents : new Set(userEvents || []);
      const out = new Set();
      for (const k of set) {
        const mapped = EVENT_TO_MODEL[k];
        if (mapped) out.add(mapped);
      }
      return out;
    }

    /* =========================================================
       Small reusable components
       ========================================================= */
    function Avatar({ name, color, size }) {
      const cls = size === 'lg' ? 'avatar lg'
                : size === 'xl' ? 'avatar xl'
                : size === 'sm' ? 'avatar sm' : 'avatar';
      return (
        <span className={cls} style={{ background: color || colorFor(name) }}>
          {initialsOf(name)}
        </span>
      );
    }

    function Sparkline({ data }) {
      if (!data || data.length < 2) {
        return (
          <div style={{ height: 80, display: 'flex',
                        alignItems: 'center', justifyContent: 'center',
                        color: 'var(--text-soft)', fontSize: 12 }}>
            Need at least 2 check-ins for the trend line.
          </div>
        );
      }
      const W = 480, H = 80, P = 6;
      const xs = data.map((_, i) => P + i * (W - 2 * P) / (data.length - 1));
      const ys = data.map(d => H - P - d.risk * (H - 2 * P));
      const path = xs.map((x, i) =>
        `${i === 0 ? 'M' : 'L'}${x.toFixed(1)},${ys[i].toFixed(1)}`).join(' ');
      const areaPath = path + ` L${xs[xs.length-1].toFixed(1)},${H-P} L${xs[0].toFixed(1)},${H-P} Z`;
      return (
        <svg className="spark" viewBox={`0 0 ${W} ${H}`} preserveAspectRatio="none">
          <defs>
            <linearGradient id="sparkfill" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%"   stopColor="var(--primary)" stopOpacity="0.25" />
              <stop offset="100%" stopColor="var(--primary)" stopOpacity="0" />
            </linearGradient>
          </defs>
          <path d={areaPath} fill="url(#sparkfill)" />
          <path d={path} fill="none" stroke="var(--primary)" strokeWidth="2.5"
                strokeLinecap="round" strokeLinejoin="round" />
          {xs.map((x, i) => (
            <circle key={i} cx={x} cy={ys[i]} r="3" fill="var(--primary)" />
          ))}
        </svg>
      );
    }

    /* =========================================================
       PIN PAD
       ========================================================= */
    function PinPad({ length = 4, onComplete, error, onClearError }) {
      const [pin, setPin] = useState('');
      useEffect(() => {
        if (pin.length === length) {
          onComplete(pin);
          setPin('');
        }
      }, [pin, length, onComplete]);
      useEffect(() => {
        if (error) {
          const t = setTimeout(() => { onClearError && onClearError(); }, 1200);
          return () => clearTimeout(t);
        }
      }, [error]);

      const press = (n) => setPin(p => p.length < length ? p + n : p);
      const back  = ()  => setPin(p => p.slice(0, -1));

      return (
        <>
          <div className="pin-dots">
            {Array.from({ length }).map((_, i) => (
              <div key={i} className={
                `pin-dot ${i < pin.length ? 'filled' : ''} ${error ? 'error' : ''}`
              } />
            ))}
          </div>
          <div className="pin-error">{error || ''}</div>

    function LoginScreen({ profiles, onSignIn, onCreateProfile, onWipe, onTransientToast }) {
      const [mode, setMode]   = useState(profiles.length === 0 ? 'signup' : 'signin');
      const [name, setName]   = useState('');
      const [email, setEmail] = useState('');
      const [pwd, setPwd]     = useState('');
      const [showPwd, setShowPwd] = useState(false);
      const [error, setError] = useState(null);
      const [busy, setBusy]   = useState(false);

      useEffect(() => { setError(null); }, [mode]);

      const submit = async () => {
        if (busy) return;
        setError(null);
        const cleanEmail = email.trim().toLowerCase();

        if (mode === 'signup') {
          const cleanName = name.trim();
          if (!cleanName) { setError('Please enter your name.'); return; }
          if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(cleanEmail)) {
            setError('Please enter a valid email.'); return;
          }
          if (pwd.length < 6) {
            setError('Password must be at least 6 characters.'); return;
          }
          if (profiles.some(p => (p.email || '').toLowerCase() === cleanEmail)) {
            setError('An account with this email already exists. Sign in instead.');
            return;
          }
          setBusy(true);
          try {
            const salt = genSalt();
            const passwordHash = await hashPin(pwd, salt);
            onCreateProfile({
              id: genProfileId(),
              name: cleanName,
              email: cleanEmail,
              personId: cleanName.toLowerCase().replace(/[^a-z0-9]+/g, '_').slice(0,32) || 'me',
              salt, passwordHash,
              color: colorFor(cleanName),
              createdAt: Date.now(),
            });
          } finally { setBusy(false); }
        } else {
          if (!cleanEmail || !pwd) {
            setError('Enter your email and password.'); return;
          }
          const profile = profiles.find(
            p => (p.email || '').toLowerCase() === cleanEmail);
          if (!profile || !profile.passwordHash) {
            setError('No account with that email.'); return;
          }
          setBusy(true);
          try {
            const h = await hashPin(pwd, profile.salt);
            if (h !== profile.passwordHash) {
              setError('Wrong password.');
            } else {
              onSignIn(profile.id);
            }
          } finally { setBusy(false); }
        }
      };

      const onKey = (e) => { if (e.key === 'Enter') submit(); };

      const googleStub = () => {
        if (onTransientToast) {
          onTransientToast('Google sign-in coming soon — for now use email + password.');
        } else {
          alert('Google sign-in coming soon — for now use email + password.');
        }
      };

      return (
        <div className="auth">
          <div className="auth-brand">
            <span className="auth-brand-logo"><BrainLogo /></span>
            <span className="auth-brand-name">WellCare</span>
          </div>

          <h1 className="auth-title">
            {mode === 'signup' ? 'Build your safety net' : 'Welcome back'}
          </h1>
          <div className="auth-sub">
            {mode === 'signup'
              ? 'Create an account to start tracking your emotional state.'
              : 'Sign in to continue your check-in journey.'}
          </div>

          <div className="auth-card">
            {mode === 'signup' && (
              <div className="auth-field">
                <label className="auth-field-label">Your Name</label>
                <div className="auth-input-wrap">
                  <IconPerson />
                  <input type="text" autoComplete="name"
                         placeholder="How should we call you?"
                         maxLength={32}
                         value={name}
                         onChange={e => setName(e.target.value)}
                         onKeyDown={onKey} />
                </div>
              </div>
            )}

            <div className="auth-field">
              <label className="auth-field-label">Email</label>
              <div className="auth-input-wrap">
                <IconMail />
                <input type="email" autoComplete="email"
                       placeholder="you@example.com"
                       value={email}
                       onChange={e => setEmail(e.target.value)}
                       onKeyDown={onKey} />
              </div>
            </div>

            <div className="auth-field">
              <label className="auth-field-label">Password</label>
              <div className="auth-input-wrap">
                <IconLock />
                <input type={showPwd ? 'text' : 'password'}
                       autoComplete={mode === 'signup'
                         ? 'new-password' : 'current-password'}
                       placeholder={mode === 'signup'
                         ? 'At least 6 characters'
                         : 'Your password'}
                       value={pwd}
                       onChange={e => setPwd(e.target.value)}
                       onKeyDown={onKey} />
                <button type="button" className="pwd-toggle"
                        onClick={() => setShowPwd(s => !s)}
                        aria-label={showPwd ? 'Hide password' : 'Show password'}>
                  <IconEye open={showPwd} />
                </button>
              </div>
            </div>

            {error && <div className="auth-error">{error}</div>}

            <button className="auth-cta" onClick={submit} disabled={busy}>
              {busy
                ? 'Just a moment…'
                : mode === 'signup' ? 'Get Started' : 'Sign In'}
              {!busy && (
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                  <path d="M5 12h14M13 6l6 6-6 6"
                        stroke="currentColor" strokeWidth="2"
                        strokeLinecap="round" strokeLinejoin="round"/>
                </svg>
              )}
            </button>

            <div className="auth-divider"><span>or</span></div>

            <button type="button" className="auth-google" onClick={googleStub}>
              <GoogleG />
              {mode === 'signup' ? 'Sign up with Google' : 'Sign in with Google'}
            </button>
          </div>

          <div className="auth-foot">
            {mode === 'signup' ? (
              <>Already have an account?{' '}
                <button onClick={() => setMode('signin')}>Sign in</button>
              </>
            ) : (
              <>New here?{' '}
                <button onClick={() => setMode('signup')}>Sign up</button>
              </>
            )}
          </div>

          <button className="reset-link"
                  onClick={() => {
                    if (confirm('Wipe all accounts and check-ins on this device?')) {
                      onWipe();
                    }
                  }}>
            Start fresh — wipe everything
          </button>
        </div>
      );
    }

    /* =========================================================
       CHECK-IN WIZARD
       One question per screen. The user moves forward by tapping
       Continue; Back returns to the previous question. Defaults
       sit in the middle of each scale so the user has to actively
       answer instead of nudging a pre-set value.
       ========================================================= */
    const QUESTIONS = [
      { id: 'hours', kind: 'number',
        q: 'How many hours did you work today?',
        hint: 'Meetings, focus time, on-call — just today. 8 is a normal day.',
        min: 0, max: 16, step: 0.5, unit: 'hours today' },
      { id: 'sleep', kind: 'number',
        q: 'How many hours did you sleep last night?',
        hint: '7 is a healthy night. Naps don\'t count.',
        min: 3, max: 11, step: 0.5, unit: 'hours last night' },
      { id: 'on_call_load', kind: 'segmented',
        q: 'Are you on-call today?',
        hint: 'How much are pages or rotations cutting into your day?',
        options: [{ v: 0, l: 'No' }, { v: 0.6, l: 'A bit' }, { v: 1.2, l: 'Heavily' }] },
      { id: 'mood', kind: 'slider',
        q: 'How is your mood right now?',
        loEnd: 'low', hiEnd: 'high' },
      { id: 'stress', kind: 'slider',
        q: 'How stressed do you feel today?',
        loEnd: 'calm', hiEnd: 'at limit' },
      { id: 'deadline_pressure', kind: 'slider',
        q: 'How heavy is today\'s workload?',
        loEnd: 'none', hiEnd: 'crushing' },
      { id: 'mgr_support', kind: 'slider',
        q: 'How supported by your manager today?',
        loEnd: 'low', hiEnd: 'strong' },
      { id: 'peer_support', kind: 'slider',
        q: 'How supported by your team today?',
        loEnd: 'low', hiEnd: 'strong' },
      { id: 'feeling', kind: 'feeling',
        q: 'Right now, how are you holding up?',
        hint: 'Your gut feeling matters.',
        options: [{ v: 'fine', l: 'Fine' },
                  { v: 'managing', l: 'Managing' },
                  { v: 'burned', l: 'Burned out' }] },
      { id: 'events', kind: 'chips',
        q: 'Anything putting extra pressure on you recently?',
        hint: 'Pick anything that\u2019s been affecting your stress, energy, or routine lately.' },
      { id: 'notes', kind: 'notes',
        q: 'Anything you want to remember about today?',
        hint: 'Optional. The story behind the numbers.' },
    ];

    function NumField({ label, hint, value, min, max, step, onChange }) {
      // Uncontrolled-ish: we keep a local string so the user can type "5."
      // mid-edit without React snapping it back. We commit on blur (and on
      // every valid keystroke). Avoids the dreaded "page jumps on number
      // change" feel — the input no longer round-trips through React state
      // for the raw text.
      const [text, setText] = React.useState(String(value));
      const lastCommitted = React.useRef(value);

      React.useEffect(() => {
        if (value !== lastCommitted.current) {
          setText(String(value));
          lastCommitted.current = value;
        }
      }, [value]);

      const commit = (raw) => {
        const n = parseFloat(raw);
        if (!Number.isFinite(n)) return;
        const clamped = Math.max(min, Math.min(max, n));
        const rounded = step >= 1 ? Math.round(clamped) : Math.round(clamped * 2) / 2;
        lastCommitted.current = rounded;
        onChange(rounded);
        setText(String(rounded));
      };

      const bump = (d) => {
        const cur = Number.isFinite(parseFloat(text)) ? parseFloat(text) : value;
        commit(cur + d);
      };

      return (
        <div className="num-field">
          {hint && <div className="field-hint">{hint}</div>}
          <div className="num-field-row">
            <button type="button" className="stepper-btn"
                    onClick={() => bump(-step)}
                    disabled={value <= min}>−</button>
            <input type="text"
                   inputMode="decimal"
                   className="big-num-input"
                   value={text}
                   onChange={e => {
                     const v = e.target.value.replace(/[^\d.]/g, '');
                     setText(v);
                     const n = parseFloat(v);
                     if (Number.isFinite(n) && n >= min && n <= max) {
                       lastCommitted.current = n;
                       onChange(n);
                     }
                   }}
                   onBlur={() => commit(text)} />
            <button type="button" className="stepper-btn"
                    onClick={() => bump(+step)}
                    disabled={value >= max}>+</button>
          </div>
          {label && <div className="num-unit">{label}</div>}
        </div>
      );
    }

    function Slider({ value, onChange, loEnd, hiEnd }) {
      const pct = ((value - 1) / 9) * 100;
      // Clamp the bubble so it never overhangs the track at the extremes.
      const bubblePct = Math.max(4, Math.min(96, pct));
      return (
        <div className="big-slider">
          <div className="big-slider-value" style={{
            left: `calc(${bubblePct}% - 22px)`,
          }}>{value}</div>
          <input type="range" className="slider"
                 min="1" max="10" step="1"
                 value={value}
                 style={{ ['--pct']: `${pct}%` }}
                 onChange={e => onChange(+e.target.value)} />
          <div className="scale-ends">
            <span>{loEnd}</span>
            <span>{hiEnd}</span>
          </div>
        </div>
      );
    }

    /* Render a single question. The container is keyed by step in the
       wizard so each question slide-animates in. */
    function QuestionView({ q, signals, set, feeling, setFeeling,
                            events, toggleEvent, notes, setNotes }) {
      return (
        <div className="q-screen">
          <h2 className="q-title">{q.q}</h2>
          {q.hint && <div className="q-hint">{q.hint}</div>}
          <div className="q-input">
            {q.kind === 'number' && (
              <NumField
                label={q.unit || ''}
                value={signals[q.id]}
                min={q.min} max={q.max} step={q.step}
                onChange={v => set(q.id, v)} />
            )}
            {q.kind === 'slider' && (
              <Slider
                value={signals[q.id]}
                onChange={v => set(q.id, v)}
                loEnd={q.loEnd} hiEnd={q.hiEnd} />
            )}
            {q.kind === 'segmented' && (
              <div className="seg seg-big">
                {q.options.map(o => (
                  <button key={o.v} type="button"
                          className={signals[q.id] === o.v ? 'active' : ''}
                          onClick={() => set(q.id, o.v)}>
                    {o.l}
                  </button>
                ))}
              </div>
            )}
            {q.kind === 'feeling' && (
              <div className="seg seg-big">
                {q.options.map(o => (
                  <button key={o.v} type="button"
                          className={feeling === o.v ? 'active' : ''}
                          onClick={() => setFeeling(o.v)}>
                    {o.l}
                  </button>
                ))}
              </div>
            )}
            {q.kind === 'chips' && (
              <div className="chips chips-big">
                {EVENTS.map(ev => (
                  <button key={ev.key} type="button"
                          className={`chip ${events.has(ev.key) ? 'active' : ''}`}
                          onClick={() => toggleEvent(ev.key)}>
                    {ev.label}
                  </button>
                ))}
              </div>
            )}
            {q.kind === 'notes' && (
              <textarea className="notes-input notes-big"
                        placeholder="A line or two — what was the story?"
                        value={notes}
                        maxLength={400}
                        onChange={e => setNotes(e.target.value)} />
            )}
          </div>
        </div>
      );
    }

    function CheckinWizard({ initialSignals, initialFeeling, onCancel, onComplete }) {
      const [step, setStep]       = useState(0);
      const [signals, setSignals] = useState(initialSignals);
      const [feeling, setFeeling] = useState(initialFeeling);
      const [events,  setEvents]  = useState(() => new Set());
      const [notes,   setNotes]   = useState('');

      const set = React.useCallback(
        (k, v) => setSignals(s => ({ ...s, [k]: v })),
        []);
      const toggleEvent = React.useCallback(k => setEvents(prev => {
        const n = new Set(prev);
        // "Nothing specific" is exclusive: selecting it wipes the rest,
        // and selecting anything else implicitly un-selects it.
        if (k === EVENT_EXCLUSIVE) {
          if (n.has(EVENT_EXCLUSIVE)) {
            n.delete(EVENT_EXCLUSIVE);
          } else {
            n.clear();
            n.add(EVENT_EXCLUSIVE);
          }
        } else {
          n.delete(EVENT_EXCLUSIVE);
          n.has(k) ? n.delete(k) : n.add(k);
        }
        return n;
      }), []);

      // Wizard slide-in plays once, on mount only.
      const enterRef = useRef(true);
      useEffect(() => { enterRef.current = false; }, []);

      const total = QUESTIONS.length;
      const isLast = step === total - 1;
      const q = QUESTIONS[step];
      const progress = ((step + 1) / total) * 100;

      const next = () => {
        if (isLast) {
          onComplete({ signals, feeling, events: [...events], notes });
        } else {
          setStep(s => s + 1);
        }
      };

      return (
        <div className={`wizard${enterRef.current ? ' enter' : ''}`}>
          <div className="wizard-top">
            <button className="icon-btn solid" aria-label="Close" onClick={onCancel}>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                <path d="M6 6l12 12M18 6L6 18" stroke="currentColor"
                      strokeWidth="2" strokeLinecap="round" />
              </svg>
            </button>
            <div className="wizard-progress-bar">
              <div className="wizard-progress-fill"
                   style={{ width: `${progress}%` }} />
            </div>
            <span className="wizard-count">
              {step + 1}<span style={{ opacity: 0.5 }}> / {total}</span>
            </span>
          </div>

          <div className="wizard-body">
            <QuestionView
              key={step}
              q={q}
              signals={signals} set={set}
              feeling={feeling} setFeeling={setFeeling}
              events={events} toggleEvent={toggleEvent}
              notes={notes} setNotes={setNotes} />
          </div>

          <div className="wizard-bottom">
            {step > 0 ? (
              <button className="cta secondary back-btn"
                      onClick={() => setStep(s => s - 1)}>
                Back
              </button>
            ) : (
              <button className="cta secondary back-btn" onClick={onCancel}>
                Cancel
              </button>
            )}
            <button className="cta next-btn" onClick={next}>
              {isLast ? 'Save check-in' : 'Continue'}
            </button>
          </div>
        </div>
      );
    }

    function EngineSourceStrip({ info, compact }) {
      if (!info) return null;
      return (
        <div className={'engine-source-strip' + (compact ? ' is-compact' : '')}>
          <div className="engine-source-head">{info.title}</div>
          {info.paths.map((line, i) => (
            <div key={i} className="engine-source-path">{line}</div>
          ))}
        </div>
      );
    }

          <div className="result-body">
            <span className="badge muted" style={{ marginBottom: 10, display: 'inline-flex' }}>

            <EngineSourceStrip info={engineSource} compact />
            {hybridExplain && (
              <div className="card" style={{ marginBottom: 16 }}>

            {reasonDrivers.length > 0 && (

                <h3>Signals we weighted</h3>
